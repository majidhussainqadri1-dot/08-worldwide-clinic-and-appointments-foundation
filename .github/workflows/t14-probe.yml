name: File 08 T14 Targeted Probe
on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
      - name: Targeted source probes
        shell: bash
        run: |
          set +e
          echo '=== caller map: revoke_consent ==='
          grep -RIn 'revoke_consent' --include='*.php' .
          echo '=== caller map: bump_version ==='
          grep -RIn 'bump_version' --include='*.php' .
          echo '=== caller map: doctor_ids/requestable_doctor_ids ==='
          grep -RInE '(doctor_ids\(|requestable_doctor_ids\()' --include='*.php' .
          echo '=== Future24 utc definition/use ==='
          grep -nE 'function utc|self::utc' includes/class-wca-future24.php
          echo '=== heatmap REST ==='
          grep -nE 'rest_heatmap|heatmap\(' includes/class-wca-future24.php
          echo '=== analytics appointment helpers ==='
          grep -nE 'analytics_appointments|clinic_appointments_between_all|posts_per_page.*2000|2000' includes/class-wca-future24.php
          echo '=== strict timezone callers ==='
          grep -RInE 'valid_timezone\(' includes --include='*.php'
          echo '=== direct update_post_meta not in strict helper ==='
          grep -RIn 'update_post_meta' includes --include='*.php'
          echo '=== direct update_user_meta ==='
          grep -RIn 'update_user_meta' includes --include='*.php'
          echo '=== raw wp_delete_post ==='
          grep -RIn 'wp_delete_post' includes --include='*.php'
          echo '=== Future24 status writer data ==='
          grep -nE "'status'.*sanitize_key|put_record\(" includes/class-wca-future24.php | head -120
          echo '=== TTL clamps ==='
          grep -RInE "ttl.*min|min\(.*ttl|expires_at.*min" includes --include='*.php'
          echo '=== public ref regex ==='
          grep -RIn "0-9a-f.*36" includes --include='*.php' | head -200
