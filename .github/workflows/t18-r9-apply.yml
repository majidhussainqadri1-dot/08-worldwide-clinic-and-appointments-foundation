name: File 08 T18 R9 Apply Frozen Ledger
on:
  push:
    branches: [review/file08-t18-ten-round-2026-09-06]
    paths: [.github/workflows/t18-r9-apply.yml, .github/scripts/t18-r9-privacy-subject-boundary-correct.py]
permissions:
  contents: write
jobs:
  apply-fix-regress-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - name: Freeze pre-fix head
        run: git rev-parse HEAD
      - name: Apply complete frozen R9 ledger
        run: python3 .github/scripts/t18-r9-privacy-subject-boundary-correct.py
      - name: Repair R9 regression harness literals
        run: |
          cat > tests/t18-r9-privacy-subject-boundary-regressions.php <<'PHP'
          <?php
          $root=dirname(__DIR__);
          $w=file_get_contents($root.'/includes/class-wca-privacy.php');
          $l=file_get_contents($root.'/includes/class-swc-privacy.php');
          $d=chr(36);
          $checks=array(
           'appointment erasure is relationship-aware'=>strpos($w,$d.'is_patient =')!==false && strpos($w,$d.'is_guardian =')!==false && strpos($w,$d.'is_doctor =')!==false,
           'patient fields use patient-scoped delete operation'=>strpos($w,'wca_privacy_patient_meta_delete')!==false,
           'doctor private note uses doctor-scoped delete operation'=>strpos($w,'wca_privacy_doctor_meta_delete')!==false,
           'future payload scrub receives requester id'=>strpos($w,'scrub_future24_payload( '.$d.'payload, '.$d.'user_id, '.$d.'subject_uuid )')!==false,
           'future numeric identifiers are requester-value scoped'=>strpos($w,'absint( '.$d.'item ) === '.$d.'user_id')!==false,
           'legacy unconditional future identity strip removed'=>strpos($w,"array( 'subject_uuid','patient_user_id','guardian_user_id','recipient_user_id' )")===false,
           'WCA privacy clears DB stale errors'=>substr_count($w,$d."wpdb->last_error = '';")>=8,
           'SWC privacy clears DB stale errors'=>substr_count($l,$d."wpdb->last_error = '';")>=3,
          );
          foreach($checks as $n=>$ok){if(!$ok){fwrite(STDERR,"T18 R9 FAIL: {$n}\n");exit(1);}}
          echo "T18 R9 privacy subject-boundary regressions: PASS\n";
          PHP
      - name: R9 dedicated regression
        run: php -d display_errors=1 -d error_reporting=E_ALL tests/t18-r9-privacy-subject-boundary-regressions.php
      - name: Full regression
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/t18-r9-lint.txt
          php -d display_errors=1 -d error_reporting=E_ALL tests/run-all.php 2>&1 | tee /tmp/t18-r9-tests.txt
          ! grep -Eq 'PHP (Warning|Notice|Deprecated|Fatal|Parse)|Warning:|Notice:|Deprecated:' /tmp/t18-r9-tests.txt
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
          git diff --check
      - name: Commit corrected exact head
        run: |
          set -euo pipefail
          git config user.name 'Sabri File 08 Review Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add includes/class-wca-privacy.php includes/class-swc-privacy.php tests/run-all.php tests/t18-r9-privacy-subject-boundary-regressions.php
          git diff --cached --check
          git commit -m 'fix(file08): scope privacy erasure to requester data'
          git push origin HEAD:review/file08-t18-ten-round-2026-09-06
          git rev-parse HEAD
      - name: Exact-head post-commit regression
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          php -d display_errors=1 -d error_reporting=E_ALL tests/run-all.php 2>&1 | tee /tmp/t18-r9-exact.txt
          ! grep -Eq 'PHP (Warning|Notice|Deprecated|Fatal|Parse)|Warning:|Notice:|Deprecated:' /tmp/t18-r9-exact.txt
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
