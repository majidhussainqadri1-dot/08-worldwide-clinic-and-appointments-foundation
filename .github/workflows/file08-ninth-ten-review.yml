name: File 08 Ninth Review R10 Retry

on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
    paths:
      - '.github/workflows/file08-ninth-ten-review.yml'

permissions:
  contents: write

jobs:
  r10:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact R9-corrected branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip
      - name: Apply R10 corrections
        run: python3 tools/ninth-r10-close.py
      - name: Full corrected-state QA
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          php tests/run-all.php
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
          test -z "$(find . -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '*.p12' -o -name '*.b64' \) -print -quit)"
          test -z "$(find . -type l -print -quit)"
          test ! -e .gitmodules
          ! grep -RInE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' --exclude-dir=.git .
      - name: Commit exact R10 corrected source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worldwide-clinic.php includes/class-wca-contracts.php README.md STATUS.md readme.txt CHANGELOG.md tests tools/ninth-review-patches.tgz.b64 tools/ninth-r10-close.py
          git commit -m 'File 08 N9-R10: close ninth review as v1.2.9 candidate'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
