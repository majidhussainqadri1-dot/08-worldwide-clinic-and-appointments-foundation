name: File 08 Twelfth Review R19-R20 Final Sequence

on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
    paths:
      - '.github/workflows/file08-twelfth-r19-r20-final.yml'

permissions:
  contents: write

jobs:
  final-rounds:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact corrected branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip
      - name: Configure committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: R19 then R20, each followed by full corrected-state QA
        shell: bash
        run: |
          set -euo pipefail
          qa() {
            find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/file08-php-lint.log
            php tests/run-all.php 2>&1 | tee /tmp/file08-tests.log
            ! grep -E 'PHP (Warning|Notice|Deprecated|Fatal|Parse)' /tmp/file08-tests.log
            node --check assets/js/clinic.js
            node --check assets/js/continuity.js
            node --check assets/js/future24.js
            test -z "$(find . -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '*.p12' -o -name '*.b64' \) -print -quit)"
            test -z "$(find . -type l -print -quit)"
            test ! -e .gitmodules
            ! grep -RInE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' --exclude-dir=.git .
          }

          echo '===== T12-R19 canonical service/availability numeric validation ====='
          python3 tools/t12-r19-r20-final.py 19
          qa
          git add -A
          git commit -m 'File 08 T12-R19: reject silently normalized service and availability values'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
          echo "T12-R19 ACCEPTED commit=$(git rev-parse HEAD)"

          echo '===== T12-R20 disruption state/File19 projection atomicity ====='
          python3 tools/t12-r19-r20-final.py 20
          qa
          git add -A
          git commit -m 'File 08 T12-R20: make disruption notifications atomic and fail closed'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
          echo "T12-R20 ACCEPTED commit=$(git rev-parse HEAD)"
