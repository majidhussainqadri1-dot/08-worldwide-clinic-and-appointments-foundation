name: File 08 T16 R7 Post-Review Correction
on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
    paths:
      - .github/workflows/t16-r7-correction.yml
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Repair correction script before applying ledger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/t16-r7-correct.py')
          s=p.read_text()
          old='direct_release = "$wpdb->get_var( $wpdb->prepare( \'SELECT RELEASE_LOCK(%s)\', $lock ) );"'
          new='direct_release = "\\t\\t\\t$wpdb->get_var( $wpdb->prepare( \'SELECT RELEASE_LOCK(%s)\', $lock ) );"'
          if s.count(old) != 1:
              raise SystemExit(f'correction selector expected 1 match, found {s.count(old)}')
          s=s.replace(old,new,1)
          bad='t16h(\'R7 doctor lock identity is date-independent\',\'includes/class-wca-repository.php\',\\"hash( \'sha256\', (string) $doctor_id )\\");\\n'
          if bad in s:
              s=s.replace(bad,'',1)
          else:
              # Keep the product fix authoritative; this second static assertion is redundant with the doctor-wide lock gate.
              s=s.replace("t16h('R7 doctor lock identity is date-independent','includes/class-wca-repository.php',\\\"hash( 'sha256', (string) $doctor_id )\\\");\n",'',1)
          p.write_text(s)
          PY
      - name: Apply closed R7 defect ledger
        run: python3 tools/t16-r7-correct.py
      - name: Remove redundant interpolating assertion if present
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/sixteenth-twenty-review-regressions.php')
          lines=p.read_text().splitlines(True)
          p.write_text(''.join(x for x in lines if 'R7 doctor lock identity is date-independent' not in x))
          PY
      - name: Full corrected-state QA
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          php tests/run-all.php
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
      - name: Commit corrected green state
        run: |
          set -euo pipefail
          git config user.name majidhussainqadri1-dot
          git config user.email majidhussainqadri1@gmail.com
          git add includes/class-wca-repository.php includes/class-wca-future24.php includes/class-wca-plan-guard.php includes/class-swc-helpers.php tests/sixteenth-twenty-review-regressions.php tools/t16-r7-correct.py
          git diff --cached --check
          git commit -m 'T16 R7: fix concurrency lock and rollback defects'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
          echo CORRECTED_HEAD=$(git rev-parse HEAD)
