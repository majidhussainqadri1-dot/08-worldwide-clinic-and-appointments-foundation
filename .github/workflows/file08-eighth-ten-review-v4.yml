name: File 08 Eighth Fresh Ten-Round Sequential Review v4

on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
    paths:
      - '.github/workflows/file08-eighth-ten-review-v4.yml'

permissions:
  contents: write

jobs:
  sequential-review:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout review branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip

      - name: Reconstruct exact reviewed patcher
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/eighth-review-patcher.gz.b64 | gzip -d > /tmp/file08-eighth-patcher.py
          python3 -m py_compile /tmp/file08-eighth-patcher.py

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Sequential review fix and retest
        shell: bash
        run: |
          set -euo pipefail
          qa() {
            find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
            php tests/run-all.php
            node --check assets/js/clinic.js
            node --check assets/js/continuity.js
            node --check assets/js/future24.js
            test -z "$(find . -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '*.p12' \) -print -quit)"
            test -z "$(find . -type l -print -quit)"
            test ! -e .gitmodules
            ! grep -RInE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' --exclude-dir=.git .
          }
          messages=(
            'remove doctor suspension scan ceiling'
            'remove verification reconciliation clinic ceiling'
            'make follow-up reminders complete and transactional'
            'reject oversized Future24 operational payloads'
            'serialize practitioner public-ref creation'
            'prevent multi-rule and timezone slot starvation'
            'reproject exact held slot and preserve true replay'
            'serialize waitlist semantic deduplication'
            'serialize scheduling-window semantic deduplication'
            'make support participant creation atomic and deduplicated'
          )
          for round in $(seq 1 10); do
            echo "=== E8-R${round} ==="
            python3 /tmp/file08-eighth-patcher.py "$round"
            if [ "$round" = "7" ]; then
              python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/ten-review-regressions.php')
          s=p.read_text()
          old="""r10has('hold leading reprojection',$plan,\"strtotime( \\$start . ' UTC' ) - DAY_IN_SECONDS\");
          r10has('hold trailing reprojection',$plan,\"strtotime( \\$end . ' UTC' ) + DAY_IN_SECONDS\");
          r10has('hold reprojection UTC',$plan,\"\\$query['timezone']  = 'UTC'\");
          r10has('exact slot evidence match',$plan,'hash_equals( $slot_ref');"""
          new="""r10has('exact rule slot reprojection',$plan,'WCA_Service::project_rule_slot( $rule, $start, $end, $duration, \'UTC\', $repository_key )');
          r10has('hold replay namespaced before projection',$plan,\"$repository_key = 'p' . absint( $patient_user_id )\");
          r10has('canonical service duration used',$plan,\"$service['duration_minutes']\");
          r10has('exact slot evidence match',$plan,'hash_equals( $slot_ref');"""
          if old not in s:
              raise SystemExit('R7 legacy hold assertions not found')
          p.write_text(s.replace(old,new))
          PY
            fi
            qa
            git add includes/ tests/ten-review-regressions.php
            git commit -m "File 08 eighth review R${round}: ${messages[$((round-1))]}"
          done
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
