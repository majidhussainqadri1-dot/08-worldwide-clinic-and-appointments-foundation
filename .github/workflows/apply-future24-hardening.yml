name: Apply File 08 Future24 Hardening
on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
    paths:
      - '.codex/future24-hardening.part*'
      - '.codex/future24-hardening.rest*'
      - '.github/workflows/apply-future24-hardening.yml'
permissions:
  contents: write
concurrency:
  group: file08-future24-hardening
  cancel-in-progress: false
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Materialize and verify reviewed Future24 hardening
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .codex/future24-hardening.part00 \
            .codex/future24-hardening.part01 \
            .codex/future24-hardening.part02 \
            .codex/future24-hardening.part03 \
            .codex/future24-hardening.rest00 \
            .codex/future24-hardening.rest01 \
            .codex/future24-hardening.rest02 \
            .codex/future24-hardening.rest03 \
            .codex/future24-hardening.rest04 \
            | base64 -d > /tmp/future24-hardening.tar.gz
          echo 'f0677a080b6f6e567710e71d08125b3d0db4f188cbb79b11a80033d0b77907f3  /tmp/future24-hardening.tar.gz' | sha256sum -c -
          tar -xzf /tmp/future24-hardening.tar.gz -C .
          git restore --source=HEAD -- .github/workflows/file08-complete-quality.yml .github/workflows/apply-future24-hardening.yml
          rm -f \
            .codex/future24-hardening-overlay.b64 \
            .codex/future24-hardening.part00 \
            .codex/future24-hardening.part01 \
            .codex/future24-hardening.part02 \
            .codex/future24-hardening.part03 \
            .codex/future24-hardening.rest00 \
            .codex/future24-hardening.rest01 \
            .codex/future24-hardening.rest02 \
            .codex/future24-hardening.rest03 \
            .codex/future24-hardening.rest04
          php -l includes/class-wca-future24.php
          php -l tests/future24.php
          php tests/future24.php
          node --check assets/js/future24.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(file08): close Future24 deep-review gaps'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
