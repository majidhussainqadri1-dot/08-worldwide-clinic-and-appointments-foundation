name: Apply File 08 Future24 Hardening
on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
    paths:
      - '.codex/future24-hardening-overlay.b64'
      - '.github/workflows/apply-future24-hardening.yml'
permissions:
  contents: write
concurrency:
  group: file08-future24-hardening
  cancel-in-progress: false
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Materialize and verify reviewed Future24 hardening
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .codex/future24-hardening-overlay.b64 > /tmp/future24-hardening.tar.gz
          tar -xzf /tmp/future24-hardening.tar.gz -C .
          git restore --source=HEAD -- .github/workflows/file08-complete-quality.yml .github/workflows/apply-future24-hardening.yml
          rm -f .codex/future24-hardening-overlay.b64
          php -l includes/class-wca-future24.php
          php -l tests/future24.php
          php tests/future24.php
          node --check assets/js/future24.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(file08): close Future24 deep-review gaps'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
