name: File 08 T18 R3 Apply Frozen Ledger
on:
  push:
    branches:
      - review/file08-t18-ten-round-2026-09-06
    paths:
      - .github/workflows/t18-r3-apply.yml
permissions:
  contents: write
jobs:
  apply-fix-regress-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Freeze pre-fix head
        run: git rev-parse HEAD
      - name: Apply complete frozen R3 ledger
        run: python3 .github/scripts/t18-r3-booking-timezone-correct.py
      - name: Repair generated R3 regression literal needles
        run: |
          cat > tests/t18-r3-booking-timezone-regressions.php <<'PHP'
          <?php
          $root = dirname(__DIR__);
          $front = file_get_contents($root . '/includes/class-wca-frontend.php');
          $plugin = file_get_contents($root . '/includes/class-wca-plugin.php');
          $js = file_get_contents($root . '/assets/js/clinic.js');
          $checks = array(
              'server booking timezone falls back to UTC if invalid' => strpos($front, 'if ( ! WCA_Service::valid_timezone( $default_timezone ) ) { $default_timezone = ' . chr(39) . 'UTC' . chr(39) . '; }') !== false,
              'booking field uses validated default timezone' => strpos($front, 'esc_attr( $default_timezone )') !== false,
              'localized runtime timezone is validated' => strpos($plugin, 'if ( ! WCA_Service::valid_timezone( $runtime_timezone ) ) { $runtime_timezone = ' . chr(39) . 'UTC' . chr(39) . '; }') !== false,
              'browser timezone preferred for patient-local scheduling' => strpos($js, 'var browserTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone') !== false && strpos($js, 'if (browserTimezone) tz.value = browserTimezone;') !== false,
              'old UTC-only browser override removed' => strpos($js, "(!tz.value || tz.value === 'UTC')") === false,
          );
          foreach ($checks as $name=>$ok) { if (!$ok) { fwrite(STDERR,"T18 R3 FAIL: {$name}\n"); exit(1); } }
          echo "T18 R3 booking timezone regressions: PASS\n";
          PHP
      - name: R3 dedicated regression
        run: php -d display_errors=1 -d error_reporting=E_ALL tests/t18-r3-booking-timezone-regressions.php
      - name: Full regression
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/t18-r3-lint.txt
          php -d display_errors=1 -d error_reporting=E_ALL tests/run-all.php | tee /tmp/t18-r3-tests.txt
          ! grep -Eq 'PHP (Warning|Notice|Deprecated|Fatal|Parse)|Warning:|Notice:|Deprecated:' /tmp/t18-r3-tests.txt
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
          git diff --check
      - name: Commit corrected exact head
        run: |
          set -euo pipefail
          git config user.name 'Sabri File 08 Review Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add includes/class-wca-frontend.php includes/class-wca-plugin.php assets/js/clinic.js tests/run-all.php tests/t18-r3-booking-timezone-regressions.php
          git diff --cached --check
          git commit -m 'fix(file08): enforce patient-local valid booking timezone'
          git push origin HEAD:review/file08-t18-ten-round-2026-09-06
          echo "CORRECTED_HEAD=$(git rev-parse HEAD)"
      - name: Exact-head post-commit regression
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          php -d display_errors=1 -d error_reporting=E_ALL tests/run-all.php | tee /tmp/t18-r3-exact-head.txt
          ! grep -Eq 'PHP (Warning|Notice|Deprecated|Fatal|Parse)|Warning:|Notice:|Deprecated:' /tmp/t18-r3-exact-head.txt
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
          git diff --check
