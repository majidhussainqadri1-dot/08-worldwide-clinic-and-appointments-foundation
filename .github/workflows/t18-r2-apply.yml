name: File 08 T18 R2 Apply Frozen Ledger
on:
  push:
    branches:
      - review/file08-t18-ten-round-2026-09-06
    paths:
      - .github/workflows/t18-r2-apply.yml
permissions:
  contents: write
jobs:
  apply-fix-regress-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Freeze pre-fix head
        run: git rev-parse HEAD
      - name: Apply complete frozen R2 ledger
        run: python3 .github/scripts/t18-r2-appointment-list-auth-correct.py
      - name: R2 dedicated regression
        run: php -d display_errors=1 -d error_reporting=E_ALL tests/t18-r2-appointment-list-authorization-regressions.php
      - name: Full regression
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/t18-r2-lint.txt
          php -d display_errors=1 -d error_reporting=E_ALL tests/run-all.php | tee /tmp/t18-r2-tests.txt
          ! grep -Eq 'PHP (Warning|Notice|Deprecated|Fatal|Parse)|Warning:|Notice:|Deprecated:' /tmp/t18-r2-tests.txt
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
          git diff --check
      - name: Commit corrected exact head
        run: |
          set -euo pipefail
          git config user.name 'Sabri File 08 Review Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add includes/class-wca-frontend.php tests/run-all.php tests/t18-r2-appointment-list-authorization-regressions.php
          git diff --cached --check
          git commit -m 'fix(file08): revalidate appointment list authorization'
          git push origin HEAD:review/file08-t18-ten-round-2026-09-06
          echo "CORRECTED_HEAD=$(git rev-parse HEAD)"
      - name: Exact-head post-commit regression
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          php -d display_errors=1 -d error_reporting=E_ALL tests/run-all.php | tee /tmp/t18-r2-exact-head.txt
          ! grep -Eq 'PHP (Warning|Notice|Deprecated|Fatal|Parse)|Warning:|Notice:|Deprecated:' /tmp/t18-r2-exact-head.txt
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
          git diff --check
