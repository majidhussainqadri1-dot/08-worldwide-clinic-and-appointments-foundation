name: File 08 T20 R5 Frozen Ledger Correction
on:
  push:
    branches: [review/file08-t20-twenty-round-2026-09-07]
    paths:
      - .github/scripts/t20-r5-fix.py
      - .github/workflows/t20-r5-correct.yml
permissions:
  contents: write
concurrency:
  group: file08-t20-r5-correct
  cancel-in-progress: false
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none, extensions: zip}
      - name: Apply frozen R5 corrections
        run: python3 .github/scripts/t20-r5-fix.py
      - name: PHP syntax
        run: php -l includes/class-wca-rest.php && php -l includes/class-wca-opaque-api.php && php -l tests/t20-r5-idempotency-header-parity-regressions.php
      - name: Targeted R5 regression
        run: php tests/t20-r5-idempotency-header-parity-regressions.php
      - name: Commit non-runner R5 correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-wca-rest.php includes/class-wca-opaque-api.php tests/run-all.php tests/t20-r5-idempotency-header-parity-regressions.php
          git commit -m "fix(file08): close T20 R5 idempotency header parity ledger"
          git push origin HEAD:review/file08-t20-twenty-round-2026-09-07
