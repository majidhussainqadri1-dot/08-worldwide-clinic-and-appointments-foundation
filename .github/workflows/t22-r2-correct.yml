name: T22 R2 frozen correction executor
on:
  push:
    branches:
      - review/file08-t21-ten-round-2026-09-09
permissions:
  contents: write
jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: review/file08-t21-ten-round-2026-09-09
          fetch-depth: 0
      - name: Apply frozen R2 correction batch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('includes/class-swc-helpers.php'); s=p.read_text()
          a="\t\t$defaults = array(\n\t\t\t'actor_role'     => self::actor_role(),"; b="\t\t$defaults = array(\n\t\t\t'actor_id'       => get_current_user_id(),\n\t\t\t'actor_role'     => self::actor_role(),"
          if a not in s: raise SystemExit('helper defaults anchor missing')
          s=s.replace(a,b,1)
          a="\t\t\t'actor_id'       => get_current_user_id(),\n\t\t\t'actor_role'     => sanitize_key( $args['actor_role'] ),"; b="\t\t\t'actor_id'       => absint( $args['actor_id'] ),\n\t\t\t'actor_role'     => sanitize_key( $args['actor_role'] ),"
          if a not in s: raise SystemExit('helper actor anchor missing')
          p.write_text(s.replace(a,b,1))
          p=Path('includes/class-wca-service.php'); s=p.read_text()
          a="SWC_Helpers::audit( $appointment_id, 'wca-transition', array( 'old_status' => $current, 'new_status' => $next, 'reason' => sanitize_text_field( $data['reason_code'] ?? '' ), 'details' => array( 'trace_id' => $trace ) ) )"
          b="SWC_Helpers::audit( $appointment_id, 'wca-transition', array( 'actor_id' => $actor_user_id, 'actor_role' => $actor, 'old_status' => $current, 'new_status' => $next, 'reason' => sanitize_text_field( $data['reason_code'] ?? '' ), 'details' => array( 'trace_id' => $trace ) ) )"
          if a not in s: raise SystemExit('transition audit anchor missing')
          p.write_text(s.replace(a,b,1))
          p=Path('tests/run-all.php'); s=p.read_text(); a="'t21-r10-candidate-required-payload-regressions.php' );"; b="'t21-r10-candidate-required-payload-regressions.php', 't22-r2-audit-actor-provenance-regressions.php' );"
          if a not in s: raise SystemExit('runner anchor missing')
          p.write_text(s.replace(a,b,1))
          PY
          cat > tests/t22-r2-audit-actor-provenance-regressions.php <<'PHP'
          <?php
          $root=dirname(__DIR__); $fail=array(); $checks=0;
          function r2src($p){global $root,$fail;$s=file_get_contents($root.'/'.$p);if(!is_string($s)){$fail[]='missing '.$p;return '';}return $s;}
          function r2has($l,$s,$n){global $fail,$checks;$checks++;if(false===strpos($s,$n)){$fail[]=$l;}}
          $h=r2src('includes/class-swc-helpers.php'); $s=r2src('includes/class-wca-service.php');
          r2has('audit actor default',$h,"'actor_id'       => get_current_user_id()");
          r2has('audit explicit actor persistence',$h,"'actor_id'       => absint( \$args['actor_id'] )");
          r2has('transition canonical actor audit',$s,"'actor_id' => \$actor_user_id, 'actor_role' => \$actor, 'old_status' => \$current");
          if($fail){foreach($fail as $f){fwrite(STDERR,"FAIL: $f\n");}exit(1);} echo "T22 R2 actor provenance regressions passed ($checks checks).\n";
          PHP
          rm .github/workflows/t22-r2-correct.yml
          rm -f docs/T22-R2-CORRECTION-TRIGGER.md
          php -l includes/class-swc-helpers.php
          php -l includes/class-wca-service.php
          php -l tests/t22-r2-audit-actor-provenance-regressions.php
          php tests/t22-r2-audit-actor-provenance-regressions.php
          php tests/run-all.php
      - name: Commit frozen correction batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(file08): preserve explicit transition actor in audit provenance"
          git push origin HEAD:review/file08-t21-ten-round-2026-09-09
