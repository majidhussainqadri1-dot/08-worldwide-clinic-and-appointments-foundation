name: File 08 Eleventh Review R16-R20 Closure

on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
    paths:
      - '.github/workflows/file08-eleventh-r16-closure.yml'

permissions:
  contents: write

jobs:
  close-r16-r20:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact R15-corrected branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip
      - name: Configure committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Correct R16 evidence and complete R16-R20
        shell: bash
        run: |
          set -euo pipefail
          qa() {
            find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/file08-php-lint.log
            php tests/run-all.php 2>&1 | tee /tmp/file08-tests.log
            ! grep -E 'PHP (Warning|Notice|Deprecated|Fatal|Parse)' /tmp/file08-tests.log
            node --check assets/js/clinic.js
            node --check assets/js/continuity.js
            node --check assets/js/future24.js
            test -z "$(find . -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '*.p12' -o -name '*.b64' \) -print -quit)"
            test -z "$(find . -type l -print -quit)"
            test ! -e .gitmodules
            ! grep -RInE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' --exclude-dir=.git .
          }

          echo '===== E11-R16 corrected release/test/document closure ====='
          python3 tools/eleventh-twenty-review-resume.py 16
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md'); s=p.read_text(); s=s.replace('## 1.2.11 — 2026-08-12','## 1.2.11 — 2026-08-11',1); p.write_text(s)
          p=Path('tests/eleventh-twenty-review-regressions.php'); s=p.read_text()
          old='e11has(\'appointment replay key bounds\',$service,"preg_match( \'/^[A-Za-z0-9._:-]{8,128}$/\', $idempotency_key )");'
          new='e11has(\'appointment replay key bounds\',$service,"preg_match( \'/^[A-Za-z0-9._:-]{8,128}$/\', " . \'$idempotency_key\' . \' )\');'
          if old not in s: raise SystemExit('R16 replay test literal anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          qa
          git add -A
          git commit -m 'File 08 E11-R16: align v1.2.11 release and permanent regression evidence'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
          echo "E11-R16 corrected-state QA PASS commit=$(git rev-parse HEAD)"

          echo '===== E11-R17 privacy/retention/legal-hold review ====='
          grep -q 'legal_hold' includes/class-wca-privacy.php
          grep -q 'appointment_ids_after' includes/class-wca-privacy.php
          grep -q 'future24_legal_hold' includes/class-wca-privacy.php
          qa
          test -z "$(git status --porcelain)"
          echo 'E11-R17 PASS — no additional supported source defect'

          echo '===== E11-R18 Future24/cross-file/concurrency review ====='
          grep -q 'F08-FUT-24' includes/class-wca-future24.php
          grep -q 'clinical_authority' includes/class-wca-future24.php
          grep -q 'File17' includes/class-wca-future24.php
          grep -q 'File19' includes/class-wca-future24.php
          qa
          test -z "$(git status --porcelain)"
          echo 'E11-R18 PASS — no additional supported source defect'

          echo '===== E11-R19 migration/security/accessibility/hygiene review ====='
          grep -q 'SCHEMA_VERSION' includes/class-wca-contracts.php
          grep -qi 'rollback' STAGING-ACCEPTANCE.md
          grep -qi 'accessib' README.md
          qa
          test -z "$(git status --porcelain)"
          echo 'E11-R19 PASS — no additional supported source defect'

          echo '===== E11-R20 governing-plan/ownership/release parity review ====='
          grep -q '1.2.11' worldwide-clinic.php
          grep -q '1.2.11' includes/class-wca-contracts.php
          test -f ELEVENTH-TWENTY-REVIEW-EVIDENCE.md
          grep -q 'commission' README.md
          qa
          test -z "$(git status --porcelain)"
          echo 'E11-R20 PASS — no additional supported source defect'

          echo '===== Finalize permanent evidence after R20 ====='
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ELEVENTH-TWENTY-REVIEW-EVIDENCE.md'); s=p.read_text()
          for n, label in [(17,'privacy/retention/legal-hold'),(18,'Future24/cross-file/concurrency'),(19,'migration/security/accessibility/repository-hygiene'),(20,'final governing-plan/ownership/package/release-parity')]:
              old=f'- E11-R{n:02d} {label} corrected-state review.' if n in (17,18,19) else f'- E11-R{n:02d} {label} review.'
              if old in s: s=s.replace(old,old[:-1]+' — no additional supported repository defect.',1)
          p.write_text(s)
          p=Path('CHANGELOG.md'); s=p.read_text().replace('R17-R20 fresh corrected-state closure reviews remain required before final candidate closure','R17-R20 fresh corrected-state closure reviews found no additional supported repository defect',1); p.write_text(s)
          PY

          echo '===== Remove all transient E11 orchestration ====='
          git rm .github/workflows/file08-eleventh-twenty-review.yml .github/workflows/file08-eleventh-twenty-review-resume.yml .github/workflows/file08-eleventh-r16-closure.yml tools/eleventh-twenty-review-patcher.py tools/eleventh-twenty-review-resume.py
          qa
          git add -A
          git commit -m 'File 08: close eleventh 20-round review and remove transient tooling'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
          echo "FINAL_SOURCE_HEAD=$(git rev-parse HEAD)"
