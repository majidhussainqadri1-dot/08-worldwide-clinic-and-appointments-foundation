name: File 08 Eleventh Review R18-R20 Final Closure

on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
    paths:
      - '.github/workflows/file08-eleventh-r18-r20-final.yml'

permissions:
  contents: write

jobs:
  close-r18-r20:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact corrected branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip
      - name: Configure committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Complete E11 R18 through R20
        shell: bash
        run: |
          set -euo pipefail
          qa() {
            find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/file08-php-lint.log
            php tests/run-all.php 2>&1 | tee /tmp/file08-tests.log
            ! grep -E 'PHP (Warning|Notice|Deprecated|Fatal|Parse)' /tmp/file08-tests.log
            node --check assets/js/clinic.js
            node --check assets/js/continuity.js
            node --check assets/js/future24.js
            test -z "$(find . -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '*.p12' -o -name '*.b64' \) -print -quit)"
            test -z "$(find . -type l -print -quit)"
            test ! -e .gitmodules
            ! grep -RInE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' --exclude-dir=.git .
          }

          echo '===== E11-R18 Future24 durable replay finalization review/fix ====='
          python3 tools/e11-r18-fix.py
          qa
          git add -A
          git commit -m 'File 08 E11-R18: fail closed on Future24 replay finalization'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
          echo "E11-R18 corrected-state QA PASS commit=$(git rev-parse HEAD)"

          echo '===== E11-R19 migration/security/accessibility/hygiene review ====='
          test "$(grep -o "SCHEMA_VERSION[[:space:]]*=[[:space:]]*'3.2.0'" includes/class-wca-contracts.php | wc -l)" -ge 1
          grep -q "SCHEMA_VERSION[[:space:]]*=[[:space:]]*'1.0.0'" includes/class-wca-future24.php
          grep -qi 'rollback' STAGING-ACCEPTANCE.md
          grep -qi 'migration' STAGING-ACCEPTANCE.md
          grep -qi 'accessib' README.md
          grep -qi 'RTL' README.md
          qa
          test -z "$(git status --porcelain)"
          echo 'E11-R19 PASS — no additional supported repository defect'

          echo '===== E11-R20 governing-plan/ownership/package/release parity review ====='
          grep -q 'Version: 1.2.11' worldwide-clinic.php
          grep -q "RUNTIME_VERSION[[:space:]]*=[[:space:]]*'1.2.11'" includes/class-wca-contracts.php
          grep -q 'platform commission is immutable at zero' tests/contracts.php
          grep -q "message_transport_owner.*File17" includes/class-wca-future24.php
          grep -q "notification_delivery_owner.*File19" includes/class-wca-future24.php
          grep -q "search_ranking_owner.*File26" includes/class-wca-future24.php
          test -f ELEVENTH-TWENTY-REVIEW-EVIDENCE.md
          php tools/build-candidate.php --root=. --output-dir=/tmp/wca-e11-build-a --commit=$(git rev-parse HEAD) --source-date-epoch=$(git log -1 --format=%ct) >/tmp/e11-build-a.json
          php tools/build-candidate.php --root=. --output-dir=/tmp/wca-e11-build-b --commit=$(git rev-parse HEAD) --source-date-epoch=$(git log -1 --format=%ct) >/tmp/e11-build-b.json
          cmp /tmp/wca-e11-build-a/08-worldwide-clinic-and-appointments-1.2.11-candidate.zip /tmp/wca-e11-build-b/08-worldwide-clinic-and-appointments-1.2.11-candidate.zip
          php tools/verify-candidate.php --root=. --zip=/tmp/wca-e11-build-a/08-worldwide-clinic-and-appointments-1.2.11-candidate.zip --manifest=/tmp/wca-e11-build-a/08-worldwide-clinic-and-appointments-1.2.11-candidate-manifest.json --checksum=/tmp/wca-e11-build-a/08-worldwide-clinic-and-appointments-1.2.11-candidate.sha256 --commit=$(git rev-parse HEAD)
          qa
          test -z "$(git status --porcelain)"
          echo 'E11-R20 PASS — no additional supported repository defect'

          echo '===== Finalize permanent E11 evidence ====='
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ELEVENTH-TWENTY-REVIEW-EVIDENCE.md'); s=p.read_text()
          replacements={
            '- E11-R17 privacy/retention/legal-hold corrected-state review.':'- E11-R17 privacy/retention/legal-hold corrected-state review — no additional supported repository defect.',
            '- E11-R19 migration/security/accessibility/repository-hygiene corrected-state review.':'- E11-R19 migration/security/accessibility/repository-hygiene corrected-state review — no additional supported repository defect.',
            '- E11-R20 final governing-plan/ownership/package/release-parity review.':'- E11-R20 final governing-plan/ownership/package/release-parity review — no additional supported repository defect.',
          }
          for old,new in replacements.items():
              s=s.replace(old,new,1)
          p.write_text(s)
          p=Path('CHANGELOG.md'); s=p.read_text()
          s=s.replace('R17-R20 fresh corrected-state closure reviews remain required before final candidate closure','R17, R19 and R20 fresh corrected-state closure reviews found no additional supported repository defect; R18 found and corrected durable Future24 replay-finalization failure.',1)
          s=s.replace('R17-R20 fresh corrected-state closure reviews found no additional supported repository defect','R17, R19 and R20 fresh corrected-state closure reviews found no additional supported repository defect; R18 found and corrected durable Future24 replay-finalization failure.',1)
          p.write_text(s)
          PY

          echo '===== Remove all transient E11 orchestration ====='
          for f in \
            .github/workflows/file08-eleventh-twenty-review.yml \
            .github/workflows/file08-eleventh-twenty-review-resume.yml \
            .github/workflows/file08-eleventh-r16-closure.yml \
            .github/workflows/file08-eleventh-r18-r20-final.yml \
            tools/eleventh-twenty-review-patcher.py \
            tools/eleventh-twenty-review-resume.py \
            tools/e11-r18-fix.py; do
            if [ -e "$f" ]; then git rm "$f"; fi
          done
          qa
          git add -A
          git commit -m 'File 08: close eleventh 20-round review and remove transient tooling'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
          echo "FINAL_SOURCE_HEAD=$(git rev-parse HEAD)"
