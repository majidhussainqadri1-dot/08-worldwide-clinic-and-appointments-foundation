name: F08 Fourth Fresh Ten-Round Sequential Review v2

on:
  push:
    branches: [codex/file08-new-governing-plans-completion-2026]
    paths: [.github/workflows/f08-fourth-ten-cycle-v2.yml]

permissions:
  contents: write

jobs:
  review-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0
      - name: Reconstruct and harden reviewed patcher
        shell: bash
        run: |
          set -euo pipefail
          awk '/cat > \/tmp\/f08.patch.gz.b64 <<'"'"'B64'"'"'/{flag=1;next}/^[[:space:]]*B64$/{if(flag){exit}}flag{sub(/^[[:space:]]+/,"");print}' .github/workflows/f08-fourth-ten-cycle.yml > /tmp/f08.patch.gz.b64
          base64 -d /tmp/f08.patch.gz.b64 | gzip -d > /tmp/f08-fourth-cycle.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/f08-fourth-cycle.py')
          s=p.read_text()
          replacements={
              '"absint( $row[\'branch_id\'] ?? 0 ) === $branch_id"':'"absint( \\$row[\'branch_id\'] ?? 0 ) === \\$branch_id"',
              '"absint( $hold[\'branch_id\'] ?? 0 )"':'"absint( \\$hold[\'branch_id\'] ?? 0 )"',
              '"update_post_meta( $appointment_id, \'_swc_branch_id\'"':'"update_post_meta( \\$appointment_id, \'_swc_branch_id\'"',
              '"$where .= \' AND clinic_id=%d\'"':'"\\$where .= \' AND clinic_id=%d\'"',
              '"strtotime( $start . \' UTC\' )"':'"strtotime( \\$start . \' UTC\' )"',
              '"strtotime( $end . \' UTC\' )"':'"strtotime( \\$end . \' UTC\' )"',
              '"list_branches( $clinic[\'id\'], true )"':'"list_branches( \\$clinic[\'id\'], true )"',
              '"list_services( $clinic[\'id\'], true )"':'"list_services( \\$clinic[\'id\'], true )"',
              '"get_clinic( absint( $session[\'clinic_id\'] ), true )"':'"get_clinic( absint( \\$session[\'clinic_id\'] ), true )"',
              '"\'paged\' => $page"':'"\'paged\' => \\$page"',
              'echo "File 08 fourth fresh ten-round regression assertions passed: {$checks}/{$checks}.\\n";':'echo \'File 08 fourth fresh ten-round regression assertions passed: \' . $checks . \'/\' . $checks . ".\\n";',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('R10 patcher repair marker missing: '+old)
              s=s.replace(old,new)
          p.write_text(s)
          PY
          python3 -m py_compile /tmp/f08-fourth-cycle.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          tree=ast.parse(Path('/tmp/f08-fourth-cycle.py').read_text())
          found=None
          for n in ast.walk(tree):
              if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='test' for t in n.targets) and isinstance(n.value,ast.Constant):
                  found=n.value.value
          if found is None: raise SystemExit('fourth regression test constant missing')
          Path('/tmp/fourth-test.php').write_text(found)
          PY
          php -l /tmp/fourth-test.php
      - name: Run ten sequential review-fix rounds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sabri File 08 QA"
          git config user.email "actions@users.noreply.github.com"
          for r in $(seq 1 10); do
            echo "=== FOURTH FRESH REVIEW ROUND ${r} ==="
            python3 /tmp/f08-fourth-cycle.py . "$r"
            find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint-${r}.log
            if [ "$r" = "10" ]; then
              rm -f .github/workflows/f08-fourth-ten-cycle.yml .github/workflows/f08-fourth-ten-cycle-v2.yml
            fi
            git add -A
            git diff --cached --quiet && { echo "Round ${r} produced no correction"; exit 1; }
            git commit -m "File 08 fourth review R${r}: corrective closure"
          done
      - name: Exact corrected-state source QA before push
        shell: bash
        run: |
          set -euo pipefail
          php tests/run-all.php
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
          grep -q 'Version: 1.2.4' worldwide-clinic.php
          grep -q "RUNTIME_VERSION                 = '1.2.4'" includes/class-wca-contracts.php
          grep -q "SCHEMA_VERSION                  = '3.2.0'" includes/class-wca-contracts.php
          grep -q 'fourth fresh ten-round regression assertions passed' <(php tests/fourth-ten-review-regressions.php)
          test ! -e .github/workflows/f08-fourth-ten-cycle.yml
          test ! -e .github/workflows/f08-fourth-ten-cycle-v2.yml
      - name: Push all ten corrected rounds
        shell: bash
        run: git push origin HEAD:codex/file08-new-governing-plans-completion-2026
