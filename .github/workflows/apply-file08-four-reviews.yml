name: Apply File 08 Four-Review Corrections

on:
  push:
    branches:
      - codex/file08-complete-master-plan-1.0.0
    paths:
      - .codex/apply-trigger

permissions:
  contents: write

concurrency:
  group: file08-four-review-apply
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact completion branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-complete-master-plan-1.0.0
          fetch-depth: 0

      - name: Reconstruct and apply four-review corrections
        shell: bash
        run: |
          set -euo pipefail
          cat .codex/rev-part-* > /tmp/apply-four-reviews.b64
          test "$(wc -c < /tmp/apply-four-reviews.b64)" -eq 15120
          base64 -d /tmp/apply-four-reviews.b64 | gzip -d > /tmp/apply-four-reviews.py
          python3 -m py_compile /tmp/apply-four-reviews.py
          python3 /tmp/apply-four-reviews.py
          python3 - <<'PY'
          from pathlib import Path
          for name in ('tests/contracts.php', 'tests/master-plan-contract.php'):
              path = Path(name)
              path.write_text(path.read_text().replace('1.0.0', '1.0.1'))
          path = Path('tests/four-review-regressions.php')
          lines = path.read_text().splitlines()
          corrected = []
          for line in lines:
              if 'compensation-safe reschedule' in line:
                  line = "wca4_contains( 'includes/class-wca-service.php', 'release_appointment_slot( $appointment_id, \\'released\\', $token )', 'compensation-safe reschedule' );"
              elif 'no public clinic native ID' in line:
                  line = "wca4_not_contains( 'includes/class-wca-service.php', \"'id'             => absint(\", 'no public clinic native ID' );"
              corrected.append(line)
          path.write_text('\n'.join(corrected) + '\n')
          PY

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none

      - name: Verify corrected source before commit
        shell: bash
        run: |
          set -uo pipefail
          rm -rf .codex
          mkdir -p four-review-diagnostics
          status=0
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > four-review-diagnostics/php-lint.log 2>&1 || status=$?
          node --check assets/js/clinic.js > four-review-diagnostics/javascript.log 2>&1 || status=$?
          php tests/contracts.php > four-review-diagnostics/contracts.log 2>&1 || status=$?
          php tests/master-plan-contract.php > four-review-diagnostics/master-plan.log 2>&1 || status=$?
          php tests/security-static.php > four-review-diagnostics/security.log 2>&1 || status=$?
          php tests/four-review-regressions.php > four-review-diagnostics/four-review.log 2>&1 || status=$?
          git diff --check > four-review-diagnostics/git-diff.log 2>&1 || status=$?
          for file in four-review-diagnostics/*.log; do echo "===== ${file} ====="; cat "$file"; done
          exit "$status"

      - name: Upload verification diagnostic
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: file08-four-review-verification-diagnostic-${{ github.sha }}
          path: four-review-diagnostics/
          if-no-files-found: error
          retention-days: 3

      - name: Remove verification diagnostics
        if: success()
        shell: bash
        run: rm -rf four-review-diagnostics

      - name: Commit corrected source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(file-08): complete four plan-governed review rounds"
          git push origin HEAD:codex/file08-complete-master-plan-1.0.0
