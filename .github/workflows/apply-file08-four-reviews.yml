name: Apply File 08 Four-Review Corrections

on:
  push:
    branches:
      - codex/file08-complete-master-plan-1.0.0
    paths:
      - .codex/apply-trigger

permissions:
  contents: write

concurrency:
  group: file08-four-review-apply
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact completion branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-complete-master-plan-1.0.0
          fetch-depth: 0

      - name: Reconstruct and apply four-review corrections
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .codex/apply-four-reviews.py.gz.b64 | gzip -d > /tmp/apply-four-reviews.py
          python3 /tmp/apply-four-reviews.py
          rm -rf .codex

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none

      - name: Verify corrected source before commit
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          node --check assets/js/clinic.js
          php tests/run-all.php
          git diff --check

      - name: Commit corrected source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(file-08): complete four plan-governed review rounds"
          git push origin HEAD:codex/file08-complete-master-plan-1.0.0
