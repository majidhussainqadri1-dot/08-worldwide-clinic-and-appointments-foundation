name: File 08 Sixth Fresh Ten-Round Sequential Review

on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
    paths:
      - '.github/workflows/file08-sixth-ten-review.yml'

permissions:
  contents: write

jobs:
  review-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip
          ini-file: production
      - name: Configure review identity
        run: |
          git config user.name "Sabri File 08 QA"
          git config user.email "actions@users.noreply.github.com"
          test -f tools/sixth-ten-review-patcher.py
          grep -q "Version: 1.2.5" worldwide-clinic.php
      - name: Run nine sequential review-fix rounds
        shell: bash
        run: |
          set -euo pipefail
          for round in 1 2 3 4 5 6 7 8 9; do
            echo "===== F08 SIXTH REVIEW ROUND ${round} ====="
            python tools/sixth-ten-review-patcher.py "${round}"
            if [ "${round}" = "9" ]; then
              python - <<'PY'
          from pathlib import Path
          p=Path('tests/sixth-ten-review-regressions.php')
          s=p.read_text(encoding='utf-8')
          replacements={
          '''t610has('doctor eligibility at serving root',$auth,"SWC_Doctor_Authority::is_eligible( $doctor_user_id )");''': '''t610has('doctor eligibility at serving root',$auth,'SWC_Doctor_Authority::is_eligible( $doctor_user_id )');''',
          '''t610has('outbox dispatch stable message id argument',$outbox,"self::dispatch( (string) $item['message_id']");''': '''t610has('outbox dispatch stable message id argument',$outbox,'self::dispatch( (string) $item[\\'message_id\\']');''',
          '''t610has('outbox envelope stable message id',$outbox,"'message_id'    => sanitize_text_field( $message_id )");''': '''t610has('outbox envelope stable message id',$outbox,'\\'message_id\\'    => sanitize_text_field( $message_id )');''',
          '''t610has('questionnaire complete traversal',$future,"feature_rows_for_clinic( 'F08-FUT-11', $clinic_id, 'template_active', 'questionnaire' )");''': '''t610has('questionnaire complete traversal',$future,'feature_rows_for_clinic( \\'F08-FUT-11\\', $clinic_id, \\'template_active\\', \\'questionnaire\\' )');''',
          '''t610has('prerequisite complete traversal',$future,"feature_rows_for_clinic( 'F08-FUT-13', $clinic_id, 'rule_active', 'payload' )");''': '''t610has('prerequisite complete traversal',$future,'feature_rows_for_clinic( \\'F08-FUT-13\\', $clinic_id, \\'rule_active\\', \\'payload\\' )');''',
          '''t610lacks('no raw monthly modify drift',$future,"$cursor = $cursor->modify( '+' . $interval . ' months' )");''': '''t610lacks('no raw monthly modify drift',$future,'$cursor = $cursor->modify( \\'+'\\' . $interval . \\' months\\' )');''',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('sixth-ten literal marker missing: '+old)
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
            fi
            find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/f08-sixth-lint.txt
            php tests/run-all.php
            node --check assets/js/clinic.js
            node --check assets/js/continuity.js
            node --check assets/js/future24.js
            test -z "$(find . -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '*.p12' -o -name '*.b64' \) -print -quit)"
            test -z "$(find . -type l -print -quit)"
            test ! -e .gitmodules
            ! grep -RInE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' --exclude-dir=.git .
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "File 08 sixth review R${round}: corrective review closure"
            else
              echo "Round ${round}: clean review; no repository mutation required."
            fi
          done

          git rm -f tools/sixth-ten-review-patcher.py .github/workflows/file08-sixth-ten-review.yml
          git commit -m "File 08 sixth review: remove transient review orchestration"
      - name: Exact corrected-state source QA before push
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          php tests/run-all.php
          php tests/sixth-ten-review-regressions.php
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
          test ! -e tools/sixth-ten-review-patcher.py
          test ! -e .github/workflows/file08-sixth-ten-review.yml
          grep -q "Version: 1.2.6" worldwide-clinic.php
          grep -q "RUNTIME_VERSION                 = '1.2.6'" includes/class-wca-contracts.php
          grep -q "SCHEMA_VERSION                  = '3.2.0'" includes/class-wca-contracts.php
      - name: Push corrected rounds
        run: git push origin HEAD:codex/file08-new-governing-plans-completion-2026
