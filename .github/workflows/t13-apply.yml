name: File 08 T13 Apply Corrected Source
on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip
      - name: Apply reviewed corrections
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/t13.patch.gz.b64 | gunzip > /tmp/t13.patch
          git apply --check /tmp/t13.patch
          git apply /tmp/t13.patch
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Existing complete source QA
        run: php tests/run-all.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find . -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '*.p12' \) -print -quit)"
          test -z "$(find . -type l -print -quit)"
          test ! -e .gitmodules
          ! grep -RInE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' --exclude-dir=.git .
      - name: Commit corrected source and remove transient tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/t13.patch.gz.b64 .github/workflows/t13-apply.yml
          git add -A
          git commit -m "File 08: apply thirteenth 20-round source corrections"
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
