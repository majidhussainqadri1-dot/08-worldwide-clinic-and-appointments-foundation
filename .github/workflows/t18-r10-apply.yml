name: File 08 T18 R10 Apply Frozen Ledger
on:
  push:
    branches: [review/file08-t18-ten-round-2026-09-06]
    paths: [.github/workflows/t18-r10-apply.yml, .github/scripts/t18-r10-release-truth-correct.py]
permissions:
  contents: write
jobs:
  apply-fix-regress-package-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - name: Freeze pre-fix source lineage
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9e78faa33208b4b5830073a0d7c5512e3e741acc HEAD
          git rev-parse HEAD
      - name: Apply complete frozen R10 ledger
        run: python3 .github/scripts/t18-r10-release-truth-correct.py
      - name: R10 dedicated regression
        run: php -d display_errors=1 -d error_reporting=E_ALL tests/t18-r10-release-truth-regressions.php
      - name: Full warning-free regression
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/t18-r10-lint.txt
          php -d display_errors=1 -d error_reporting=E_ALL tests/run-all.php 2>&1 | tee /tmp/t18-r10-tests.txt
          ! grep -Eq 'PHP (Warning|Notice|Deprecated|Fatal|Parse)|Warning:|Notice:|Deprecated:' /tmp/t18-r10-tests.txt
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
          git diff --check
      - name: Commit corrected source head
        id: corrected
        run: |
          set -euo pipefail
          git config user.name 'Sabri File 08 Review Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add readme.txt STATUS.md tests/run-all.php tests/t18-r10-release-truth-regressions.php
          git diff --cached --check
          git commit -m 'docs(file08): align current release truth with T18 source'
          git push origin HEAD:review/file08-t18-ten-round-2026-09-06
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Exact-head full regression
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ steps.corrected.outputs.sha }}'
          test -z "$(git status --porcelain)"
          php -d display_errors=1 -d error_reporting=E_ALL tests/run-all.php 2>&1 | tee /tmp/t18-r10-exact.txt
          ! grep -Eq 'PHP (Warning|Notice|Deprecated|Fatal|Parse)|Warning:|Notice:|Deprecated:' /tmp/t18-r10-exact.txt
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
      - name: Double deterministic package and independent verification
        run: |
          set -euo pipefail
          sha='${{ steps.corrected.outputs.sha }}'
          epoch=$(git show -s --format=%ct "$sha")
          php tools/build-candidate.php --output-dir=build/t18-r10-a --commit="$sha" --source-date-epoch="$epoch"
          php tools/build-candidate.php --output-dir=build/t18-r10-b --commit="$sha" --source-date-epoch="$epoch"
          cmp build/t18-r10-a/*-candidate.zip build/t18-r10-b/*-candidate.zip
          cmp build/t18-r10-a/*-candidate-manifest.json build/t18-r10-b/*-candidate-manifest.json
          cmp build/t18-r10-a/*-candidate.sha256 build/t18-r10-b/*-candidate.sha256
          php tools/verify-candidate.php --artifact=build/t18-r10-a --commit="$sha"
          php tools/verify-candidate.php --artifact=build/t18-r10-b --commit="$sha"
          cat build/t18-r10-a/*-candidate.sha256
