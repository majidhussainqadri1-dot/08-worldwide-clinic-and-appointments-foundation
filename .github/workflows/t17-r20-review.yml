name: File 08 T17 R20 Complete Diagnostic Review
on: push
permissions:
  contents: read
jobs:
  review:
    if: github.ref == 'refs/heads/tmp-file08-r20-final-20260831'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Freeze exact reviewed source
        run: |
          set -euo pipefail
          git checkout --detach dc157fd8602d4cb15780bf498176e97151d0f6b7
          test "$(git rev-parse HEAD)" = "dc157fd8602d4cb15780bf498176e97151d0f6b7"
          test -z "$(git status --porcelain)"
      - name: Complete R20 review and freeze full defect ledger
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import glob, json, os, re, subprocess, sys, hashlib

          ROOT = Path('.')
          defects = []
          def record(label, ok, detail=''):
              status = 'PASS' if ok else 'FAIL'
              print(f'{status}: {label}' + (f' :: {detail}' if detail else ''))
              if not ok:
                  defects.append(label)
              return ok

          def run(label, cmd, capture=False):
              p = subprocess.run(cmd, shell=True, text=True, stdout=subprocess.PIPE if capture else None,
                                 stderr=subprocess.STDOUT if capture else None)
              if capture and p.stdout:
                  print(p.stdout, end='')
              record(label, p.returncode == 0, f'rc={p.returncode}' if p.returncode else '')
              return p

          def text(path):
              return Path(path).read_text(errors='replace')

          print('--- R20 BASELINE / TEST-HARNESS REVIEW ---')
          run('PHP syntax lint', "find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/r20-lint.txt")
          suite = run('complete source suites return success', 'php -d display_errors=1 -d error_reporting=E_ALL tests/run-all.php', capture=True)
          Path('/tmp/r20-tests.txt').write_text(suite.stdout or '')
          warning_re = re.compile(r'PHP (?:Warning|Notice|Deprecated|Fatal|Parse)|(?:Warning|Notice|Deprecated):')
          warnings = [line for line in (suite.stdout or '').splitlines() if warning_re.search(line)]
          record('complete source suites are warning/notice/deprecation/fatal free', not warnings, ' | '.join(warnings[:4]))
          run('clinic.js syntax', 'node --check assets/js/clinic.js')
          run('continuity.js syntax', 'node --check assets/js/continuity.js')
          run('future24.js syntax', 'node --check assets/js/future24.js')

          print('--- R20 SECURITY / AUTHORIZATION / OWNERSHIP REVIEW ---')
          runtime_files = [p for p in ROOT.rglob('*') if p.is_file() and (str(p).startswith('includes/') or str(p).startswith('assets/') or str(p) == 'worldwide-clinic.php') and p.suffix in {'.php','.js','.css'}]
          runtime = '\n'.join(p.read_text(errors='replace') for p in runtime_files)
          record('dangerous runtime primitives absent', not re.search(r'eval\(|base64_decode\(|shell_exec\(|passthru\(|proc_open\(|assert\(\s*\$', runtime))
          record('unauthenticated write AJAX absent', not re.search(r'wp_ajax_nopriv_.*(?:save|create|delete|update|book|cancel|reschedule|complete|submit)', runtime))

          callback_token = "'permission_callback' => '__return_true'"
          public_hits = []
          for p in Path('includes').glob('*.php'):
              for n,line in enumerate(p.read_text(errors='replace').splitlines(),1):
                  if callback_token in line:
                      public_hits.append((p.name,n,line.strip()))
          print('Public callback inventory:')
          for hit in public_hits: print('  ', hit)
          expected_counts = {
              'class-wca-calendar-link.php': 2,
              'class-wca-central-governance.php': 2,
              'class-wca-rest.php': 4,
              'class-wca-ten-review-hardening.php': 1,
              'class-wca-future24.php': 1,
          }
          actual_counts = {}
          for f,_,_ in public_hits: actual_counts[f] = actual_counts.get(f,0)+1
          record('public callback inventory is exactly the reviewed allowlist', actual_counts == expected_counts, f'actual={actual_counts}')

          future = text('includes/class-wca-future24.php')
          continuity = text('includes/class-wca-continuity-secure.php')
          calendar = text('includes/class-wca-calendar-link.php')
          governance = text('includes/class-wca-central-governance.php')
          rest = text('includes/class-wca-rest.php')
          ten = text('includes/class-wca-ten-review-hardening.php')
          contracts = text('includes/class-wca-contracts.php')

          manifest_match = re.search(r'public static function rest_manifest\(\)\s*\{(.*?)\n\t\}', future, re.S)
          manifest_body = manifest_match.group(1) if manifest_match else ''
          record('Future24 public manifest is a static non-patient capability projection', bool(manifest_match) and not re.search(r'\$wpdb|patient_|guardian_|appointment_id|get_current_user_id|SWC_Helpers::meta|WCA_Repository::', manifest_body) and "'capabilities' => self::capabilities()" in manifest_body)
          record('Continuity has no unauthenticated public route', callback_token not in continuity)
          record('calendar webhook uses approved signature-verification adapter', 'wca_calendar_provider_verify_webhook' in calendar and "true !== ( $verified['verified'] ?? false )" in calendar)
          record('calendar webhook has replay-window validation', 'wca_calendar_webhook_replay_window' in calendar and '> 900' in calendar)
          record('calendar webhook is idempotent', "claim_idempotency( 'calendar_provider_webhook'" in calendar)
          record('signed ICS bearer is constant-time verified', 'hash_equals( $expected, $sig )' in calendar)
          record('public clinic projection remains canonical owner projection', 'WCA_Service::public_clinic_projection' in governance)
          record('public clinic collection is rate limited', "rate_limit( 'public_clinics'" in rest)
          record('public clinic detail is rate limited', "rate_limit( 'public_clinic'" in rest)
          record('slot search is rate limited', "rate_limit( 'slot_search'" in rest)
          record('legacy slot search is rate limited', "rate_limit_hit( 'tenreview_slot_search'" in ten)
          record('zero commission invariant', "'commission_percent' => 0" in contracts)
          record('donation visibility neutrality invariant', "'donation_visibility_link' => false" in contracts)
          record('automated diagnosis remains disabled', "'automated_diagnosis' => false" in contracts)
          record('automated prescribing remains disabled', "'automated_prescribing' => false" in contracts)
          foreign_write = re.search(r'(?:CREATE TABLE|INSERT INTO)[^\n]*(?:file17|file19|file20|file24|file26)', '\n'.join(text(p) for p in Path('includes').glob('*.php')), re.I)
          record('no direct foreign canonical table writes', foreign_write is None)

          print('--- R20 FAILURE / PRIVACY / MIGRATION / CONCURRENCY REVIEW ---')
          security = text('tests/security-static.php')
          record('legal-hold-aware privacy regression exists', 'legal-hold-aware privacy lifecycle exists' in security)
          record('optimistic concurrency regression exists', 'optimistic concurrency is enforced' in security)
          record('idempotent write regression exists', 'idempotent write protection is implemented' in security)
          record('notification fallback privacy regression exists', 'notification fallback is privacy-minimal' in security)
          record('outbox clinical-narrative exclusion regression exists', 'outbox fallback never emails clinical narrative' in security)
          record('R17 intake expected-version root guard exists', 'wca_intake_version_required' in continuity)
          record('R17 appointment-processing consent root guard exists', 'appointment_processing' in continuity)
          record('Future24 schema migrated to 1.1.0', "const SCHEMA_VERSION   = '1.1.0'" in future)
          record('episode optimistic version guard exists', 'wca_episode_version_required' in future and 'wca_episode_stale' in future)
          record('FHIR adapter explicit degraded/disabled state exists', 'wca_fhir_adapter_disabled' in future and "'degraded' => true" in future)
          record('FHIR version/freshness metadata exists', 'versionId' in future and 'lastUpdated' in future)
          unbounded = []
          ub_re = re.compile(r"posts_per_page['\"]?\s*=>\s*-1|numberposts['\"]?\s*=>\s*-1|nopaging['\"]?\s*=>\s*true")
          for p in Path('includes').glob('*.php'):
              if ub_re.search(text(p)): unbounded.append(p.name)
          record('unbounded WordPress query patterns absent', not unbounded, ','.join(unbounded))

          print('--- R20 RELEASE TRUTH / HYGIENE / REPRODUCIBILITY REVIEW ---')
          markers = []
          for p in runtime_files:
              if re.search(r'\b(?:TODO|FIXME|XXX|HACK)\b', p.read_text(errors='replace')): markers.append(str(p))
          record('runtime TODO/FIXME/XXX/HACK markers absent', not markers, ','.join(markers[:8]))
          risky_files = [str(p) for p in ROOT.rglob('*') if p.is_file() and (p.name in {'.env'} or p.suffix in {'.pem','.key','.p12','.b64'})]
          record('private key and environment files absent', not risky_files, ','.join(risky_files[:8]))
          symlinks = [str(p) for p in ROOT.rglob('*') if p.is_symlink()]
          record('repository symlinks absent', not symlinks, ','.join(symlinks[:8]))
          all_non_git = '\n'.join(p.read_text(errors='ignore') for p in ROOT.rglob('*') if p.is_file() and '.git' not in p.parts and p.stat().st_size < 2_000_000)
          secret_match = re.search(r'BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}', all_non_git)
          record('obvious embedded secret patterns absent', secret_match is None)

          sha = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          epoch = subprocess.check_output(['git','show','-s','--format=%ct','HEAD'], text=True).strip()
          subprocess.run('rm -rf build/t17-r20-a build/t17-r20-b', shell=True)
          build_a = run('candidate build A succeeds', f"php tools/build-candidate.php --output-dir=build/t17-r20-a --commit={sha} --source-date-epoch={epoch}", capture=True)
          build_b = run('candidate build B succeeds', f"php tools/build-candidate.php --output-dir=build/t17-r20-b --commit={sha} --source-date-epoch={epoch}", capture=True)

          def one(pattern):
              xs = glob.glob(pattern)
              return xs[0] if len(xs)==1 else None
          za,zb = one('build/t17-r20-a/*-candidate.zip'),one('build/t17-r20-b/*-candidate.zip')
          ma,mb = one('build/t17-r20-a/*-candidate-manifest.json'),one('build/t17-r20-b/*-candidate-manifest.json')
          ha,hb = one('build/t17-r20-a/*-candidate.sha256'),one('build/t17-r20-b/*-candidate.sha256')
          record('exactly one ZIP/manifest/checksum exists in each candidate', all([za,zb,ma,mb,ha,hb]))
          if za and zb: record('candidate ZIP is byte reproducible', Path(za).read_bytes()==Path(zb).read_bytes())
          if ma and mb: record('candidate manifest is byte reproducible', Path(ma).read_bytes()==Path(mb).read_bytes())
          if ha and hb: record('candidate checksum file is byte reproducible', Path(ha).read_bytes()==Path(hb).read_bytes())
          if za: run('candidate A independently verifies', f'php tools/verify-candidate.php --artifact=build/t17-r20-a --commit={sha}', capture=True)
          if zb: run('candidate B independently verifies', f'php tools/verify-candidate.php --artifact=build/t17-r20-b --commit={sha}', capture=True)
          if ma:
              try:
                  m=json.loads(Path(ma).read_text())
                  record('manifest exact source commit', m.get('commit')==sha, str(m.get('commit')))
                  record('manifest does not overclaim staging acceptance', not bool(m.get('staging_accepted')))
                  record('manifest does not overclaim production acceptance', not bool(m.get('production_accepted')))
                  record('manifest preserves zero commission', int(m.get('commission_percent',-1))==0)
              except Exception as e:
                  record('manifest is valid structured JSON', False, repr(e))
          subprocess.run('rm -rf build/t17-r20-a build/t17-r20-b', shell=True)

          print('=== R20 FROZEN DEFECT LEDGER ===')
          if defects:
              for i,d in enumerate(defects,1): print(f'{i}. {d}')
          else:
              print('No supported defect found.')
          print(f'R20_DEFECT_COUNT={len(defects)}')
          sys.exit(1 if defects else 0)
          PY
