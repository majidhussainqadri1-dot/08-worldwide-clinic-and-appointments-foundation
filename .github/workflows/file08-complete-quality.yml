name: T26 R1 Frozen Correction
on:
  push:
    branches:
      - review/file08-t21-ten-round-2026-09-09
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply complete post-review correction batch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/t26-r1-correct.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-swc-public-clinic.php PUBLIC-CLINIC-PROJECTION-CONTRACT.md tools/build-candidate.php tools/verify-candidate.php tests/t26-r1-public-clinic-contract-parity-regressions.php tests/run-all.php
          git commit -m "T26 R1: apply frozen corrections"
          git push
