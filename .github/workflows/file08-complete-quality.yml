name: File 08 Complete Master Plan Quality
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: file08-complete-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: PHP ${{ matrix.php }} and source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '${{ matrix.php }}', coverage: none, extensions: zip}
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Master-plan, security and state tests
        run: php tests/run-all.php
      - name: Current File09 real dependency contract, retired helper rejection
        run: php tests/file09-current-dependency-gate.php
      - name: MariaDB decimal default padding and schema fail-closed regression
        run: php tests/mariadb-decimal-default-regression.php
      - name: WordPress pre-init rewrite migration negative-path gate
        run: php tests/file08-preinit-rewrite-regression.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find . -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '*.p12' -o -name '*.b64' \) -print -quit)"
          test -z "$(find . -type l -print -quit)"
          test ! -e .gitmodules
          ! grep -RInE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' --exclude-dir=.git .
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l | tr -d ' ')" = "1"
          test "$(find .github/scripts -maxdepth 1 -type f -name 't*-correct*.py' 2>/dev/null | wc -l | tr -d ' ')" = "0"
          test "$(find tools -maxdepth 1 -type f -name 't*-correct*.py' 2>/dev/null | wc -l | tr -d ' ')" = "0"
          test ! -e tools/build-development-candidate.php
          test ! -e tools/verify-development-candidate.php
          test ! -e CHECKSUMS.sha256
          test ! -e CORRECTIVE-CHECKSUMS.sha256
  forty_rounds:
    name: Forty complete File08 source-review passes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none, extensions: zip}
      - name: T28 forty whole-suite passes (source QA, not staging)
        shell: bash
        run: bash tools/run-40-full-source-reviews.sh
  candidate:
    name: Reproducible candidate package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, forty_rounds, native_mysql]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none, extensions: zip}
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          version=$(php -r '$source=file_get_contents("worldwide-clinic.php"); if(!is_string($source)||preg_match("/^\\s*\\* Version:\\s*([^\\s]+)/m",$source,$m)!==1){exit(1);} echo $m[1];')
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build twice
        run: |
          php tools/build-candidate.php --output-dir=build/a --commit='${{ steps.source.outputs.sha }}' --source-date-epoch='${{ steps.source.outputs.epoch }}'
          php tools/build-candidate.php --output-dir=build/b --commit='${{ steps.source.outputs.sha }}' --source-date-epoch='${{ steps.source.outputs.epoch }}'
          cmp build/a/*-candidate.zip build/b/*-candidate.zip
          cmp build/a/*-candidate-manifest.json build/b/*-candidate-manifest.json
          cmp build/a/*-candidate.sha256 build/b/*-candidate.sha256
      - name: Independent verification
        run: |
          php tools/verify-candidate.php --artifact=build/a --commit='${{ steps.source.outputs.sha }}'
          cat build/a/*-candidate.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: file-08-${{ steps.source.outputs.version }}-candidate-${{ steps.source.outputs.sha }}
          path: build/a/
          if-no-files-found: error
          retention-days: 30

  native_mysql:
    name: Disposable WP ${{ matrix.wordpress }} / MariaDB, six real File08 dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['7.0.8', '7.1.4']
    permissions:
      contents: read
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wp-ephemeral
          MARIADB_ROOT_PASSWORD: root-ephemeral
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@fc14643b0a99ee9db10a3c025a33d76544fa3761
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli,mbstring,curl,zip,openssl
      - name: Exact-source File00 membership
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: majidhussainqadri1-dot/00-sabri-membership-core
          ref: 2fa7c022ee9cd1b65432e900579512f304532442
          path: native-file00
          persist-credentials: false
      - name: Exact-source File02 authentication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: majidhussainqadri1-dot/02-sabri-authentication
          ref: 224c39bcb8c28f77504c7348dbad41226753c7e8
          path: native-file02
          persist-credentials: false
      - name: Exact-source File03 profiles
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: majidhussainqadri1-dot/03-sabri-profiles-and-doctors
          ref: bf317e5521ec79f9f16d21353f402571fcd4f84c
          path: native-file03
          persist-credentials: false
      - name: Exact-source File07 directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: majidhussainqadri1-dot/07-doctors-directory-and-discovery
          ref: 2f4a89707724fd2b9946600afe10ddab27ec3c2d
          path: native-file07
          persist-credentials: false
      - name: Exact-source File09 doctor verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: majidhussainqadri1-dot/09-global-doctor-onboarding-and-verification-completion
          ref: 13153e4bb5c98e449f638a2c24ec2f1c05083afc
          path: native-file09
          persist-credentials: false
      - name: Install disposable WP 7.1.4 and six real source plugins (no production data)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/file08-wp-cli.phar
          php /tmp/file08-wp-cli.phar --info
          mkdir -p /tmp/file08-ci-wp/wp-content/plugins
          php /tmp/file08-wp-cli.phar core download --version=${{ matrix.wordpress }} --path=/tmp/file08-ci-wp --allow-root --quiet
          php /tmp/file08-wp-cli.phar config create --path=/tmp/file08-ci-wp --dbname=wordpress --dbuser=wordpress --dbpass=wp-ephemeral --dbhost=127.0.0.1:3306 --allow-root --quiet
          php /tmp/file08-wp-cli.phar core install --path=/tmp/file08-ci-wp --url=http://file08-ci.local --title='File08 Disposable CI' --admin_user=admin --admin_password=ci-ephemeral-long-password --admin_email=file08-ci-admin@example.test --skip-email --allow-root --quiet
          # File09 correctly refuses activation without versioned private keys.
          # Generate REAL but disposable keys in this isolated CI wp-config; do not bypass cryptography.
          gdo_ring=$(php -r 'echo json_encode(array("active"=>"ci-v1","keys"=>array("ci-v1"=>base64_encode(random_bytes(32)))));')
          gdo_signing=$(php -r 'echo bin2hex(random_bytes(32));')
          php /tmp/file08-wp-cli.phar config set GDO_KEYRING "$gdo_ring" --path=/tmp/file08-ci-wp --allow-root --quiet
          php /tmp/file08-wp-cli.phar config set GDO_CLAIM_SIGNING_KEY "$gdo_signing" --path=/tmp/file08-ci-wp --allow-root --quiet
          # File09 requires credential storage outside WordPress public content/uploads.
          mkdir -p /tmp/file08-ci-private
          chmod 0700 /tmp/file08-ci-private
          php /tmp/file08-wp-cli.phar config set GDO_PRIVATE_STORAGE_DIR /tmp/file08-ci-private --path=/tmp/file08-ci-wp --allow-root --quiet
          unset gdo_ring gdo_signing
          mkdir -p /tmp/file08-ci-wp/wp-content/plugins/{sabri-membership-core,sabri-authentication,sabri-profiles-doctors,doctors-directory,global-doctor-onboarding,worldwide-clinic-appointments}
          tar -C native-file00/source/sabri-membership-core -cf - . | tar -C /tmp/file08-ci-wp/wp-content/plugins/sabri-membership-core -xf -
          tar -C native-file02 -cf - --exclude=.git . | tar -C /tmp/file08-ci-wp/wp-content/plugins/sabri-authentication -xf -
          tar -C native-file03 -cf - --exclude=.git . | tar -C /tmp/file08-ci-wp/wp-content/plugins/sabri-profiles-doctors -xf -
          tar -C native-file07/doctors-directory -cf - . | tar -C /tmp/file08-ci-wp/wp-content/plugins/doctors-directory -xf -
          tar -C native-file09 -cf - --exclude=.git . | tar -C /tmp/file08-ci-wp/wp-content/plugins/global-doctor-onboarding -xf -
          tar -C "$GITHUB_WORKSPACE" -cf - --exclude=.git --exclude=build --exclude=native-file00 --exclude=native-file02 --exclude=native-file03 --exclude=native-file07 --exclude=native-file09 . | tar -C /tmp/file08-ci-wp/wp-content/plugins/worldwide-clinic-appointments -xf -
          # File00 intentionally defers its secure migrations to a REAL admin_init.
          # Respect the owner lifecycle; never manufacture option/schema markers.
          php /tmp/file08-wp-cli.phar plugin activate sabri-membership-core --path=/tmp/file08-ci-wp --allow-root
          php /tmp/file08-wp-cli.phar eval 'wp_set_current_user(1); do_action("admin_init"); if ((string)get_option("smc_db_version","") !== SMC_DB_VERSION) { fwrite(STDERR,"FILE00_BOOTSTRAP_NOT_READY ".wp_json_encode(get_option("smc_activation_bootstrap_state_v2",array()))."\\n"); exit(12); } echo "File00 real admin deferred migration complete: ".SMC_DB_VERSION."\\n";' --path=/tmp/file08-ci-wp --allow-root
          for name in sabri-authentication sabri-profiles-doctors global-doctor-onboarding doctors-directory worldwide-clinic-appointments; do
            php /tmp/file08-wp-cli.phar plugin activate "$name" --path=/tmp/file08-ci-wp --allow-root
          done
      - name: Verify exact native six-plugin WordPress/MariaDB runtime and incomplete-page fault
        env:
          FILE08_CI_EPHEMERAL_DB: yes
        shell: bash
        run: |
          set -euo pipefail
          php /tmp/file08-wp-cli.phar eval-file /tmp/file08-ci-wp/wp-content/plugins/worldwide-clinic-appointments/tests/v121-real-wordpress-mariadb.php --path=/tmp/file08-ci-wp --allow-root
