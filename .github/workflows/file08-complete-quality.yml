name: T25 R10 Frozen-Ledger Correction
on:
  push:
    branches:
      - review/file08-t21-ten-round-2026-09-09
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply R10 corrections after frozen review
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/t25-r10-correct.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md STATUS.md CHANGELOG.md readme.txt docs/RELEASE-STATUS-1.0.0.md docs/T25-R10-CORRECTION-EVIDENCE.md tests/t24-r9-release-currentness-regressions.php tests/t25-r10-release-closure-regressions.php tests/run-all.php
          git commit -m "T25 R10: correct release truth and close review cycle"
          git push
