name: File 08 T24 R9 Release Currentness Correction
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.event.pull_request.head.ref }}'
          fetch-depth: 5
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Apply T24 R9 correction after frozen review
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/T24-R9-FROZEN-LEDGER.md
          python3 - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          c = changelog.read_text()
          old1 = "- **T22 closure cycle is the current repository review sequence.** Through R9: R1 clean; R2 defect-bearing/corrected; R3–R7 clean; R8 defect-bearing/corrected; R9 defect-bearing/corrected and exact-head green at `c3b46247b69bd87534e5fab4133ebf423a1da893` / canonical run `34838735323`. R10 is the final T22 closure review and does not inherit prior exact-head QA after any correction changes HEAD."
          new1 = "- **T24 closure cycle is the current repository review sequence.** Current ten-round continuation: T23 R10 clean; T24 R1 defect-bearing/corrected; T24 R2–R8 clean; T24 R9 defect-bearing/corrected. Exact-head CI/package status is determined only by the canonical workflow on the exact HEAD under evaluation."
          old2 = "- T22 material hardening in the same 1.2.15 candidate includes **audit-actor provenance** alignment, **File26** whole-clinic eligibility/delegation invalidation reconciliation, and **localization/timezone** plus translation-safe Continuity presentation corrections."
          new2 = "- T24 material hardening in the same 1.2.15 candidate includes uncertain-transaction idempotency retention for verified **CF02** complaint-status projection, verified **CF03** payment-status projection and generic **Future24** mutations, plus release-currentness documentation/regression correction.\n- **Historical T22 R1–R10 is closed.** Its former exact heads/runs remain provenance only after later commits."
          if old1 in c: c = c.replace(old1, new1, 1)
          if old2 in c: c = c.replace(old2, new2, 1)
          if old1 in c or old2 in c: raise SystemExit('stale T22 changelog currentness remained')
          if '**T24 closure cycle is the current repository review sequence.**' not in c: raise SystemExit('T24 changelog currentness missing')
          changelog.write_text(c)

          Path('tests/t22-r10-release-currentness-regressions.php').write_text(r'''<?php
          $root = dirname( __DIR__ );
          $readme = file_get_contents( $root . '/README.md' );
          $status = file_get_contents( $root . '/STATUS.md' );
          $release = file_get_contents( $root . '/docs/RELEASE-STATUS-1.0.0.md' );
          $change = file_get_contents( $root . '/CHANGELOG.md' );
          $ledger = file_get_contents( $root . '/docs/T22-R10-FROZEN-LEDGER.md' );
          foreach ( array( $readme, $status, $release, $change, $ledger ) as $source ) { if ( ! is_string( $source ) ) { fwrite( STDERR, "T22 R10 source read failed\n" ); exit( 1 ); } }
          $checks = array(
              'README keeps T22 historical' => false !== strpos( $readme, 'Historical T22:' ),
              'STATUS keeps T22 historical' => false !== strpos( $status, '## Historical T22 result' ),
              'release status keeps T22 historical' => false !== strpos( $release, 'Historical T22 and T21' ),
              'changelog keeps T22 historical' => false !== strpos( $change, 'Historical T22 R1–R10 is closed' ),
              'T22 frozen ledger remains preserved' => false !== strpos( $ledger, 'read-only closure/release-truth review' ) && false !== strpos( $ledger, 'No R10 correction was applied while the review was open' ),
              'repository truth remains separate from live truth' => false !== strpos( $status, 'Live-Deployed | **Unverified / not claimed.**' ) && false !== strpos( $release, 'Production release/deployment: **NO / UNVERIFIED**' ),
          );
          $failures = array(); foreach ( $checks as $name => $ok ) { if ( ! $ok ) { $failures[] = $name; } }
          if ( $failures ) { fwrite( STDERR, "T22 R10 historical-currentness regressions failed:\n- " . implode( "\n- ", $failures ) . "\n" ); exit( 1 ); }
          echo 'T22 R10 historical-currentness regressions: PASS ' . count( $checks ) . '/' . count( $checks ) . "\n";
          ''')

          Path('tests/t24-r9-release-currentness-regressions.php').write_text(r'''<?php
          $root = dirname( __DIR__ );
          $readme = file_get_contents( $root . '/README.md' );
          $status = file_get_contents( $root . '/STATUS.md' );
          $release = file_get_contents( $root . '/docs/RELEASE-STATUS-1.0.0.md' );
          $change = file_get_contents( $root . '/CHANGELOG.md' );
          $ledger = file_get_contents( $root . '/docs/T24-R9-FROZEN-LEDGER.md' );
          foreach ( array( $readme, $status, $release, $change, $ledger ) as $source ) { if ( ! is_string( $source ) ) { fwrite( STDERR, "T24 R9 source read failed\n" ); exit( 1 ); } }
          $checks = array(
              'README identifies T24 current cycle' => false !== strpos( $readme, 'Current review cycle: **T24 closure cycle' ),
              'STATUS identifies T24 current discipline' => false !== strpos( $status, 'Current review discipline: **T24 closure cycle' ),
              'release status identifies T24 current cycle' => false !== strpos( $release, 'Current review cycle: **T24 closure cycle**' ),
              'changelog identifies T24 current cycle' => false !== strpos( $change, '**T24 closure cycle is the current repository review sequence.**' ),
              'old T22 current-cycle assertion retired from changelog' => false === strpos( $change, '**T22 closure cycle is the current repository review sequence.**' ),
              'old T22 exact-head run retired from current docs' => false === strpos( $readme, '34838735323' ) && false === strpos( $status, '34838735323' ) && false === strpos( $release, '34838735323' ) && false === strpos( $change, '34838735323' ),
              'static docs avoid future CI success claim' => false !== strpos( $status, 'Exact-head CI/package status is determined from the canonical workflow on the exact HEAD' ) && false !== strpos( $release, 'does not hard-code a future CI success' ),
              'live truth remains unclaimed' => false !== strpos( $status, 'Live-Deployed | **Unverified / not claimed.**' ) && false !== strpos( $release, 'Production release/deployment: **NO / UNVERIFIED**' ),
              'R9 ledger proves review before correction' => false !== strpos( $ledger, 'No R9 correction was applied while the review remained open' ) && false !== strpos( $ledger, 'R9-D1'),
          );
          $failures = array(); foreach ( $checks as $name => $ok ) { if ( ! $ok ) { $failures[] = $name; } }
          if ( $failures ) { fwrite( STDERR, "T24 R9 release-currentness regressions failed:\n- " . implode( "\n- ", $failures ) . "\n" ); exit( 1 ); }
          echo 'T24 R9 release-currentness regressions: PASS ' . count( $checks ) . '/' . count( $checks ) . "\n";
          ''')

          runner = Path('tests/run-all.php')
          r = runner.read_text()
          if 't24-r9-release-currentness-regressions.php' not in r:
              needle = "'t24-r1-idempotency-uncertainty-regressions.php' );"
              repl = "'t24-r1-idempotency-uncertainty-regressions.php', 't24-r9-release-currentness-regressions.php' );"
              if needle not in r: raise SystemExit('T24 R9 aggregate insertion target missing')
              runner.write_text(r.replace(needle, repl, 1))
          PY
          php -l tests/t22-r10-release-currentness-regressions.php
          php -l tests/t24-r9-release-currentness-regressions.php
          php tests/run-all.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md tests/t22-r10-release-currentness-regressions.php tests/t24-r9-release-currentness-regressions.php tests/run-all.php
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'T24 R9: correct release-currentness truth and regression'
          git push origin HEAD:'${{ github.event.pull_request.head.ref }}'
