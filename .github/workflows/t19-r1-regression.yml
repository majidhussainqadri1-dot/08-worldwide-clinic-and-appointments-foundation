name: File 08 T19 R1 Regression
on:
  push:
    branches: [review/file08-t19-twenty-round-2026-09-06]
permissions:
  contents: read
jobs:
  regression:
    name: PHP ${{ matrix.php }} full source suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '${{ matrix.php }}', coverage: none, extensions: zip}
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Full File 08 source suite
        run: php tests/run-all.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
