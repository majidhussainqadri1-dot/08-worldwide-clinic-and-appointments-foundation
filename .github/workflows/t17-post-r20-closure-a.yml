name: File 08 Post-R20 Closure Verification A
on: push
permissions:
  contents: read
jobs:
  closure-a:
    if: github.ref == 'refs/heads/tmp-file08-post-r20-closure-a-20260831'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Freeze exact final source
        run: |
          set -euo pipefail
          git checkout --detach 5f073e7412b834c1ad22e6c8dfb52f24591207fc
          test "$(git rev-parse HEAD)" = "5f073e7412b834c1ad22e6c8dfb52f24591207fc"
          test -z "$(git status --porcelain)"
      - name: Complete fresh adversarial review A and freeze ledger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import glob, json, re, subprocess, sys

          defects=[]
          def rec(label, ok, detail=''):
              print(('PASS' if ok else 'FAIL') + ': ' + label + ((' :: '+detail) if detail else ''))
              if not ok: defects.append(label)
              return ok
          def run(label, cmd, capture=False):
              p=subprocess.run(cmd,shell=True,text=True,stdout=subprocess.PIPE if capture else None,stderr=subprocess.STDOUT if capture else None)
              if capture and p.stdout: print(p.stdout,end='')
              rec(label,p.returncode==0,('rc='+str(p.returncode)) if p.returncode else '')
              return p
          def txt(p): return Path(p).read_text(errors='replace')

          print('--- A1: COMPLETE SOURCE SUITE / DIAGNOSTIC REVIEW ---')
          run('all PHP files lint', "find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/a-lint.txt")
          suite=run('all File08 source suites pass','php -d display_errors=1 -d error_reporting=E_ALL tests/run-all.php',True)
          diag=re.compile(r'(?:PHP\s+)?(?:Warning|Notice|Deprecated|Fatal error|Parse error)\s*:',re.I)
          bad=[x for x in (suite.stdout or '').splitlines() if diag.search(x)]
          rec('full suite emits no PHP diagnostics',not bad,' | '.join(bad[:4]))
          run('clinic.js parses','node --check assets/js/clinic.js')
          run('continuity.js parses','node --check assets/js/continuity.js')
          run('future24.js parses','node --check assets/js/future24.js')

          print('--- A2: AUTHORIZATION / MUTATION / PRIVACY / MIGRATION REVIEW ---')
          php='\n'.join(p.read_text(errors='replace') for p in Path('includes').glob('*.php')) + '\n' + txt('worldwide-clinic.php')
          rec('unauthenticated write AJAX absent',not re.search(r'wp_ajax_nopriv_.*(?:save|create|delete|update|book|cancel|reschedule|complete|submit)',php))
          continuity=txt('includes/class-wca-continuity-secure.php')
          privacy=txt('includes/class-wca-privacy.php')
          future=txt('includes/class-wca-future24.php')
          calendar=txt('includes/class-wca-calendar-link.php')
          contracts=txt('includes/class-wca-contracts.php')
          rec('continuity routes are not anonymously writable',"'permission_callback' => '__return_true'" not in continuity)
          rec('intake canonical expected-version guard exists','wca_intake_version_required' in continuity)
          rec('appointment-processing consent is canonical persistence gate','appointment_processing' in continuity and 'before pre-visit information is stored' in continuity)
          rec('privacy legal hold exists','legal_hold' in privacy and 'wca_appointment_legal_hold' in privacy)
          rec('destructive purge needs verified backup','wca_purge_backup_verified' in privacy)
          rec('Future24 schema migration is current',"const SCHEMA_VERSION   = '1.1.0'" in future)
          rec('episode mutation has optimistic concurrency','wca_episode_version_required' in future and 'wca_episode_stale' in future)
          rec('FHIR has explicit degraded state','wca_fhir_adapter_disabled' in future and "'degraded' => true" in future)
          rec('FHIR has version and freshness metadata','versionId' in future and 'lastUpdated' in future)
          rec('calendar provider webhook is delegated for verification','wca_calendar_provider_verify_webhook' in calendar)
          rec('calendar provider webhook is idempotent',"claim_idempotency( 'calendar_provider_webhook'" in calendar)
          rec('signed ICS uses constant-time equality','hash_equals( $expected, $sig )' in calendar)
          rec('platform commission remains zero',"'commission_percent' => 0" in contracts)
          rec('donation visibility remains neutral',"'donation_visibility_link' => false" in contracts)
          rec('automated diagnosis remains disabled',"'automated_diagnosis' => false" in contracts)
          rec('automated prescribing remains disabled',"'automated_prescribing' => false" in contracts)
          rec('foreign canonical table writes absent',not re.search(r'(?:CREATE TABLE|INSERT INTO)[^\n]*(?:file17|file19|file20|file24|file26)',php,re.I))
          unbounded=[]
          ub=re.compile(r"posts_per_page['\"]?\s*=>\s*-1|numberposts['\"]?\s*=>\s*-1|nopaging['\"]?\s*=>\s*true")
          for p in Path('includes').glob('*.php'):
              if ub.search(txt(p)): unbounded.append(p.name)
          rec('unbounded WordPress query patterns absent',not unbounded,','.join(unbounded))

          print('--- A3: WARNING-CLEAN CORRECTION REGRESSION REVIEW ---')
          r16=run('R16 regression itself is warning-clean','php -d display_errors=1 -d error_reporting=E_ALL tests/seventeenth-r16-finance-schema-reconciliation-regressions.php',True)
          rec('R16 regression output has no PHP diagnostic',not any(diag.search(x) for x in (r16.stdout or '').splitlines()))
          r20=run('R20 diagnostic regression passes','php -d display_errors=1 -d error_reporting=E_ALL tests/seventeenth-r20-warning-clean-regressions.php',True)
          rec('R20 diagnostic regression output has no PHP diagnostic',not any(diag.search(x) for x in (r20.stdout or '').splitlines()))
          runall=txt('tests/run-all.php')
          rec('run-all captures child stderr','2>&1' in runall)
          rec('run-all enforces E_ALL','error_reporting=E_ALL' in runall)
          rec('run-all rejects PHP diagnostics','$diagnostic_pattern' in runall and 'source-level test suite emitted a PHP diagnostic' in runall)

          print('--- A4: HYGIENE / REPRODUCIBLE PACKAGE REVIEW ---')
          risky=[str(p) for p in Path('.').rglob('*') if p.is_file() and (p.name=='.env' or p.suffix in {'.pem','.key','.p12','.b64'})]
          rec('private key/env artifacts absent',not risky,','.join(risky[:8]))
          links=[str(p) for p in Path('.').rglob('*') if p.is_symlink()]
          rec('repository symlinks absent',not links,','.join(links[:8]))
          candidates=[]
          for p in Path('.').rglob('*'):
              if p.is_file() and '.git' not in p.parts and p.stat().st_size<2_000_000:
                  try: candidates.append(p.read_text(errors='ignore'))
                  except: pass
          rec('obvious embedded secrets absent',re.search(r'BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}','\n'.join(candidates)) is None)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          epoch=subprocess.check_output(['git','show','-s','--format=%ct','HEAD'],text=True).strip()
          subprocess.run('rm -rf build/closure-a-1 build/closure-a-2',shell=True)
          ba=run('candidate build A succeeds',f'php tools/build-candidate.php --output-dir=build/closure-a-1 --commit={sha} --source-date-epoch={epoch}',True)
          bb=run('candidate build B succeeds',f'php tools/build-candidate.php --output-dir=build/closure-a-2 --commit={sha} --source-date-epoch={epoch}',True)
          def one(pat):
              x=glob.glob(pat); return x[0] if len(x)==1 else None
          za,zb=one('build/closure-a-1/*-candidate.zip'),one('build/closure-a-2/*-candidate.zip')
          ma,mb=one('build/closure-a-1/*-candidate-manifest.json'),one('build/closure-a-2/*-candidate-manifest.json')
          ha,hb=one('build/closure-a-1/*-candidate.sha256'),one('build/closure-a-2/*-candidate.sha256')
          rec('each build has exactly one ZIP manifest and checksum',all([za,zb,ma,mb,ha,hb]))
          if za and zb: rec('candidate ZIP is byte reproducible',Path(za).read_bytes()==Path(zb).read_bytes())
          if ma and mb: rec('candidate manifest is byte reproducible',Path(ma).read_bytes()==Path(mb).read_bytes())
          if ha and hb: rec('candidate checksum is byte reproducible',Path(ha).read_bytes()==Path(hb).read_bytes())
          if za: run('candidate A verifies',f'php tools/verify-candidate.php --artifact=build/closure-a-1 --commit={sha}',True)
          if zb: run('candidate B verifies',f'php tools/verify-candidate.php --artifact=build/closure-a-2 --commit={sha}',True)
          if ma:
              try:
                  m=json.loads(Path(ma).read_text())
                  rec('manifest exact source commit',m.get('commit')==sha,str(m.get('commit')))
                  rec('manifest does not claim staging acceptance',not bool(m.get('staging_accepted')))
                  rec('manifest does not claim production acceptance',not bool(m.get('production_accepted')))
                  rec('manifest commission is zero',int(m.get('commission_percent',-1))==0)
              except Exception as e: rec('manifest parses as JSON',False,repr(e))
          subprocess.run('rm -rf build/closure-a-1 build/closure-a-2',shell=True)

          print('=== POST-R20 CLOSURE A FROZEN DEFECT LEDGER ===')
          if defects:
              for i,d in enumerate(defects,1): print(f'{i}. {d}')
          else: print('No supported defect found.')
          print('CLOSURE_A_DEFECT_COUNT='+str(len(defects)))
          sys.exit(1 if defects else 0)
          PY
