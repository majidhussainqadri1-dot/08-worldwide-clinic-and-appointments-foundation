name: File 08 T15 Audit Probe
on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0
      - name: Repository audit probe
        shell: bash
        run: |
          set -uo pipefail
          echo '=== HEAD ==='; git rev-parse HEAD
          echo '=== DB read casts/null swallowing ==='
          grep -RInE '\(array\).*\$wpdb->get_(results|row|col)|\(int\).*\$wpdb->get_var|get_(results|row|col|var)\(' includes | head -n 400 || true
          echo '=== unchecked metadata/options mutations ==='
          grep -RInE '(^|[^=])\b(update|delete|add)_(post|user)_meta\(|(^|[^=])\b(update|delete|add)_option\(' includes | head -n 400 || true
          echo '=== direct DB mutations ==='
          grep -RInE '\$wpdb->(insert|update|delete|query)\(' includes | head -n 500 || true
          echo '=== permissive time parsing ==='
          grep -RInE 'strtotime\(|new DateTimeImmutable\(' includes | head -n 300 || true
          echo '=== numeric coercion / monetary ==='
          grep -RInE 'absint\(.*(amount|fee|price|capacity|duration|count)|floatval\(|intval\(' includes | head -n 300 || true
          echo '=== public rate/caching/cursors ==='
          grep -RInE 'rate_limit_hit|generated_at|ETag|next_cursor|cursor|REMOTE_ADDR' includes/class-wca-rest.php includes/class-wca-ten-review-hardening.php includes/class-swc-helpers.php | head -n 300 || true
          echo '=== TODO/FIXME/stale versions ==='
          grep -RInE 'TODO|FIXME|1\.2\.13|1\.2\.12|1\.2\.11|staging_accepted|production_accepted' --exclude-dir=.git . | head -n 500 || true
          echo '=== transient/option locks and caches ==='
          grep -RInE 'set_transient|get_transient|delete_transient|GET_LOCK|RELEASE_LOCK' includes | head -n 300 || true
          echo '=== query error state usage ==='
          grep -RInE 'last_error|last_query' includes | head -n 200 || true
          exit 0
