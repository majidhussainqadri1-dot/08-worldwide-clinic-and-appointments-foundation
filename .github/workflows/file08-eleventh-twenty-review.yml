name: File 08 Eleventh Fresh 20-Round Sequential Review

on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
    paths:
      - '.github/workflows/file08-eleventh-twenty-review.yml'

permissions:
  contents: write

jobs:
  review-fix-retest:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact review branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip
      - name: Configure review committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Run twenty sequential corrected-state reviews
        shell: bash
        run: |
          set -euo pipefail
          qa() {
            find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/file08-php-lint.log
            php tests/run-all.php
            node --check assets/js/clinic.js
            node --check assets/js/continuity.js
            node --check assets/js/future24.js
            test -z "$(find . -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '*.p12' -o -name '*.b64' \) -print -quit)"
            test -z "$(find . -type l -print -quit)"
            test ! -e .gitmodules
            ! grep -RInE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' --exclude-dir=.git .
          }
          review_scope() {
            case "$1" in
              17)
                grep -q 'legal_hold' includes/class-wca-privacy.php
                grep -q 'appointment_ids_after' includes/class-wca-privacy.php
                grep -q 'future24_legal_hold' includes/class-wca-privacy.php
                ;;
              18)
                grep -q 'F08-FUT-24' includes/class-wca-future24.php
                grep -q 'clinical_authority' includes/class-wca-future24.php
                grep -q 'File17' includes/class-wca-future24.php
                ;;
              19)
                grep -q 'SCHEMA_VERSION' includes/class-wca-contracts.php
                grep -q 'rollback' STAGING-ACCEPTANCE.md
                grep -q 'accessibility' README.md
                ;;
              20)
                grep -q '1.2.11' worldwide-clinic.php
                grep -q '1.2.11' includes/class-wca-contracts.php
                grep -q 'ELEVENTH-TWENTY-REVIEW-EVIDENCE' <(find . -maxdepth 1 -type f -printf '%f\n') || test -f ELEVENTH-TWENTY-REVIEW-EVIDENCE.md
                ;;
            esac
          }

          echo "BASELINE_SOURCE_HEAD=6e7acc0d768e4258e6262d337d409dff3f635533"
          for r in $(seq 1 16); do
            echo "===== E11-R$(printf '%02d' "$r") review/fix ====="
            python3 tools/eleventh-twenty-review-patcher.py "$r"
            qa
            git add -A
            git commit -m "File 08 E11-R$(printf '%02d' "$r"): corrected sequential review"
            git push origin HEAD:codex/file08-new-governing-plans-completion-2026
            echo "E11-R$(printf '%02d' "$r") corrected-state QA PASS commit=$(git rev-parse HEAD)"
          done

          for r in 17 18 19 20; do
            echo "===== E11-R$(printf '%02d' "$r") fresh corrected-state review ====="
            review_scope "$r"
            qa
            test -z "$(git status --porcelain)"
            echo "E11-R$(printf '%02d' "$r") review PASS — no additional supported source defect"
          done

          echo '===== Remove transient review orchestration ====='
          git rm .github/workflows/file08-eleventh-twenty-review.yml tools/eleventh-twenty-review-patcher.py
          qa
          git commit -m 'File 08: close eleventh 20-round review and remove transient tooling'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
          echo "FINAL_SOURCE_HEAD=$(git rev-parse HEAD)"
