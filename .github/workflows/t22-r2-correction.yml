name: T22 R2 Frozen Correction

on:
  push:
    branches:
      - review/file08-t21-ten-round-2026-09-09
    paths:
      - .github/workflows/t22-r2-correction.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file08-t21-ten-round-2026-09-09
          fetch-depth: 0
      - name: Apply frozen R2-D1 correction and permanent regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          helpers = Path('includes/class-swc-helpers.php')
          text = helpers.read_text()
          old = """\tpublic static function audit( $appointment, $event, $args = array() ) {\n\t\tglobal $wpdb;\n\t\t$defaults = array(\n\t\t\t'actor_role'     => self::actor_role(),"""
          new = """\tpublic static function audit( $appointment, $event, $args = array() ) {\n\t\tglobal $wpdb;\n\t\t$explicit_actor_id = array_key_exists( 'actor_id', (array) $args ) ? absint( $args['actor_id'] ) : get_current_user_id();\n\t\t$defaults = array(\n\t\t\t'actor_id'       => $explicit_actor_id,\n\t\t\t'actor_role'     => self::actor_role( $explicit_actor_id ),"""
          if old not in text:
              raise SystemExit('audit defaults anchor not found')
          text = text.replace(old, new, 1)
          old = "\t\t\t'actor_id'       => get_current_user_id(),"
          new = "\t\t\t'actor_id'       => absint( $args['actor_id'] ),"
          if old not in text:
              raise SystemExit('audit actor_id anchor not found')
          text = text.replace(old, new, 1)
          old = """\tprivate static function actor_role() {\n\t\tif ( current_user_can( 'manage_worldwide_clinic' ) ) {\n\t\t\treturn 'admin';\n\t\t}\n\t\tif ( self::is_verified_doctor( get_current_user_id() ) ) {\n\t\t\treturn 'doctor';\n\t\t}\n\t\treturn is_user_logged_in() ? 'patient' : 'system';\n\t}"""
          new = """\tprivate static function actor_role( $user_id = 0 ) {\n\t\t$user_id = absint( $user_id );\n\t\tif ( $user_id && user_can( $user_id, 'manage_worldwide_clinic' ) ) {\n\t\t\treturn 'admin';\n\t\t}\n\t\tif ( $user_id && self::is_verified_doctor( $user_id ) ) {\n\t\t\treturn 'doctor';\n\t\t}\n\t\treturn $user_id ? 'patient' : 'system';\n\t}"""
          if old not in text:
              raise SystemExit('actor_role anchor not found')
          helpers.write_text(text.replace(old, new, 1))

          service = Path('includes/class-wca-service.php')
          text = service.read_text()
          old = """SWC_Helpers::audit( $appointment_id, 'wca-transition', array( 'old_status' => $current, 'new_status' => $next, 'reason' => sanitize_text_field( $data['reason_code'] ?? '' ), 'details' => array( 'trace_id' => $trace ) ) )"""
          new = """SWC_Helpers::audit( $appointment_id, 'wca-transition', array( 'actor_id' => $actor_user_id, 'old_status' => $current, 'new_status' => $next, 'reason' => sanitize_text_field( $data['reason_code'] ?? '' ), 'details' => array( 'trace_id' => $trace ) ) )"""
          if old not in text:
              raise SystemExit('transition audit anchor not found')
          service.write_text(text.replace(old, new, 1))

          regression = Path('tests/t22-r2-audit-actor-provenance-regressions.php')
          regression.write_text(r'''<?php
$root = dirname( __DIR__ );
$helpers = file_get_contents( $root . '/includes/class-swc-helpers.php' );
$service = file_get_contents( $root . '/includes/class-wca-service.php' );
$failures = array();

if ( false === strpos( $helpers, "array_key_exists( 'actor_id', (array) $args )" ) ) {
    $failures[] = 'audit must accept an explicit actor_id instead of always deriving the browser current user';
}
if ( false === strpos( $helpers, "'actor_id'       => absint( $args['actor_id'] )" ) ) {
    $failures[] = 'audit persistence must use the normalized explicit actor_id';
}
if ( false === strpos( $helpers, 'private static function actor_role( $user_id = 0 )' ) || false === strpos( $helpers, "user_can( $user_id, 'manage_worldwide_clinic' )" ) ) {
    $failures[] = 'audit actor role derivation must be actor-specific';
}
if ( false === strpos( $service, "SWC_Helpers::audit( $appointment_id, 'wca-transition', array( 'actor_id' => $actor_user_id" ) ) {
    $failures[] = 'canonical transition audit must receive the same explicit actor used by authorization and append_event';
}

if ( $failures ) {
    fwrite( STDERR, "T22 R2 audit actor provenance regressions failed:\n- " . implode( "\n- ", $failures ) . "\n" );
    exit( 1 );
}
echo "T22 R2 audit actor provenance regressions passed.\n";
''')

          runner = Path('tests/run-all.php')
          text = runner.read_text()
          anchor = "'t21-r10-candidate-required-payload-regressions.php' );"
          replacement = "'t21-r10-candidate-required-payload-regressions.php', 't22-r2-audit-actor-provenance-regressions.php' );"
          if anchor not in text:
              raise SystemExit('run-all anchor not found')
          runner.write_text(text.replace(anchor, replacement, 1))
          PY
          php -l includes/class-swc-helpers.php
          php -l includes/class-wca-service.php
          php -l tests/t22-r2-audit-actor-provenance-regressions.php
          php tests/t22-r2-audit-actor-provenance-regressions.php
          rm .github/workflows/t22-r2-correction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-swc-helpers.php includes/class-wca-service.php tests/t22-r2-audit-actor-provenance-regressions.php tests/run-all.php .github/workflows/t22-r2-correction.yml
          git commit -m "fix: preserve T22 R2 audit actor provenance"
          git push origin HEAD:review/file08-t21-ten-round-2026-09-09
