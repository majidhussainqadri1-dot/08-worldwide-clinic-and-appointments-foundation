name: File 08 Twelfth 20-Round Release Closure

on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
    paths:
      - '.github/workflows/file08-twelfth-release-close.yml'

permissions:
  contents: write

jobs:
  release-close:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact R20-corrected branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip
      - name: Configure committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Release identity and evidence closure
        shell: bash
        run: |
          set -euo pipefail
          qa() {
            find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/file08-php-lint.log
            php tests/run-all.php 2>&1 | tee /tmp/file08-tests.log
            ! grep -E 'PHP (Warning|Notice|Deprecated|Fatal|Parse)' /tmp/file08-tests.log
            node --check assets/js/clinic.js
            node --check assets/js/continuity.js
            node --check assets/js/future24.js
            test -z "$(find . -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '*.p12' -o -name '*.b64' \) -print -quit)"
            test -z "$(find . -type l -print -quit)"
            test ! -e .gitmodules
            ! grep -RInE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' --exclude-dir=.git .
          }
          python3 tools/t12-release-final.py
          qa
          git add -A
          git commit -m 'File 08: close twelfth 20-round source at v1.2.12'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
          echo "T12_RELEASE_HEAD=$(git rev-parse HEAD)"

          for f in tools/twelfth-twenty-review-patcher.py tools/t12-r19-r20-final.py tools/t12-release-final.py .github/workflows/file08-twelfth-twenty-review.yml .github/workflows/file08-twelfth-twenty-review-resume.yml .github/workflows/file08-twelfth-r11-r20.yml .github/workflows/file08-twelfth-r19-r20-final.yml .github/workflows/file08-twelfth-release-close.yml; do
            if [ -e "$f" ]; then git rm "$f"; fi
          done
          qa
          git add -A
          git commit -m 'File 08: remove transient twelfth-review tooling'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
          echo "FINAL_SOURCE_HEAD=$(git rev-parse HEAD)"

          echo '===== Fresh post-final-change review A ====='
          test -z "$(git status --porcelain)"
          grep -q 'Version: 1.2.12' worldwide-clinic.php
          grep -q "RUNTIME_VERSION                 = '1.2.12'" includes/class-wca-contracts.php
          grep -q 'wca_disruption_transaction' includes/class-wca-future24.php
          grep -q 'wca_repository_availability_numeric_range' includes/class-wca-repository.php
          qa
          echo 'POST_FINAL_REVIEW_A=PASS'

          echo '===== Fresh post-final-change review B ====='
          grep -q 'T12-R20 | DEFECT CORRECTED' TWELFTH-TWENTY-REVIEW-EVIDENCE.md
          test "$(find .github/workflows -maxdepth 1 -type f -name 'file08-twelfth*' | wc -l)" -eq 0
          test ! -e tools/twelfth-twenty-review-patcher.py
          test ! -e tools/t12-r19-r20-final.py
          qa
          echo 'POST_FINAL_REVIEW_B=PASS'
          # retry-generation: 2
