name: File 08 T13 Documentation Reconciliation
on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
      - name: Reconcile historical/current status wording
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          f=Path('README.md'); s=f.read_text()
          s=s.replace('R16 aligns release identity and permanent evidence to v1.2.12. R17-R20','R16 aligns release identity and permanent evidence to v1.2.11. R17-R20')
          f.write_text(s)
          f=Path('STATUS.md'); s=f.read_text()
          s=s.replace('R16 aligns runtime/tests/docs and permanent regression evidence to v1.2.12 without schema inflation. R17-R20','R16 aligns runtime/tests/docs and permanent regression evidence to v1.2.11 without schema inflation. R17-R20')
          s=s.replace('Corrected candidate** — ninth-cycle source corrections are present.','Corrected candidate** — thirteenth-cycle source corrections are present.')
          old='No older v1.2.1/v1.2.2/v1.2.3/v1.2.4/v1.2.5/v1.2.6/v1.2.7/v1.2.8 artifact or older CI run may be used as evidence for the v1.2.9 candidate.'
          new='No older v1.2.1 through v1.2.12 artifact or older CI run may be used as evidence for the v1.2.13 candidate.'
          s=s.replace(old,new)
          f.write_text(s)
          PY
      - name: Commit documentation reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/t13-docfix.yml
          git add README.md STATUS.md
          git commit -m "File 08: reconcile thirteenth release documentation"
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
