name: Controlled Source Import

on:
  push:
    branches:
      - baseline/file-08-original-import

permissions:
  contents: write

concurrency:
  group: file-08-source-import
  cancel-in-progress: false

jobs:
  import:
    if: ${{ hashFiles('.source-import/file08.zip.b64') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out baseline branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: baseline/file-08-original-import

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.3'
          coverage: none

      - name: Decode, verify, and extract exact archive
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .source-import/file08.zip.b64 > /tmp/file08.zip
          echo '3c891d33b809a87edf3df70945d970a0d62d6cdb96cd34e1c2695751c04bd057  /tmp/file08.zip' | sha256sum --check -
          unzip -t /tmp/file08.zip
          rm -rf /tmp/file08-extract
          mkdir -p /tmp/file08-extract
          unzip -q /tmp/file08.zip -d /tmp/file08-extract
          test -f /tmp/file08-extract/worldwide-clinic/worldwide-clinic.php
          cp -a /tmp/file08-extract/worldwide-clinic/. ./

      - name: Generate preservation evidence
        shell: bash
        run: |
          set -euo pipefail
          find assets includes -type f -print0 | sort -z | xargs -0 sha256sum > CHECKSUMS.sha256
          sha256sum readme.txt uninstall.php worldwide-clinic.php >> CHECKSUMS.sha256

          {
            echo '# Source Manifest'
            echo
            echo 'The following files are the exact extracted contents of the original File 08 archive.'
            echo
            echo '| Path | Bytes | SHA-256 |'
            echo '|---|---:|---|'
            while IFS= read -r file; do
              bytes=$(stat -c '%s' "$file")
              sha=$(sha256sum "$file" | awk '{print $1}')
              printf '| `%s` | %s | `%s` |\n' "$file" "$bytes" "$sha"
            done < <(find assets includes -type f; printf '%s\n' readme.txt uninstall.php worldwide-clinic.php) | sort
          } > MANIFEST.md

          cat > README.md <<'EOF'
          # File 08 — Worldwide Clinic and Appointments Foundation

          This repository preserves the source of **File 08 — Worldwide Clinic and Appointments Foundation** for the Sabri Social Homeopathy Platform.

          ## Baseline package

          - Original archive: `08-worldwide-clinic-and-appointments-foundation-0.1.0.zip`
          - Plugin slug: `worldwide-clinic`
          - Plugin version: `0.1.0`
          - Import type: exact extracted source baseline
          - Production approval: **Not granted by this import**
          - Audit status: **Pending separate post-import review**

          ## Governing rule

          The baseline branch preserves the original extracted plugin source. Corrections, modernization, security work, integration work, and harmonization must occur on separate audit and corrective branches after an independent review.

          ## Source evidence

          - `SOURCE-PROVENANCE.md`
          - `STATUS.md`
          - `MANIFEST.md`
          - `CHECKSUMS.sha256`
          - `POST-IMPORT-REVIEW.md`

          The original ZIP is used only as a controlled import payload and is removed from the branch after extraction. Its SHA-256 digest is recorded in the provenance document.
          EOF
          sed -i 's/^          //' README.md

          cat > SOURCE-PROVENANCE.md <<'EOF'
          # Source Provenance

          ## Imported package

          | Field | Value |
          |---|---|
          | File number | `08` |
          | Module | `Worldwide Clinic and Appointments Foundation` |
          | Original archive | `08-worldwide-clinic-and-appointments-foundation-0.1.0.zip` |
          | Archive SHA-256 | `3c891d33b809a87edf3df70945d970a0d62d6cdb96cd34e1c2695751c04bd057` |
          | Extracted root | `worldwide-clinic/` |
          | Plugin slug | `worldwide-clinic` |
          | Declared plugin version | `0.1.0` |
          | Source file count | `13` |
          | Extracted source size | `56444` bytes |
          | Baseline branch | `baseline/file-08-original-import` |
          | Import date | `2026-07-29` |
          | Import purpose | Controlled source preservation before audit and correction |

          ## Import controls

          - The archive was checksum-verified, tested, and extracted in GitHub Actions.
          - All imported PHP files passed `php -l` before the final import commit.
          - The imported JavaScript file passed `node --check` before the final import commit.
          - The original source files were not edited during baseline preparation.
          - Repository documentation and workflow files are import metadata; they are not part of the original plugin package.
          - The temporary base64 import payload is removed from the branch after extraction.

          ## Important limitation

          This record proves which archive was imported and which extracted files were preserved. It does **not** prove that version `0.1.0` is secure, complete, compatible, staging-approved, or production-ready.
          EOF
          sed -i 's/^          //' SOURCE-PROVENANCE.md

          cat > STATUS.md <<'EOF'
          # Status

          ## Current state

          **Baseline imported — independent audit pending**

          ## What is complete

          - Original File 08 archive identified.
          - Archive SHA-256 recorded and verified.
          - Extracted source inventory prepared.
          - PHP syntax lint completed for all imported PHP files.
          - JavaScript syntax check completed.
          - Source uploaded to the controlled baseline branch.
          - Integrity evidence generated.

          ## What is not complete

          - Architectural and WordPress runtime review.
          - Security, privacy, ownership, and IDOR review.
          - Role, capability, and doctor-verification review.
          - Time-zone and daylight-saving behavior review.
          - Email-delivery and sensitive-content review.
          - Accessibility and responsive-interface review.
          - Compatibility review with Files 00, 01, 02, 03, 07, 09, 19, 20, 21, and 22.
          - Fresh installation, upgrade, rollback, and uninstall testing.
          - Hostinger staging installation.
          - End-to-end patient, verified-doctor, and administrator testing.
          - Production package approval.

          ## Release classification

          - Baseline evidence: **Yes**
          - Development candidate: **No**
          - Staging candidate: **No**
          - Production release: **No**
          - Live installation authorized: **No**

          ## Next controlled step

          Create `audit/file-08-source-review` from the accepted baseline and perform a separate review for omissions, defects, conflicts, privacy risks, security weaknesses, outdated contracts, integration gaps, and required corrections.
          EOF
          sed -i 's/^          //' STATUS.md

          cat > POST-IMPORT-REVIEW.md <<'EOF'
          # Mandatory Post-Import Review

          The baseline import is evidence preservation, not approval. Under the project QA and change-control rule, every defect found during review must be corrected, retested, and accepted before work proceeds to the next File 08 stage.

          ## Required review gates

          1. Archive and source integrity.
          2. Dependencies on Files 03 and 07 and wider Files 01–07 integration.
          3. Activation, page creation, capabilities, and deactivation boundaries.
          4. Patient ownership, assigned-doctor access, administrator access, and IDOR resistance.
          5. Institutionally verified-doctor eligibility.
          6. All seven appointment states and transitions.
          7. UTC storage, time zones, daylight-saving transitions, and future-time validation.
          8. Consent, emergency warnings, noindex/noarchive, no-cache, privacy export, erasure, and audit history.
          9. Rate limiting, nonce enforcement, input bounds, spam resistance, and administrative filters.
          10. Fresh install, upgrade, rollback, uninstall, email delivery, responsive layouts, accessibility, and end-to-end staging acceptance.

          ## Acceptance rule

          No defect, regression, privacy issue, security issue, incomplete workflow, or blocker discovered by this review may be deferred merely to continue development. It must be corrected and independently retested before the module can advance.
          EOF
          sed -i 's/^          //' POST-IMPORT-REVIEW.md

          cat > .gitignore <<'EOF'
          .DS_Store
          Thumbs.db
          *.log
          *.tmp
          *.swp
          *.swo
          .idea/
          .vscode/
          node_modules/
          vendor/
          coverage/
          .phpunit.result.cache
          EOF
          sed -i 's/^          //' .gitignore

      - name: Validate imported source
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check CHECKSUMS.sha256
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find . -type f -name '*.php' -print0)
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' -print0)

      - name: Commit exact source baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .source-import
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: import original File 08 source baseline'
          git push origin HEAD:baseline/file-08-original-import
