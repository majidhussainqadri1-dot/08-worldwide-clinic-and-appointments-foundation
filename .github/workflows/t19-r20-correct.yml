name: File 08 T19 R20 Frozen Ledger Correction
on:
  push:
    branches: [review/file08-t19-twenty-round-2026-09-06]
    paths:
      - .github/workflows/t19-r20-correct.yml
      - .github/scripts/t19-r20-fix.py
      - tests/eighth-ten-review-regressions.php
      - tests/fifteenth-twenty-review-regressions.php
      - tests/t18-r10-release-truth-regressions.php
permissions:
  contents: write
concurrency:
  group: file08-t19-r20-correct
  cancel-in-progress: false
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none, extensions: zip}
      - name: Apply frozen R20 ledger corrections
        run: python3 .github/scripts/t19-r20-fix.py
      - name: Align historical regression assertions with current closure truth
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/fifteenth-twenty-review-regressions.php')
          s = p.read_text()
          old1 = "t15h('R20 repository history preserves fifteenth closure','CHANGELOG.md','Fifteenth fresh 20-round corrective audit');"
          new1 = "t15h('R20 repository history preserves fifteenth closure','STATUS.md','Fifteenth fresh 20-round main-cycle closure');"
          old2 = "t15h('R20 changelog records clean R19','CHANGELOG.md','R19 was a clean corrected-state review');"
          new2 = "t15h('R20 current T19 clean-round classification is explicit','CHANGELOG.md','clean rounds: R10 and R12–R17');"
          for old, new in ((old1,new1),(old2,new2)):
              if s.count(old) != 1:
                  raise SystemExit('T15 closure assertion alignment mismatch: ' + old)
              s = s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Full regression suite
        run: php tests/run-all.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
      - name: Commit corrected R20 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(file08): close T19 R20 frozen ledger"
          git push origin HEAD:review/file08-t19-twenty-round-2026-09-06
