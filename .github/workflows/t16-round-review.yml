name: File 08 T16 R17 Correction Gate
on:
  push:
    branches: [codex/file08-new-governing-plans-completion-2026]
    paths: [.github/workflows/t16-round-review.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: codex/file08-new-governing-plans-completion-2026, fetch-depth: 0}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Apply closed R17 corrections
        run: |
          set -euo pipefail
          python3 tools/t16-r17-fix-central.py
          python3 tools/t16-r17-fix-continuity.py
          python3 tools/t16-r17-fix-tests.py
      - name: Full warning-free File 08 QA
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          set +e
          output=$(php -d display_errors=1 -d error_reporting=E_ALL tests/run-all.php 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 0
          if printf '%s\n' "$output" | grep -E 'PHP (Warning|Notice|Deprecated|Fatal|Parse)|Warning:|Notice:|Deprecated:'; then exit 1; fi
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
      - name: Commit R17 corrected product only after green QA
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add includes/class-wca-central-governance.php includes/class-wca-continuity-secure.php tests/sixteenth-twenty-review-regressions.php
          git diff --cached --check
          git commit -m 'fix(file08): close T16 R17 guardian consent degraded-state defects'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
