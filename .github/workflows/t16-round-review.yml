name: File 08 T16 Sequential Round Review
on:
  push:
    branches: [codex/file08-new-governing-plans-completion-2026]
    paths: [.github/workflows/t16-round-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: codex/file08-new-governing-plans-completion-2026, fetch-depth: 0}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Freeze reviewed source identity
        run: echo "REVIEW_HEAD=$(git rev-parse HEAD)"
      - name: Round 4 complete review - REST nonce replay idempotency and rate limits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=list(Path('includes').rglob('*.php'))
          alltext='\n'.join(p.read_text(errors='replace') for p in files)
          print('NONCE_CHECKS=',len(re.findall(r'(?:wp_verify_nonce|X-WP-Nonce|wp_rest)',alltext,re.I)))
          print('IDEMPOTENCY_REFERENCES=',len(re.findall(r'idempotenc',alltext,re.I)))
          print('RATE_LIMIT_REFERENCES=',len(re.findall(r'rate_limit|rate\s*\(',alltext,re.I)))
          # Registered mutating routes: inventory callbacks and inspect callback bodies for rate/idempotency.
          for p in files:
            s=p.read_text(errors='replace')
            for m in re.finditer(r'register_rest_route\s*\(',s):
              chunk=s[m.start():m.start()+3000]
              mut=bool(re.search(r"(?:CREATABLE|EDITABLE|DELETABLE|'POST'|'PUT'|'PATCH'|'DELETE')",chunk))
              if not mut: continue
              cb=re.search(r"'callback'\s*=>\s*(?:array\(\s*__CLASS__\s*,\s*'([^']+)'|'([^']+)')",chunk)
              name=(cb.group(1) or cb.group(2)) if cb else '?'
              print(f'\n@@ MUTATING_ROUTE {p} callback={name}')
              if name!='?':
                fm=re.search(r'(?:public|private|protected)\s+(?:static\s+)?function\s+'+re.escape(name)+r'\s*\([^)]*\)\s*\{',s)
                if fm:
                  nxt=re.search(r'\n\s*(?:public|private|protected)\s+(?:static\s+)?function\s+',s[fm.end():]); end=fm.end()+(nxt.start() if nxt else min(len(s)-fm.end(),6000)); body=s[fm.start():end]
                  flags={
                    'rate': bool(re.search(r'rate_limit|self::rate\s*\(',body)),
                    'idem': bool(re.search(r'idempotenc|self::mutate\s*\(',body,re.I)),
                    'auth_context': bool(re.search(r'get_current_user_id|can_|authorize|claims|guardian|actor',body)),
                  }
                  print(flags); print(body[:1600])
          # Cookie-auth permission callback must verify REST nonce for browser sessions.
          for p in files:
            s=p.read_text(errors='replace')
            for fname in ('authenticated','authorize_rest_request'):
              for fm in re.finditer(r'(?:public|private|protected)\s+(?:static\s+)?function\s+'+fname+r'\s*\([^)]*\)\s*\{',s):
                nxt=re.search(r'\n\s*(?:public|private|protected)\s+(?:static\s+)?function\s+',s[fm.end():]); end=fm.end()+(nxt.start() if nxt else min(len(s)-fm.end(),3500)); body=s[fm.start():end]
                print(f'\n## AUTH_CALLBACK {p}:{fname}\n{body[:2500]}')
          PY
      - name: Round 4 full regression confirmation
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          php tests/run-all.php
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
