name: File 08 T16 Sequential Round Review
on:
  push:
    branches: [codex/file08-new-governing-plans-completion-2026]
    paths: [.github/workflows/t16-round-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: codex/file08-new-governing-plans-completion-2026, fetch-depth: 0}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Freeze reviewed source identity
        run: echo "REVIEW_HEAD=$(git rev-parse HEAD)"
      - name: Round 9 complete review - schema migrations upgrades rollback uninstall
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets=[p for p in Path('.').rglob('*.php') if 'vendor' not in p.parts]
          pats=['dbDelta','CREATE TABLE','ALTER TABLE','DROP TABLE','SCHEMA_VERSION','DB_VERSION','db_version','maybe_upgrade','activate','deactivate','uninstall','purge','migration','cursor','snapshot','rollback','update_option','delete_option']
          for pat in pats:
            print(pat, sum(p.read_text(errors='replace').count(pat) for p in targets))
          for p in targets:
            s=p.read_text(errors='replace')
            if any(x in s for x in ('dbDelta','CREATE TABLE','maybe_upgrade','migration','purge_all_data','DROP TABLE')):
              print(f'\n===== {p} =====\n{s[:30000]}')
          # Flag schema/version writes not visibly preceded by verification and destructive operations.
          for p in targets:
            lines=p.read_text(errors='replace').splitlines()
            for i,line in enumerate(lines):
              low=line.lower()
              if ('update_option' in low or 'update_option_strict' in low) and ('version' in low or 'migration' in low):
                print(f'\n## VERSION_STATE_WRITE {p}:{i+1}\n'+'\n'.join(lines[max(0,i-15):min(len(lines),i+8)]))
              if any(x in low for x in ('drop table','delete from','wp_delete_post','delete_option')):
                print(f'\n## DESTRUCTIVE {p}:{i+1}\n'+'\n'.join(lines[max(0,i-8):min(len(lines),i+10)]))
              if 'dbdelta' in low:
                print(f'\n## DBDELTA {p}:{i+1}\n'+'\n'.join(lines[max(0,i-12):min(len(lines),i+18)]))
          PY
      - name: Round 9 full regression confirmation
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          php tests/run-all.php
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
