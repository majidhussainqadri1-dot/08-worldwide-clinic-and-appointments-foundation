name: File 08 T16 Sequential Round Review
on:
  push:
    branches: [codex/file08-new-governing-plans-completion-2026]
    paths: [.github/workflows/t16-round-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: codex/file08-new-governing-plans-completion-2026, fetch-depth: 0}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Freeze reviewed product identity
        run: |
          echo "REVIEW_TOOL_HEAD=$(git rev-parse HEAD)"
          git log --format='%H %s' -8
      - name: Round 13 timezone DST slot projection review
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=list(Path('includes').rglob('*.php'))
          pat=re.compile(r'(timezone|to_utc|strict_utc|project_rule_slot|availability|slot|buffer|DST|ambiguous|effective_from|effective_until|SLOT_HORIZON)',re.I)
          print('## TIME/SLOT TARGETS')
          for f in files:
            lines=f.read_text(errors='replace').splitlines()
            for i,line in enumerate(lines):
              if re.search(r'function\s+\w+',line) and pat.search(line):
                print(f'{f}:{i+1}: {line.strip()}')
          print('## TIME CONVERSION / RANGE CONTEXTS')
          for f in files:
            lines=f.read_text(errors='replace').splitlines()
            for i,line in enumerate(lines):
              if pat.search(line) and any(k in line for k in ('DateTime','strtotime','gmdate','timezone','effective_','start_utc','end_utc','SLOT_HORIZON')):
                print(f'{f}:{i+1}: {line.strip()}')
          print('## CONFLICT/OVERLAP CONTEXTS')
          for f in files:
            lines=f.read_text(errors='replace').splitlines()
            for i,line in enumerate(lines):
              if re.search(r'(has_conflict|start_utc<|end_utc>|status IN.*held.*booked)',line,re.I):
                print(f'{f}:{i+1}: {line.strip()}')
          PY
      - name: Round 13 full regression confirmation
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          php tests/run-all.php
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
