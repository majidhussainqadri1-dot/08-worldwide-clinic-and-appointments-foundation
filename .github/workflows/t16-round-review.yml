name: File 08 T16 Sequential Round Review
on:
  push:
    branches: [codex/file08-new-governing-plans-completion-2026]
    paths: [.github/workflows/t16-round-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: codex/file08-new-governing-plans-completion-2026, fetch-depth: 0}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Freeze reviewed product identity
        run: |
          echo "REVIEW_TOOL_HEAD=$(git rev-parse HEAD)"
          git log --format='%H %s' -8
      - name: Round 14 payment fee commission review
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=list(Path('includes').rglob('*.php'))+[Path('worldwide-clinic.php')]
          pat=re.compile(r'(payment|fee_|fee\b|currency|commission|refund|provider|amount_minor|idempot|PaymentStatusChanged)',re.I)
          print('## PAYMENT/FEE TARGET METHODS')
          for f in files:
            lines=f.read_text(errors='replace').splitlines()
            for i,line in enumerate(lines):
              if re.search(r'function\s+\w+',line) and pat.search(line):
                print(f'\n### {f}:{i+1}: {line.strip()}')
                print('\n'.join(lines[max(0,i-8):min(len(lines),i+80)]))
          print('\n## PAYMENT/FEE WRITE AND EVENT CONTEXTS')
          for f in files:
            lines=f.read_text(errors='replace').splitlines()
            for i,line in enumerate(lines):
              if pat.search(line) and any(x in line for x in ('$wpdb->insert','$wpdb->update','update_post_meta','apply_meta_mutations','enqueue(','append_event','register_rest_route')):
                print(f'\n### {f}:{i+1}\n'+'\n'.join(lines[max(0,i-10):min(len(lines),i+18)]))
          print('\n## COMMISSION INVARIANT OCCURRENCES')
          for f in files:
            for i,line in enumerate(f.read_text(errors='replace').splitlines()):
              if re.search(r'(commission|platform_commission)',line,re.I): print(f'{f}:{i+1}: {line.strip()}')
          print('\n## PAYMENT EXTERNAL OWNER / REPLAY CONTEXTS')
          for f in files:
            lines=f.read_text(errors='replace').splitlines()
            for i,line in enumerate(lines):
              if re.search(r'(PaymentStatusChanged|payment_intent|provider_ref|idempotency_key|File18|ledger)',line,re.I):
                print(f'{f}:{i+1}: {line.strip()}')
          PY
      - name: Round 14 full regression confirmation
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          php tests/run-all.php
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
