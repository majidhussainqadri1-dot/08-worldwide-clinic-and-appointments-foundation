name: File 08 T16 Sequential Round Review
on:
  push:
    branches: [codex/file08-new-governing-plans-completion-2026]
    paths: [.github/workflows/t16-round-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: codex/file08-new-governing-plans-completion-2026, fetch-depth: 0}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Freeze reviewed product identity
        run: |
          echo "REVIEW_TOOL_HEAD=$(git rev-parse HEAD)"
          git log --format='%H %s' -8
      - name: Round 15 calendar integration review
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=list(Path('includes').rglob('*.php'))+[Path('worldwide-clinic.php')]
          pat=re.compile(r'(calendar|\.ics|ics_|provider_event|external_busy|calendar_mapping|signed|signature|webhook|reconcil|busy|conflict)',re.I)
          print('## CALENDAR TARGET METHODS')
          for f in files:
            lines=f.read_text(errors='replace').splitlines()
            for i,line in enumerate(lines):
              if re.search(r'function\s+\w+',line) and pat.search(line):
                print(f'\n### {f}:{i+1}: {line.strip()}')
                print('\n'.join(lines[max(0,i-10):min(len(lines),i+100)]))
          print('\n## CALENDAR ROUTES / LINKS / EVENTS')
          for f in files:
            lines=f.read_text(errors='replace').splitlines()
            for i,line in enumerate(lines):
              if pat.search(line) and any(x in line for x in ('register_rest_route','add_rewrite','wp_nonce','hash_hmac','hash_equals','enqueue(','add_action','add_filter','$wpdb->')):
                print(f'\n### {f}:{i+1}\n'+'\n'.join(lines[max(0,i-12):min(len(lines),i+25)]))
          print('\n## EXTERNAL CALENDAR AUTHORITY CONTEXTS')
          for f in files:
            for i,line in enumerate(f.read_text(errors='replace').splitlines()):
              if re.search(r'(external.*calendar|calendar.*external|busy.*calendar|calendar.*busy|source.of.truth|canonical.*truth)',line,re.I):
                print(f'{f}:{i+1}: {line.strip()}')
          PY
      - name: Round 15 full regression confirmation
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          output=$(php -d display_errors=1 -d error_reporting=E_ALL tests/run-all.php 2>&1)
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -E 'PHP (Warning|Notice|Deprecated|Fatal|Parse)|Warning:|Notice:|Deprecated:'; then exit 1; fi
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
