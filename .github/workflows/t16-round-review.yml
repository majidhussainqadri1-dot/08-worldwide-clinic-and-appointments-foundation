name: File 08 T16 R20 Non-Workflow Correction Commit
on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
    paths:
      - .github/workflows/t16-round-review.yml
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip
      - name: Build already-validated corrected tree
        run: |
          set -euo pipefail
          rm -f tools/t16-*
          rm -f .github/workflows/t16-*
          rm -f review-evidence/t16-*
          python3 tools/r20-closure-correct.py
      - name: Reconfirm full corrected-tree gates before partial transport
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/r20-lint.txt
          php -d display_errors=1 -d error_reporting=E_ALL tests/run-all.php >/tmp/r20-tests.txt 2>&1
          cat /tmp/r20-tests.txt
          if grep -Eq 'PHP (Warning|Notice|Deprecated|Fatal|Parse)|Warning:|Notice:|Deprecated:' /tmp/r20-tests.txt; then exit 1; fi
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
          php tests/sixteenth-cycle-closure-hygiene.php
      - name: Restore workflow paths only and commit all other R20 corrections
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows
          rm -f tools/r20-closure-correct.py
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Workflow path leaked into token-limited commit' >&2
            exit 1
          fi
          git commit -m 'chore(file08): apply T16 R20 docs tests and tooling cleanup'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
