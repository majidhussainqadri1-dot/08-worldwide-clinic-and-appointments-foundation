name: File 08 T16 Sequential Round Review
on:
  push:
    branches: [codex/file08-new-governing-plans-completion-2026]
    paths: [.github/workflows/t16-round-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: codex/file08-new-governing-plans-completion-2026, fetch-depth: 0}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Freeze reviewed source identity
        run: echo "REVIEW_HEAD=$(git rev-parse HEAD)"
      - name: Round 10 complete review - public private projection cache deep links opaque refs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=list(Path('includes').rglob('*.php'))+[Path('worldwide-clinic.php')]
          pats={'register_rest_route':'register_rest_route','public_ref':'public_ref','numeric_route':r'/appointments/\\d|clinics/\\d','no_store':r'no-store|DONOTCACHE|nocache_headers','noindex':r'noindex|wp_robots|X-Robots-Tag','private_fields':r'address_private|doctor_private_note|patient_user_id|guardian_user_id|ciphertext|auth_tag|evidence_refs','public_projection':r'public_.*projection|hydrate_.*public|public_only'}
          for k,p in pats.items(): print(k,sum(len(re.findall(p,x.read_text(errors='replace'),re.I)) for x in files))
          sensitive=('address_private','doctor_private_note','patient_user_id','guardian_user_id','ciphertext','auth_tag','evidence_refs_json','actor_user_id')
          for f in files:
            lines=f.read_text(errors='replace').splitlines()
            for i,line in enumerate(lines):
              if any(x in line for x in sensitive) and any(x in '\n'.join(lines[max(0,i-8):min(len(lines),i+8)]) for x in ('return array','wp_send_json','rest_ensure_response','public_record','projection')):
                print(f'\n## SENSITIVE_PROJECTION {f}:{i+1}\n'+'\n'.join(lines[max(0,i-10):min(len(lines),i+12)]))
              if 'register_rest_route' in line:
                print(f'\n## ROUTE {f}:{i+1}\n'+'\n'.join(lines[max(0,i-2):min(len(lines),i+8)]))
              if re.search(r'(?<!public_)\b(?:appointment|clinic)_id\b',line) and ('return' in line or "'id'" in line):
                print(f'\n?? NUMERIC_ID_RETURN {f}:{i+1}\n'+'\n'.join(lines[max(0,i-5):min(len(lines),i+7)]))
          PY
      - name: Round 10 full regression confirmation
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          php tests/run-all.php
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
