name: File 08 T16 R20 Final Review Only
on:
  push:
    branches: [codex/file08-new-governing-plans-completion-2026]
    paths: [.github/workflows/t16-round-review.yml]
permissions:
  contents: read
jobs:
  final-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
      - name: Freeze R20 review state
        run: |
          echo "R20_REVIEW_HEAD=$(git rev-parse HEAD)"
          echo "R20_PRODUCT_PARENT=$(git rev-parse HEAD^)"
          git status --short
      - name: Full warning-free source QA
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/r20-lint.txt
          php -d display_errors=1 -d error_reporting=E_ALL tests/run-all.php >/tmp/r20-tests.txt 2>&1
          cat /tmp/r20-tests.txt
          if grep -Eq 'PHP (Warning|Notice|Deprecated|Fatal|Parse)|Warning:|Notice:|Deprecated:' /tmp/r20-tests.txt; then exit 1; fi
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
      - name: Deterministic double build and verification
        run: |
          set -euo pipefail
          rm -rf /tmp/r20-a /tmp/r20-b
          mkdir -p /tmp/r20-a /tmp/r20-b
          sha=$(git rev-parse HEAD)
          epoch=$(git show -s --format=%ct HEAD)
          php tools/build-development-candidate.php --source-sha="$sha" --source-epoch="$epoch" --output-dir=/tmp/r20-a
          php tools/build-development-candidate.php --source-sha="$sha" --source-epoch="$epoch" --output-dir=/tmp/r20-b
          cmp /tmp/r20-a/*.zip /tmp/r20-b/*.zip
          cmp /tmp/r20-a/*.manifest.json /tmp/r20-b/*.manifest.json
          cmp /tmp/r20-a/*.sha256 /tmp/r20-b/*.sha256
          php tools/verify-development-candidate.php /tmp/r20-a/*.zip /tmp/r20-a/*.manifest.json /tmp/r20-a/*.sha256 "$sha"
          sha256sum /tmp/r20-a/*.zip
      - name: Inventory closure evidence without changing it
        run: |
          echo 'T16 tools:'
          find tools -maxdepth 1 -type f -name 't16-*' | sort
          echo 'T16 workflows:'
          find .github/workflows -maxdepth 1 -type f -name 't16-*' | sort
          echo 'T16 review diagnostics:'
          find review-evidence -maxdepth 1 -type f -name 't16-*' | sort 2>/dev/null || true
          echo 'Known stale evidence references:'
          grep -nE 'Current fifteenth|Fifteenth fresh|58ab2ff8|31661454508|0a36b49c' README.md STATUS.md CHANGELOG.md 2>/dev/null || true
