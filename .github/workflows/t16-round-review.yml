name: File 08 T16 R18 Correction
on:
  push:
    branches: [codex/file08-new-governing-plans-completion-2026]
    paths: [.github/workflows/t16-round-review.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: codex/file08-new-governing-plans-completion-2026, fetch-depth: 0}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Apply closed R18 corrections
        run: |
          set -euo pipefail
          python3 tools/t16-r18-fix-runtime.py
          python3 tools/t16-r18-fix-schema.py
          python3 tools/t16-r18-fix-health.py
          python3 tools/t16-r18-fix-cli.py
          target=$(find tools -maxdepth 1 -name 't16-r18-fix-p*.py' -print -quit)
          python3 "$target"
      - name: Full File 08 QA with exact tail diagnostic
        run: |
          set +e
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/lint.txt 2>&1
          lint_status=$?
          php -d display_errors=1 -d error_reporting=E_ALL tests/run-all.php >/tmp/tests.txt 2>&1
          tests_status=$?
          node --check assets/js/clinic.js >/tmp/js1.txt 2>&1; js1=$?
          node --check assets/js/continuity.js >/tmp/js2.txt 2>&1; js2=$?
          node --check assets/js/future24.js >/tmp/js3.txt 2>&1; js3=$?
          set -e
          cat /tmp/tests.txt
          if [ "$lint_status" -ne 0 ]; then msg=$(tail -n 15 /tmp/lint.txt | tr '\n' ';' | head -c 5000); echo "::error title=R18 PHP lint::$msg"; exit 1; fi
          if [ "$tests_status" -ne 0 ]; then msg=$(tail -n 45 /tmp/tests.txt | tr '\n' ';' | head -c 6000); echo "::error title=R18 regression tail::$msg"; exit 1; fi
          if grep -Eq 'PHP (Warning|Notice|Deprecated|Fatal|Parse)|Warning:|Notice:|Deprecated:' /tmp/tests.txt; then msg=$(grep -E 'Warning|Notice|Deprecated|Fatal|Parse' /tmp/tests.txt | tail -n 20 | tr '\n' ';' | head -c 5000); echo "::error title=R18 warning-free gate::$msg"; exit 1; fi
          if [ "$js1" -ne 0 ] || [ "$js2" -ne 0 ] || [ "$js3" -ne 0 ]; then echo "::error title=R18 JS syntax::clinic=$js1 continuity=$js2 future24=$js3"; exit 1; fi
      - name: Commit corrected state after green QA
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add worldwide-clinic.php includes/class-swc-activator.php includes/class-wca-schema.php includes/class-wca-continuity-secure.php includes/class-wca-future24.php includes/class-wca-observability.php includes/class-wca-cli.php includes/class-wca-privacy.php
          git diff --cached --check
          git commit -m 'fix(file08): close T16 R18 migration and lifecycle integrity defects'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
