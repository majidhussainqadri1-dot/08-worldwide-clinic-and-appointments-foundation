name: File 08 T16 Sequential Round Review
on:
  push:
    branches: [codex/file08-new-governing-plans-completion-2026]
    paths: [.github/workflows/t16-round-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: codex/file08-new-governing-plans-completion-2026, fetch-depth: 0}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Freeze reviewed source identity
        run: echo "REVIEW_HEAD=$(git rev-parse HEAD)"
      - name: Round 7 complete review - transactions CAS locks rollback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=list(Path('includes').rglob('*.php'))
          text='\n'.join(p.read_text(errors='replace') for p in files)
          print('START_TRANSACTION=',text.count('START TRANSACTION'))
          print('COMMIT=',text.count('COMMIT'))
          print('ROLLBACK=',text.count('ROLLBACK'))
          print('FOR_UPDATE=',text.count('FOR UPDATE'))
          print('GET_LOCK=',text.count('GET_LOCK'))
          print('RELEASE_LOCK=',text.count('RELEASE_LOCK'))
          print('EXPECTED_VERSION=',text.count('expected_version'))
          print('VERSION_CAS=',len(re.findall(r'version[^\n]{0,120}(?:WHERE|where)|(?:WHERE|where)[^\n]{0,120}version',text)))
          # Dump transaction helper and all methods with multiple writes or version-sensitive updates.
          for p in files:
            s=p.read_text(errors='replace')
            for m in re.finditer(r'(?:public|private|protected)\s+(?:static\s+)?function\s+([A-Za-z0-9_]+)\s*\([^)]*\)\s*\{',s):
              nxt=re.search(r'\n\s*(?:public|private|protected)\s+(?:static\s+)?function\s+',s[m.end():]); end=m.end()+(nxt.start() if nxt else min(len(s)-m.end(),10000)); body=s[m.start():end]
              writes=len(re.findall(r'\$wpdb->(?:insert|update|delete|query)\s*\(',body))
              concurrency=any(x in body for x in ('expected_version','FOR UPDATE','GET_LOCK','version=version+1',"'version' =>"))
              if writes>=2 or concurrency or m.group(1)=='transaction':
                print(f'\n## METHOD {p}:{m.group(1)} writes={writes} concurrency={concurrency}\n{body[:5000]}')
                if writes>=2 and not any(x in body for x in ('WCA_Repository::transaction','START TRANSACTION','GET_LOCK','with_appointment_lock','transaction( function')):
                  print('!! MULTI_WRITE_NO_VISIBLE_FENCE')
          # DB mutation calls with a version-bearing row but no obvious CAS condition nearby.
          for p in files:
            lines=p.read_text(errors='replace').splitlines()
            for i,line in enumerate(lines):
              if '$wpdb->update' in line or re.search(r'UPDATE\s+\{\$table\}',line):
                ctx='\n'.join(lines[max(0,i-8):min(len(lines),i+16)])
                if 'version' in ctx and not any(x in ctx for x in ("'version' => absint( $row['version'] )",'AND version=%d','expected_version','record_version','version=version+1')):
                  print(f'\n?? VERSION_WRITE_REVIEW {p}:{i+1}\n{ctx}')
          PY
      - name: Round 7 full regression confirmation
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          php tests/run-all.php
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
