name: File 08 T16 Sequential Round Review
on:
  push:
    branches: [codex/file08-new-governing-plans-completion-2026]
    paths: [.github/workflows/t16-round-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: codex/file08-new-governing-plans-completion-2026, fetch-depth: 0}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Freeze reviewed source identity
        run: |
          echo "REVIEW_HEAD=$(git rev-parse HEAD)"
          echo "PRODUCT_PARENT=$(git rev-parse HEAD^)"
      - name: Round 12 complete review - lifecycle transitions stale state and single review eligibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=list(Path('includes').rglob('*.php'))+[Path('worldwide-clinic.php')]
          pats={
            'transition':r'transition|status|requested|confirmed|declined|reschedul|cancel|check.?in|completed|no.?show',
            'version_cas':r'row_version|expected_version|version_mismatch|stale',
            'slot_hold_release':r'slot_hold|hold_expires|release_appointment_slot|release.*slot',
            'review_eligibility':r'review_eligib|consume_review|grant_review|expires_at',
            'transactions':r'START TRANSACTION|COMMIT|ROLLBACK|transaction\s*\('
          }
          for k,p in pats.items():
            print(k,sum(len(re.findall(p,f.read_text(errors='replace'),re.I)) for f in files))
          focus=('transition','reschedul','checkin','check_in','complete','no_show','cancel','review_eligib','consume_review','release_appointment_slot','row_version','expected_version')
          for f in files:
            lines=f.read_text(errors='replace').splitlines()
            for i,line in enumerate(lines):
              low=line.lower()
              if re.search(r'function\s+\w+',line) and any(x in low for x in focus):
                print(f'\n## FUNCTION {f}:{i+1} {line.strip()}')
                print('\n'.join(lines[i:min(len(lines),i+95)]))
          print('\n## TERMINAL-STATE MUTATION CANDIDATES')
          for f in files:
            lines=f.read_text(errors='replace').splitlines()
            for i,line in enumerate(lines):
              if any(x in line for x in ("'completed'","'declined'","'cancelled'","'no_show'")) and any(x in '\n'.join(lines[max(0,i-8):min(len(lines),i+12)]) for x in ('$wpdb->update','$wpdb->query','transition_appointment','update_post_meta')):
                print(f'{f}:{i+1}: {line.strip()}')
          PY
      - name: Round 12 full regression confirmation
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          php tests/run-all.php
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
