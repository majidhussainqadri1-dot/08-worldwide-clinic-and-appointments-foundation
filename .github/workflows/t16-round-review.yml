name: File 08 T16 Sequential Round Review
on:
  push:
    branches: [codex/file08-new-governing-plans-completion-2026]
    paths: [.github/workflows/t16-round-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: codex/file08-new-governing-plans-completion-2026, fetch-depth: 0}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Freeze reviewed source identity
        run: echo "REVIEW_HEAD=$(git rev-parse HEAD)"
      - name: Round 6 complete review - outbox idempotency recovery dead letter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets=[Path('includes/class-wca-outbox.php'),Path('includes/class-wca-repository.php'),Path('includes/class-wca-ten-review-hardening.php'),Path('includes/class-wca-observability.php')]
          names=('process','maintenance','recover_stale_outbox','claim_outbox','complete_outbox','fail_outbox','enqueue','claim_idempotency','idempotency_status','release_idempotency','complete_idempotency','pre_dispatch','post_dispatch')
          for p in targets:
            s=p.read_text(errors='replace')
            print(f'\n===== {p} =====')
            for fname in names:
              for m in re.finditer(r'(?:public|private|protected)\s+(?:static\s+)?function\s+'+fname+r'\s*\([^)]*\)\s*\{',s):
                nxt=re.search(r'\n\s*(?:public|private|protected)\s+(?:static\s+)?function\s+',s[m.end():]); end=m.end()+(nxt.start() if nxt else min(len(s)-m.end(),12000)); body=s[m.start():end]
                print(f'\n## {p}:{fname}\n{body[:9000]}')
          alltext='\n'.join(p.read_text(errors='replace') for p in targets)
          checks={
            'advisory_lock': 'GET_LOCK' in alltext,
            'release_lock': 'RELEASE_LOCK' in alltext,
            'stable_message_id': 'message_id' in alltext,
            'dead_letter': 'dead_letter' in alltext,
            'retry_backoff': 'pow( 2' in alltext or 'next_attempt_at' in alltext,
            'worker_fencing': 'locked_by' in alltext,
            'stale_recovery': 'recover_stale_outbox' in alltext,
            'idempotency_request_hash': 'request_hash' in alltext,
            'stale_reconciliation': 'reconciliation_required' in alltext,
            'mutation_status': 'mutation-status' in alltext or 'idempotency_status' in alltext,
          }
          print('\nCONTRACT_CHECKS=',checks)
          # Flag DB reads/writes in critical functions when error/result semantics are not visible nearby.
          for p in targets:
            lines=p.read_text(errors='replace').splitlines()
            for i,line in enumerate(lines):
              if re.search(r'\$wpdb->get_(?:results|row|var|col)\s*\(',line):
                ctx='\n'.join(lines[max(0,i-3):min(len(lines),i+12)])
                if any(k in ctx.lower() for k in ('outbox','idempotenc','get_lock','release_lock')) and not any(x in ctx for x in ('last_error','WP_Error','RuntimeException','1 !==','null ===')):
                  print(f'\n!! CRITICAL_READ_REVIEW {p}:{i+1}\n{ctx}')
              if re.search(r'\$wpdb->(?:insert|update|delete|query)\s*\(',line):
                ctx='\n'.join(lines[max(0,i-3):min(len(lines),i+14)])
                if any(k in ctx.lower() for k in ('outbox','idempotenc')) and not any(x in ctx for x in ('false ===','1 ===','1 !==','return ','WP_Error','RuntimeException')):
                  print(f'\n?? CRITICAL_WRITE_REVIEW {p}:{i+1}\n{ctx}')
          PY
      - name: Round 6 full regression confirmation
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          php tests/run-all.php
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
