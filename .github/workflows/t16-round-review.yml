name: File 08 T16 Sequential Round Review
on:
  push:
    branches: [codex/file08-new-governing-plans-completion-2026]
    paths: [.github/workflows/t16-round-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: codex/file08-new-governing-plans-completion-2026, fetch-depth: 0}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Freeze reviewed source identity
        run: echo "REVIEW_HEAD=$(git rev-parse HEAD)"
      - name: Round 3 complete review - authorization IDOR and ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=list(Path('includes').rglob('*.php'))
          routes=[]
          for p in files:
            s=p.read_text(errors='replace')
            for m in re.finditer(r'register_rest_route\s*\(',s):
              chunk=s[m.start():m.start()+2800]
              route=re.search(r"['\"](/[^'\"]+)['\"]",chunk)
              methods=re.search(r"'methods'\s*=>\s*([^,\n]+)",chunk)
              perm=re.search(r"'permission_callback'\s*=>\s*([^,\n]+(?:,[^\n]+)?)",chunk)
              routes.append((str(p),route.group(1) if route else '?',methods.group(1).strip() if methods else '?',perm.group(1).strip() if perm else 'MISSING',chunk[:1300]))
          print(f'T16-R3 REST_ROUTE_COUNT={len(routes)}')
          for r in routes:
            print('\n@@ ROUTE',r[0],r[1],'methods=',r[2],'permission=',r[3])
            if r[3]=='MISSING' or '__return_true' in r[3]: print('!! REVIEW_PERMISSION')
          # Publicly callable REST methods that accept refs/ids: require visible authorization or explicit public projection semantics.
          for p in files:
            s=p.read_text(errors='replace')
            for m in re.finditer(r'public\s+(?:static\s+)?function\s+(rest_[A-Za-z0-9_]+)\s*\(([^)]*)\)\s*\{',s):
              start=m.start(); nxt=re.search(r'\n\s*(?:public|private|protected)\s+(?:static\s+)?function\s+',s[m.end():]); end=m.end()+(nxt.start() if nxt else min(len(s)-m.end(),7000)); body=s[start:end]
              auth_tokens=('can_view_appointment','can_manage_clinic','authorize_','appointment_actor','current_user_can','get_current_user_id','permission','public_','authenticated','claims','owner_user_id','doctor_user_id')
              if not any(t in body for t in auth_tokens):
                print(f'\n!! REST_METHOD_NO_VISIBLE_AUTH {p}:{m.group(1)} args={m.group(2)}\n{body[:1800]}')
          # Direct object fetches from request parameters without nearby authorization are candidates for IDOR review.
          patterns=(r'\$request\[[^\]]+\]',r'get_param\s*\(')
          for p in files:
            lines=p.read_text(errors='replace').splitlines()
            for i,line in enumerate(lines):
              if any(re.search(pt,line) for pt in patterns) and any(x in line.lower() for x in ('ref','id','clinic','appointment','doctor','service','branch')):
                ctx='\n'.join(lines[max(0,i-5):min(len(lines),i+14)])
                if not any(t in ctx for t in ('can_view_appointment','can_manage_clinic','authorize_','permission_callback','appointment_actor','current_user_can','public_','opaque')):
                  print(f'\n?? REQUEST_OBJECT_AUTH_CANDIDATE {p}:{i+1}\n{ctx}')
          PY
      - name: Round 3 full regression confirmation
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          php tests/run-all.php
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
