name: File 08 T16 Sequential Round Review
on:
  push:
    branches: [codex/file08-new-governing-plans-completion-2026]
    paths: [.github/workflows/t16-round-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: codex/file08-new-governing-plans-completion-2026, fetch-depth: 0}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Freeze reviewed source identity
        run: echo "REVIEW_HEAD=$(git rev-parse HEAD)"
      - name: Round 5 complete review - privacy export erasure retention legal hold
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets=[Path('includes/class-wca-privacy.php'),Path('includes/class-swc-privacy.php'),Path('includes/class-wca-continuity-secure.php'),Path('includes/class-wca-continuity.php')]
          for p in targets:
            s=p.read_text(errors='replace')
            print(f'\n===== {p} =====')
            print('exporters=',len(re.findall(r'export',s,re.I)),'erasers=',len(re.findall(r'eras',s,re.I)),'retention=',len(re.findall(r'retention',s,re.I)),'legal_hold=',len(re.findall(r'legal_hold',s,re.I)))
            for token in ('get_results','get_var','get_row','delete(','update(','delete_meta_strict','update_meta_strict','set_transient','delete_transient'):
              for i,line in enumerate(s.splitlines(),1):
                if token in line:
                  lines=s.splitlines(); ctx='\n'.join(lines[max(0,i-4):min(len(lines),i+9)])
                  print(f'\n@@ {p}:{i} {token}\n{ctx[:1800]}')
          # Privacy registrars must coexist without key collision.
          alltext='\n'.join(p.read_text(errors='replace') for p in targets)
          keys=re.findall(r"\$erasers\[['\"]([^'\"]+)['\"]\]",alltext)+re.findall(r"\$exporters\[['\"]([^'\"]+)['\"]\]",alltext)
          print('\nREGISTRY_KEYS=',keys)
          # Search all direct identifiers handled by erasure/export policy.
          identifiers=['patient_user_id','guardian_user_id','doctor_id','proposed_doctor_id','phone','whatsapp','country','city','reason','patient_message','doctor_private_note','consent_at','consent_version','patient_timezone','preferred_at_utc','post_author','actor_user_id','subject_user_id']
          for key in identifiers:
            print(key,'occurrences=',alltext.count(key))
          # Flag privacy SQL reads with no nearby last_error / strict helper / WP_Error.
          for p in targets:
            lines=p.read_text(errors='replace').splitlines()
            for i,line in enumerate(lines):
              if re.search(r'\$wpdb->get_(?:results|row|var|col)\s*\(',line):
                ctx='\n'.join(lines[max(0,i-2):min(len(lines),i+10)])
                if not any(x in ctx for x in ('last_error','WP_Error','audit_rows_strict','related_ids','related_count')):
                  print(f'\n!! PRIVACY_READ_REVIEW {p}:{i+1}\n{ctx}')
          PY
      - name: Round 5 full regression confirmation
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          php tests/run-all.php
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
