name: File 08 T18 R7 Apply Frozen Ledger
on:
  push:
    branches: [review/file08-t18-ten-round-2026-09-06]
    paths: [.github/workflows/t18-r7-apply.yml]
permissions:
  contents: write
jobs:
  apply-fix-regress-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0}
      - name: Freeze pre-fix head
        run: git rev-parse HEAD
      - name: Apply complete frozen R7 ledger
        run: python3 .github/scripts/t18-r7-appointment-lifecycle-correct.py
      - name: R7 dedicated regression
        run: php -d display_errors=1 -d error_reporting=E_ALL tests/t18-r7-appointment-lifecycle-regressions.php
      - name: Full regression
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/t18-r7-lint.txt
          php -d display_errors=1 -d error_reporting=E_ALL tests/run-all.php | tee /tmp/t18-r7-tests.txt
          ! grep -Eq 'PHP (Warning|Notice|Deprecated|Fatal|Parse)|Warning:|Notice:|Deprecated:' /tmp/t18-r7-tests.txt
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
          git diff --check
      - name: Commit corrected exact head
        run: |
          set -euo pipefail
          git config user.name 'Sabri File 08 Review Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add includes/class-wca-appointment-command.php includes/class-wca-plan-guard.php includes/class-swc-appointments.php includes/class-swc-frontend.php tests/run-all.php tests/t18-r7-appointment-lifecycle-regressions.php
          git diff --cached --check
          git commit -m 'fix(file08): close legacy and read-failure appointment bypasses'
          git push origin HEAD:review/file08-t18-ten-round-2026-09-06
          git rev-parse HEAD
      - name: Exact-head post-commit regression
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          php -d display_errors=1 -d error_reporting=E_ALL tests/run-all.php | tee /tmp/t18-r7-exact.txt
          ! grep -Eq 'PHP (Warning|Notice|Deprecated|Fatal|Parse)|Warning:|Notice:|Deprecated:' /tmp/t18-r7-exact.txt
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
