name: File 08 T14 Version Assertion Inventory
on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
      - name: Stale current-version assertions
        shell: bash
        run: |
          set +e
          echo '=== TEST HITS 1.2.13 ==='
          grep -RIn '1\.2\.13' tests --include='*.php' || true
          echo '=== CURRENT DOC HITS 1.2.13 ==='
          grep -RIn '1\.2\.13' README.md STATUS.md readme.txt CHANGELOG.md || true
