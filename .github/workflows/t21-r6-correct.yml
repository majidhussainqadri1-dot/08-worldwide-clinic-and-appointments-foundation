name: T21 R6 correction
on:
  push:
    branches:
      - review/file08-t21-ten-round-2026-09-09
permissions:
  contents: write
jobs:
  correct:
    if: "!contains(github.event.head_commit.message, '[t21-r6-corrected]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file08-t21-ten-round-2026-09-09
          fetch-depth: 0
      - name: Apply frozen R6-D1 correction
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('includes/class-wca-schema.php')
          s = p.read_text()
          new = r'''\t/** Verify a dbDelta CREATE TABLE definition before any schema-version marker is advanced. @return true|WP_Error */
\tpublic static function verify_definition_sql( $sql ) {
\t\tglobal $wpdb;
\t\tif ( ! preg_match( '/CREATE\\s+TABLE\\s+([^\\s(]+)\\s*\\((.*)\\)\\s*[^;]*;?$/is', trim( (string) $sql ), $match ) ) {
\t\t\treturn new WP_Error( 'wca_schema_definition_invalid', __( 'A File 08 schema definition could not be parsed for verification.', 'worldwide-clinic-appointments' ), array( 'status' => 500 ) );
\t\t}
\t\t$table = trim( $match[1], "` \\t\\r\\n" );
\t\t$body  = (string) $match[2];
\t\t$normalize_type = static function ( $type ) {
\t\t\t$type = strtolower( trim( preg_replace( '/\\s+/', ' ', (string) $type ) ) );
\t\t\treturn preg_replace( '/\\b(tinyint|smallint|mediumint|int|integer|bigint)\\(\\d+\\)/', '$1', $type );
\t\t};
\t\t$normalize_default = static function ( $value ) {
\t\t\tif ( null === $value ) { return null; }
\t\t\treturn (string) $value;
\t\t};
\t\t$expected_columns = array();
\t\t$expected_indexes = array();
\t\tforeach ( preg_split( '/\\r?\\n/', $body ) as $line ) {
\t\t\t$line = trim( rtrim( trim( $line ), ',' ) );
\t\t\tif ( preg_match( '/^PRIMARY\\s+KEY\\s*\\(([^)]+)\\)/i', $line, $idx ) ) {
\t\t\t\t$expected_indexes['primary'] = array( 'unique' => true, 'columns' => array_map( static function ( $value ) { return strtolower( trim( $value, "` \\t\\r\\n" ) ); }, explode( ',', $idx[1] ) ) );
\t\t\t\tcontinue;
\t\t\t}
\t\t\tif ( preg_match( '/^(UNIQUE\\s+KEY|KEY)\\s+`?([A-Za-z0-9_]+)`?\\s*\\(([^)]+)\\)/i', $line, $idx ) ) {
\t\t\t\t$expected_indexes[ strtolower( $idx[2] ) ] = array( 'unique' => 0 === stripos( $idx[1], 'UNIQUE' ), 'columns' => array_map( static function ( $value ) { return strtolower( trim( $value, "` \\t\\r\\n" ) ); }, explode( ',', $idx[3] ) ) );
\t\t\t\tcontinue;
\t\t\t}
\t\t\tif ( ! preg_match( '/^`?([A-Za-z0-9_]+)`?\\s+([A-Za-z]+(?:\\([0-9,]+\\))?(?:\\s+unsigned)?)(.*)$/i', $line, $col ) ) { continue; }
\t\t\t$name = strtolower( $col[1] );
\t\t\t$tail = (string) $col[3];
\t\t\t$has_default = (bool) preg_match( '/(?:^|\\s)DEFAULT\\s+(NULL|\'[^\']*\'|"[^"]*"|[^\\s]+)/i', $tail, $default_match );
\t\t\t$default = null;
\t\t\tif ( $has_default ) {
\t\t\t\t$token = trim( $default_match[1] );
\t\t\t\tif ( 0 !== strcasecmp( $token, 'NULL' ) ) { $default = trim( $token, "'\\\"" ); }
\t\t\t}
\t\t\t$expected_columns[ $name ] = array(
\t\t\t\t'type'        => $normalize_type( $col[2] ),
\t\t\t\t'nullable'    => false === stripos( $tail, 'NOT NULL' ),
\t\t\t\t'has_default' => $has_default,
\t\t\t\t'default'     => $default,
\t\t\t\t'extra'       => false !== stripos( $tail, 'AUTO_INCREMENT' ) ? 'auto_increment' : '',
\t\t\t);
\t\t}
\t\t$wpdb->last_error = '';
\t\t$columns_raw = $wpdb->get_results( 'SHOW FULL COLUMNS FROM `' . esc_sql( $table ) . '`', ARRAY_A ); // phpcs:ignore WordPress.DB.PreparedSQL.NotPrepared
\t\tif ( null === $columns_raw || '' !== (string) $wpdb->last_error ) { return new WP_Error( 'wca_schema_columns_read_failed', __( 'File 08 schema columns could not be verified safely.', 'worldwide-clinic-appointments' ), array( 'status' => 503, 'table' => sanitize_text_field( $table ) ) ); }
\t\t$columns = array();
\t\tforeach ( (array) $columns_raw as $row ) { if ( isset( $row['Field'] ) ) { $columns[ strtolower( (string) $row['Field'] ) ] = $row; } }
\t\t$missing_columns = array_values( array_diff( array_keys( $expected_columns ), array_keys( $columns ) ) );
\t\tif ( $missing_columns ) { return new WP_Error( 'wca_schema_columns_missing', __( 'File 08 schema verification found missing columns.', 'worldwide-clinic-appointments' ), array( 'status' => 500, 'table' => sanitize_text_field( $table ), 'columns' => $missing_columns ) ); }
\t\tforeach ( $expected_columns as $name => $expected ) {
\t\t\t$actual = $columns[ $name ];
\t\t\tif ( $expected['type'] !== $normalize_type( $actual['Type'] ?? '' ) ) { return new WP_Error( 'wca_schema_column_type_mismatch', __( 'File 08 schema verification found a column type mismatch.', 'worldwide-clinic-appointments' ), array( 'status' => 500, 'table' => sanitize_text_field( $table ), 'column' => $name ) ); }
\t\t\tif ( $expected['nullable'] !== ( 'YES' === strtoupper( (string) ( $actual['Null'] ?? '' ) ) ) ) { return new WP_Error( 'wca_schema_column_nullability_mismatch', __( 'File 08 schema verification found a column nullability mismatch.', 'worldwide-clinic-appointments' ), array( 'status' => 500, 'table' => sanitize_text_field( $table ), 'column' => $name ) ); }
\t\t\tif ( $expected['has_default'] && $normalize_default( $expected['default'] ) !== $normalize_default( $actual['Default'] ?? null ) ) { return new WP_Error( 'wca_schema_column_default_mismatch', __( 'File 08 schema verification found a column default mismatch.', 'worldwide-clinic-appointments' ), array( 'status' => 500, 'table' => sanitize_text_field( $table ), 'column' => $name ) ); }
\t\t\tif ( $expected['extra'] !== strtolower( trim( (string) ( $actual['Extra'] ?? '' ) ) ) ) { return new WP_Error( 'wca_schema_column_extra_mismatch', __( 'File 08 schema verification found a column extra-attribute mismatch.', 'worldwide-clinic-appointments' ), array( 'status' => 500, 'table' => sanitize_text_field( $table ), 'column' => $name ) ); }
\t\t}
\t\t$wpdb->last_error = '';
\t\t$indexes_raw = $wpdb->get_results( 'SHOW INDEX FROM `' . esc_sql( $table ) . '`', ARRAY_A ); // phpcs:ignore WordPress.DB.PreparedSQL.NotPrepared
\t\tif ( null === $indexes_raw || '' !== (string) $wpdb->last_error ) { return new WP_Error( 'wca_schema_indexes_read_failed', __( 'File 08 schema indexes could not be verified safely.', 'worldwide-clinic-appointments' ), array( 'status' => 503, 'table' => sanitize_text_field( $table ) ) ); }
\t\t$indexes = array();
\t\tforeach ( (array) $indexes_raw as $row ) {
\t\t\tif ( ! isset( $row['Key_name'], $row['Column_name'], $row['Seq_in_index'], $row['Non_unique'] ) ) { continue; }
\t\t\t$name = strtolower( (string) $row['Key_name'] );
\t\t\tif ( ! isset( $indexes[ $name ] ) ) { $indexes[ $name ] = array( 'unique' => 0 === (int) $row['Non_unique'], 'columns' => array() ); }
\t\t\t$column = strtolower( (string) $row['Column_name'] );
\t\t\tif ( ! empty( $row['Sub_part'] ) ) { $column .= '(' . (int) $row['Sub_part'] . ')'; }
\t\t\t$indexes[ $name ]['columns'][ (int) $row['Seq_in_index'] ] = $column;
\t\t}
\t\tforeach ( $indexes as &$index ) { ksort( $index['columns'], SORT_NUMERIC ); $index['columns'] = array_values( $index['columns'] ); } unset( $index );
\t\t$missing_indexes = array_values( array_diff( array_keys( $expected_indexes ), array_keys( $indexes ) ) );
\t\tif ( $missing_indexes ) { return new WP_Error( 'wca_schema_indexes_missing', __( 'File 08 schema verification found missing indexes.', 'worldwide-clinic-appointments' ), array( 'status' => 500, 'table' => sanitize_text_field( $table ), 'indexes' => $missing_indexes ) ); }
\t\tforeach ( $expected_indexes as $name => $expected ) {
\t\t\tif ( $expected['unique'] !== $indexes[ $name ]['unique'] ) { return new WP_Error( 'wca_schema_index_uniqueness_mismatch', __( 'File 08 schema verification found an index uniqueness mismatch.', 'worldwide-clinic-appointments' ), array( 'status' => 500, 'table' => sanitize_text_field( $table ), 'index' => $name ) ); }
\t\t\tif ( $expected['columns'] !== $indexes[ $name ]['columns'] ) { return new WP_Error( 'wca_schema_index_columns_mismatch', __( 'File 08 schema verification found an index column-order mismatch.', 'worldwide-clinic-appointments' ), array( 'status' => 500, 'table' => sanitize_text_field( $table ), 'index' => $name ) ); }
\t\t}
\t\treturn true;
\t}
'''
          pat = re.compile(r'\t/\*\* Verify a dbDelta CREATE TABLE definition before any schema-version marker is advanced\. @return true\|WP_Error \*/\n\tpublic static function verify_definition_sql\( \$sql \) \{.*?\n\t\}\n\n\tpublic static function maybe_upgrade', re.S)
          m = pat.search(s)
          if not m:
              raise SystemExit('R6 correction target not found')
          s = s[:m.start()] + new + '\n\tpublic static function maybe_upgrade' + s[m.end():]
          p.write_text(s)
      - name: Verify correction before commit
        run: |
          php -l includes/class-wca-schema.php
          php tests/t21-r6-schema-definition-regressions.php
      - name: Remove temporary correction workflow and commit
        run: |
          git rm .github/workflows/t21-r6-correct.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add includes/class-wca-schema.php tests/t21-r6-schema-definition-regressions.php tests/run-all.php
          git commit -m "T21 R6: structurally verify schema definitions [t21-r6-corrected]"
          git push origin HEAD:review/file08-t21-ten-round-2026-09-09
