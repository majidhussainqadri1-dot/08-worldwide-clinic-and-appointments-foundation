name: File 08 Tenth Review R10 Closure Retry

on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
    paths:
      - '.github/workflows/file08-tenth-ten-review.yml'

permissions:
  contents: write

jobs:
  r10-close:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact R9-corrected branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip
      - name: Apply T10-R10 release identity and permanent regression evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tenth-r10-close.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text()
          old='## 1.2.10 — 2026-08-12'
          new='## 1.2.10 — 2026-08-11'
          if old not in s:
              raise SystemExit('T10 changelog date correction anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Full corrected T10-R10 QA
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          php tests/run-all.php
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
          test -z "$(find . -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '*.p12' \) -print -quit)"
          test -z "$(find . -type l -print -quit)"
          test ! -e .gitmodules
          ! grep -RInE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' --exclude-dir=.git .
      - name: Remove transient T10 tooling and re-run exact final QA
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/file08-tenth-ten-review.yml tools/tenth-review-patches.tgz.b64 tools/tenth-r10-close.py
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/dev/null
          php tests/run-all.php
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
          test -z "$(find . -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '*.p12' -o -name '*.b64' \) -print -quit)"
          test -z "$(find . -type l -print -quit)"
          test ! -e .gitmodules
          ! grep -RInE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' --exclude-dir=.git .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'File 08 T10-R10: close tenth review as v1.2.10 candidate'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
