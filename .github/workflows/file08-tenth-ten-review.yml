name: File 08 Tenth Fresh Ten-Round Sequential Review

on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
    paths:
      - '.github/workflows/file08-tenth-ten-review.yml'

permissions:
  contents: write

jobs:
  review-fix-retest:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact v1.2.9 review branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip
      - name: Decode T10 review patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/f08-t10
          base64 -d tools/tenth-review-patches.tgz.b64 > /tmp/f08-t10/patches.tgz
          tar -xzf /tmp/f08-t10/patches.tgz -C /tmp/f08-t10
          for n in $(seq 1 9); do test -s "/tmp/f08-t10/r${n}.patch"; done
      - name: T10-R1 through T10-R9 sequential correction and full retest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          qa() {
            find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/dev/null
            php tests/run-all.php
            node --check assets/js/clinic.js
            node --check assets/js/continuity.js
            node --check assets/js/future24.js
            test -z "$(find . -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '*.p12' \) -print -quit)"
            test -z "$(find . -type l -print -quit)"
            test ! -e .gitmodules
            ! grep -RInE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' --exclude-dir=.git .
          }
          messages=(
            'make appointment request state and evidence atomic'
            'make clinic lifecycle state and event/outbox atomic'
            'make branch creation canonical timezone-valid and atomic'
            'make service mutation event/outbox atomic'
            'validate availability windows and make event/outbox atomic'
            'make complaint state event and projections atomic'
            'make payment intent outbox and replay finalization atomic'
            'fail closed on HTTP replay finalization and add status query'
            'add opaque cursor pagination and conditional clinic caching'
          )
          for n in $(seq 1 9); do
            echo "===== T10-R${n}: apply supported correction ====="
            git apply --check "/tmp/f08-t10/r${n}.patch"
            git apply "/tmp/f08-t10/r${n}.patch"
            echo "===== T10-R${n}: full corrected-state QA before next review ====="
            qa
            git add includes
            git commit -m "File 08 T10-R${n}: ${messages[$((n-1))]}"
            git push origin HEAD:codex/file08-new-governing-plans-completion-2026
          done
      - name: T10-R10 release identity docs and permanent regression gate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tenth-r10-close.py
      - name: T10-R10 full corrected-state QA
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          php tests/run-all.php
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
          test -z "$(find . -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '*.p12' \) -print -quit)"
          test -z "$(find . -type l -print -quit)"
          test ! -e .gitmodules
          ! grep -RInE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' --exclude-dir=.git .
      - name: Remove transient T10 tooling re-test and publish final candidate source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/file08-tenth-ten-review.yml tools/tenth-review-patches.tgz.b64 tools/tenth-r10-close.py
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/dev/null
          php tests/run-all.php
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
          test -z "$(find . -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '*.p12' -o -name '*.b64' \) -print -quit)"
          test -z "$(find . -type l -print -quit)"
          test ! -e .gitmodules
          ! grep -RInE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' --exclude-dir=.git .
          git add -A
          git commit -m 'File 08 T10-R10: close tenth review as v1.2.10 candidate'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
