name: File 08 T13 Release Closure
on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
permissions:
  contents: write
jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip
      - name: Advance release identity and permanent evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Runtime identity.
          for f in [Path('worldwide-clinic.php'), Path('includes/class-wca-contracts.php')]:
              s=f.read_text()
              if '1.2.12' not in s:
                  raise SystemExit(f'missing 1.2.12 in {f}')
              f.write_text(s.replace('1.2.12','1.2.13'))

          # All current-version regression contracts intentionally follow the release candidate.
          for f in Path('tests').glob('*.php'):
              s=f.read_text()
              if '1.2.12' in s:
                  f.write_text(s.replace('1.2.12','1.2.13'))

          # Public release docs: update only current-candidate statements; preserve historical release records.
          f=Path('README.md'); s=f.read_text();
          s=s.replace('Runtime candidate: **1.2.12**','Runtime candidate: **1.2.13**',1)
          marker='## Thirteenth fresh 20-round corrective review\n'
          if marker not in s:
              s += '\n\n'+marker+'\nFresh sequential review of the exact v1.2.12 source corrected 20 supported repository defects/gaps before advancing each round. Post-final corrective sweeps then hardened legacy mutation durability and destructive purge failure semantics; two fresh post-coding source reviews completed without a new supported defect. Runtime 1.2.13 keeps core schema 3.2.0, continuity 1.1.0 and Future24 1.0.0. Staging/live acceptance remains separate.\n'
          f.write_text(s)

          f=Path('STATUS.md'); s=f.read_text();
          s=s.replace('Runtime candidate: **1.2.12**','Runtime candidate: **1.2.13**',1)
          marker='## Thirteenth fresh 20-round corrected-state closure\n'
          if marker not in s:
              s += '\n\n'+marker+'\n- Main review rounds: T13-R01 through T13-R20; all 20 contained a supported repository defect/gap and were corrected sequentially.\n- Post-final corrective sweeps: legacy mutation persistence, repair/purge failure visibility, and canonical purge fail-closed semantics corrected.\n- Two fresh post-coding source reviews: PASS / PASS, no new supported defect.\n- Runtime: 1.2.13; core schema 3.2.0; continuity 1.1.0; Future24 1.0.0.\n- Staging-Accepted: false; Live-Deployed: unverified; Operational: not claimed.\n'
          f.write_text(s)

          f=Path('readme.txt'); s=f.read_text()
          s=s.replace('Stable tag: 1.2.12','Stable tag: 1.2.13',1)
          s=s.replace('Version 1.2.12 implements','Version 1.2.13 implements',1)
          s=s.replace('File 08 v1.2.12 candidate','File 08 v1.2.13 candidate',1)
          # Keep the historical = 1.2.12 = changelog section intact; prepend current section.
          anchor='== Changelog ==\n'
          current='== Changelog ==\n\n= 1.2.13 =\n* Thirteenth fresh 20-round sequential corrective review: strict authoritative persistence, fail-closed privacy/retention/maintenance, canonical Future24 audit atomicity, payment/review expiry validation, legacy mutation durability, and destructive purge failure semantics.\n* Runtime 1.2.13; core schema 3.2.0; continuity 1.1.0; Future24 1.0.0. Repository/CI/package evidence remains distinct from staging/live evidence.\n'
          if '= 1.2.13 =' not in s:
              s=s.replace(anchor,current,1)
          f.write_text(s)

          f=Path('CHANGELOG.md'); s=f.read_text()
          entry='## 1.2.13 — 2026-08-11\n\n- Completed the thirteenth fresh sequential 20-round review/fix/retest cycle from exact v1.2.12 source.\n- Hardened appointment authoritative meta persistence, reschedule slot release, check-in/completion/status/version writes, Future24 record/audit atomicity, maintenance failure propagation, privacy export/erasure, retention cleanup, payment/review validation and capacity validation.\n- Post-final corrective sweeps hardened legacy mutation persistence plus repair and destructive purge failure semantics.\n- Two fresh post-coding source reviews completed without a new supported defect.\n- Runtime advanced to 1.2.13 with no schema inflation: core 3.2.0, continuity 1.1.0, Future24 1.0.0.\n\n'
          if not s.startswith('#'):
              raise SystemExit('unexpected changelog')
          if '## 1.2.13 — 2026-08-11' not in s:
              pos=s.find('\n')+1
              s=s[:pos]+'\n'+entry+s[pos:]
          f.write_text(s)
          PY

          cat > THIRTEENTH-TWENTY-REVIEW-EVIDENCE.md <<'EOF'
          # File 08 — Thirteenth Fresh Sequential 20-Round Review Evidence

          - Frozen repository baseline: `5fac49527b26655ca4da64660a81da6c1a0a5b72` (runtime 1.2.12).
          - Governing method: review → correct supported defect → corrected-state retest → only then next product round.
          - Repository/source evidence only; staging/live acceptance remains separate.

          | Round | Result | Finding / correction |
          |---|---|---|
          | T13-R01 | DEFECT CORRECTED | Appointment request authoritative post-meta writes could partially fail without aborting the owner transaction; strict persistence/readback added. |
          | T13-R02 | DEFECT CORRECTED | Reschedule proposal meta writes were unchecked; all proposal fields now fail closed. |
          | T13-R03 | DEFECT CORRECTED | Accepted reschedule ignored failure releasing the previous slot; release failure now aborts. |
          | T13-R04 | DEFECT CORRECTED | Accepted reschedule canonical meta writes and proposal cleanup were unchecked; strict writes/deletes added. |
          | T13-R05 | DEFECT CORRECTED | Check-in/completion authoritative meta writes were unchecked; strict persistence added. |
          | T13-R06 | DEFECT CORRECTED | Terminal slot release and final status/reason/version persistence could fail silently; fail-closed slot release plus strict state/version writes added. |
          | T13-R07 | DEFECT CORRECTED | Future24 user record creation used compensating deletion after governance-audit failure and could leave unaudited state if compensation failed; record + audit are now one transaction. |
          | T13-R08 | DEFECT CORRECTED | Future24 system record creation had the same audit atomicity gap; corrected transactionally. |
          | T13-R09 | DEFECT CORRECTED | Future24 maintenance expiry mutation failures were ignored; explicit error/metric/log propagation added. |
          | T13-R10 | DEFECT CORRECTED | Outbox maintenance swallowed slot-hold/retention maintenance failures; maintenance now reports incomplete operations fail closed. |
          | T13-R11 | DEFECT CORRECTED | Manual admin maintenance always advertised success; failure is now surfaced and logged. |
          | T13-R12 | DEFECT CORRECTED | Privacy export could turn SQL/decrypt/count failures into empty/successful export pages; failures now abort explicitly. |
          | T13-R13 | DEFECT CORRECTED | Canonical appointment privacy erasure advanced cursors across unchecked mutation failures; strict mutations and retry-on-same-row semantics added. |
          | T13-R14 | DEFECT CORRECTED | Future24 erasure could treat failed/zero updates as removal and skip records; authoritative readback and retry semantics added. |
          | T13-R15 | DEFECT CORRECTED | Secure continuity erasure could skip failed deletes/guardian anonymization; fail-closed cursor/readback behavior added. |
          | T13-R16 | DEFECT CORRECTED | Active continuity guard/replacement eraser had the same skip/failure gap; corrected. |
          | T13-R17 | DEFECT CORRECTED | Legacy privacy erasure used unchecked partial mutations that could remove retry selectors before later failure; per-appointment transaction + strict persistence added. |
          | T13-R18 | DEFECT CORRECTED | Core/Future24/continuity retention cleanup could ignore deletion failures or advance cursors; errors now propagate and cursors advance only after verified success/hold. |
          | T13-R19 | DEFECT CORRECTED | Payment amount could turn negative input positive through `absint`, and expired review-eligibility revocation failure was ignored; strict amount/currency validation and fail-closed revocation added. |
          | T13-R20 | DEFECT CORRECTED | Generic Future24 capacity writers silently clamped caller input; strict capacity validation now rejects invalid/out-of-contract values. |

          All 20 main review rounds contained a supported repository defect/gap and each was corrected before the next round.

          ## Post-final corrective sweeps
          After the 20 main rounds, fresh corrected-state sweeps found and corrected additional source defects without counting them as extra product rounds: unchecked legacy/admin appointment mutation persistence, doctor-suspension authority-hold persistence, false-success repair/purge paths, and canonical destructive purge table/option failure handling.

          Because those corrections changed source after the main cycle, the required two fresh post-coding reviews were restarted. Final fresh review 1: PASS with no new supported defect. Final fresh review 2: PASS with no new supported defect.

          ## Release identity
          Runtime/test/document identity advances to `1.2.13` without schema inflation. Core schema remains `3.2.0`; restricted continuity remains `1.1.0`; Future24 remains `1.0.0`.

          Exact final HEAD, canonical CI and package evidence are recorded in PR/release metadata after this closure commit so this source record does not create a self-referential commit hash.
          EOF

          cat > tests/thirteenth-twenty-review-regressions.php <<'EOF'
          <?php
          $root = dirname(__DIR__); $pass=0; $fail=array();
          function t13_has($label,$path,$needle){ global $root,$pass,$fail; $s=file_get_contents($root.'/'.$path); if(is_string($s)&&false!==strpos($s,$needle)){echo 'PASS '.(++$pass).': '.$label."\n";}else{$fail[]=$label.' missing: '.$needle;} }
          t13_has('R1 appointment meta persistence','includes/class-wca-service.php','wca_appointment_meta_write');
          t13_has('R2 reschedule proposal persistence','includes/class-wca-service.php','wca_reschedule_proposal_write');
          t13_has('R3 previous slot release failure','includes/class-wca-service.php','wca_reschedule_old_slot_release');
          t13_has('R4 accepted reschedule persistence','includes/class-wca-service.php','wca_reschedule_accept_write');
          t13_has('R5 checkin persistence','includes/class-wca-service.php','wca_checkin_write');
          t13_has('R5 completion persistence','includes/class-wca-service.php','wca_completion_write');
          t13_has('R6 terminal slot release failure','includes/class-wca-service.php','wca_terminal_slot_release');
          t13_has('R6 strict version bump','includes/class-swc-helpers.php','bump_version_strict');
          t13_has('R7 Future24 user record transaction','includes/class-wca-future24.php','wca_future24_record_transaction');
          t13_has('R8 Future24 system record transaction','includes/class-wca-future24.php','wca_future24_system_record_transaction');
          t13_has('R9 Future24 maintenance failure metric','includes/class-wca-future24.php','future24_maintenance_failure_total');
          t13_has('R10 maintenance failure propagation','includes/class-wca-outbox.php','wca_maintenance_incomplete');
          t13_has('R11 admin maintenance failure visibility','includes/class-wca-admin.php','manual_maintenance_failed');
          t13_has('R12 Future24 export query failure','includes/class-wca-privacy.php','wca_privacy_export_future24_query');
          t13_has('R12 continuity decrypt failure','includes/class-wca-continuity-secure.php','wca_continuity_export_intake_decrypt');
          t13_has('R13 appointment author erasure failure','includes/class-wca-privacy.php','wca_privacy_author_anonymize');
          t13_has('R14 Future24 erasure retry evidence','includes/class-wca-privacy.php','Future24 privacy erasure encountered');
          t13_has('R15 continuity guardian erasure','includes/class-wca-continuity-secure.php','Guardian continuity references could not be anonymized safely');
          t13_has('R16 guard guardian erasure','includes/class-wca-continuity-guards.php','Guardian continuity references could not be anonymized safely');
          t13_has('R17 legacy erasure transaction','includes/class-swc-privacy.php','swc_privacy_erase_transaction');
          t13_has('R18 Future24 retention failure','includes/class-wca-privacy.php','wca_retention_future24');
          t13_has('R18 intake retention failure','includes/class-wca-continuity-secure.php','wca_intake_retention_delete');
          t13_has('R19 payment amount strict validation','includes/class-wca-repository.php','wca_payment_amount_invalid');
          t13_has('R19 expired review persistence','includes/class-wca-repository.php','wca_review_expiry_persist');
          t13_has('R20 strict Future24 capacity','includes/class-wca-future24.php','strict_capacity');
          t13_has('post-final legacy mutation durability','includes/class-swc-helpers.php','apply_meta_mutations');
          t13_has('post-final legacy purge failure','includes/class-swc-activator.php','swc_purge_usermeta');
          t13_has('post-final canonical purge failure','includes/class-wca-schema.php','wca_purge_table_failed');
          t13_has('release plugin 1.2.13','worldwide-clinic.php','Version: 1.2.13');
          t13_has('release runtime constant 1.2.13','includes/class-wca-contracts.php',"RUNTIME_VERSION                 = '1.2.13'");
          t13_has('evidence main 20 complete','THIRTEENTH-TWENTY-REVIEW-EVIDENCE.md','All 20 main review rounds contained a supported repository defect/gap');
          if($fail){fwrite(STDERR,"File 08 thirteenth twenty-round regression gate failed:\n- ".implode("\n- ",$fail)."\n"); exit(1);} echo 'File 08 thirteenth fresh twenty-round regression assertions passed: '.$pass.'/'.$pass."\n";
          EOF

          python3 - <<'PY'
          from pathlib import Path
          f=Path('tests/run-all.php'); s=f.read_text()
          old="'twelfth-twenty-review-regressions.php' );"
          new="'twelfth-twenty-review-regressions.php', 'thirteenth-twenty-review-regressions.php' );"
          if old not in s:
              raise SystemExit('run-all anchor missing')
          f.write_text(s.replace(old,new,1))
          PY
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Complete source QA
        run: php tests/run-all.php
      - name: JavaScript syntax
        run: |
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find . -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '*.p12' -o -name '*.b64' \) -print -quit)"
          test -z "$(find . -type l -print -quit)"
          test ! -e .gitmodules
          ! grep -RInE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' --exclude-dir=.git .
      - name: Commit final release closure and remove transient inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/t13-release.yml .github/workflows/t13-inventory.yml
          git add -A
          git commit -m "File 08: close thirteenth 20-round review as v1.2.13"
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
