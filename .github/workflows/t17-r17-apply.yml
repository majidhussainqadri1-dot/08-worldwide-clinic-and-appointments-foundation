name: File 08 T17 R17 Apply Frozen Privacy Continuity Ledger
on:
  push:
    branches:
      - tmp-file08-r17-privacy-continuity-20260830
    paths:
      - .github/workflows/t17-r17-apply.yml
permissions:
  contents: write
jobs:
  apply-correct-retest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Freeze reviewed head
        run: git rev-parse HEAD
      - name: Apply complete frozen R17 defect ledger
        run: python3 .github/scripts/t17-r17-privacy-continuity-correct.py
      - name: Repair generated R17 regression harness and historical schema assertion
        run: |
          cat > tests/seventeenth-r17-privacy-continuity-regressions.php <<'PHP'
          <?php
          $root = dirname(__DIR__);
          $continuity = file_get_contents($root . '/includes/class-wca-continuity-secure.php');
          $guards = file_get_contents($root . '/includes/class-wca-continuity-guards.php');
          $future = file_get_contents($root . '/includes/class-wca-future24.php');
          if (!is_string($continuity) || !is_string($guards) || !is_string($future)) { fwrite(STDERR, "R17 source read failed\n"); exit(1); }
          $checks = array(
              'intake consent before persistence' => strpos($continuity, 'appointment_processing') !== false && strpos($continuity, 'before pre-visit information is stored') !== false,
              'canonical intake version required' => strpos($continuity, 'wca_intake_version_required') !== false && strpos($continuity, 'if ( ! $expected_version )') !== false,
              'processing consent controllable' => strpos($continuity, "array( 'appointment_processing', 'teleconsult'") !== false && strpos($guards, "array( 'appointment_processing', 'teleconsult'") !== false,
              'future24 schema migration bumped' => strpos($future, "const SCHEMA_VERSION   = '1.1.0';") !== false,
              'episode privacy subject persisted' => strpos($future, 'subject_user_id') !== false && strpos($future, 'patient_id') !== false,
              'legacy episode subject backfill' => strpos($future, "feature_id='F08-FUT-23' AND subject_user_id=0") !== false,
              'episode unlink route' => strpos($future, '/future24/episodes/(?P<ref>[0-9a-fA-F-]{36})/unlink') !== false,
              'episode archive route' => strpos($future, '/future24/episodes/(?P<ref>[0-9a-fA-F-]{36})/archive') !== false,
              'episode mutation optimistic concurrency' => strpos($future, 'wca_episode_version_required') !== false && strpos($future, 'wca_episode_stale') !== false,
              'fhir adapter degraded toggle' => strpos($future, 'wca_fhir_adapter_enabled') !== false && strpos($future, 'wca_fhir_adapter_disabled') !== false,
              'fhir appointment version metadata' => strpos($future, 'versionId') !== false && strpos($future, 'lastUpdated') !== false && strpos($future, '$record_version') !== false,
              'fhir clinic version metadata' => strpos($future, 'record_version') !== false && strpos($future, 'fhir-healthcare-service') !== false,
          );
          foreach ($checks as $name => $ok) { if (!$ok) { fwrite(STDERR, "R17 FAIL: {$name}\n"); exit(1); } }
          echo "R17 privacy/continuity/interoperability regressions: PASS\n";
          PHP
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/third-ten-review-regressions.php')
          s = p.read_text()
          old = "t310has('future schema unchanged',$future,\"const SCHEMA_VERSION   = '1.0.0'\");"
          new = "t310has('future schema migrated for R17 privacy lifecycle',$future,\"const SCHEMA_VERSION   = '1.1.0'\");"
          if s.count(old) != 1:
              raise SystemExit('R17 historical Future24 schema assertion anchor is not unique')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Exact R17 regression gate
        run: php -d display_errors=1 -d error_reporting=E_ALL tests/seventeenth-r17-privacy-continuity-regressions.php
      - name: Full source regression gate
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/r17-php-lint.txt
          php -d display_errors=1 -d error_reporting=E_ALL tests/run-all.php | tee /tmp/r17-tests.txt
          ! grep -Eq 'PHP (Warning|Notice|Deprecated|Fatal|Parse)|Warning:|Notice:|Deprecated:' /tmp/r17-tests.txt
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
      - name: Commit only after full retest passes
        run: |
          set -euo pipefail
          git config user.name 'Sabri File 08 Review Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add includes/class-wca-continuity-secure.php includes/class-wca-continuity-guards.php includes/class-wca-future24.php tests/run-all.php tests/third-ten-review-regressions.php tests/seventeenth-r17-privacy-continuity-regressions.php
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No R17 correction diff found.' >&2
            exit 1
          fi
          git commit -m 'fix(file08): close R17 privacy continuity interoperability gaps'
          git push origin HEAD:tmp-file08-r17-privacy-continuity-20260830
          git rev-parse HEAD
