name: File 08 T21 R3 Frozen Ledger Correction
on:
  push:
    branches: [review/file08-t21-ten-round-2026-09-09]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file08-t21-ten-round-2026-09-09
      - name: Apply frozen R3 correction
        shell: python
        run: |
          from pathlib import Path
          p = Path('includes/class-wca-service.php')
          text = p.read_text()
          old = """\t\tif ( is_wp_error( $result ) ) {\n\t\t\tWCA_Repository::release_idempotency( $claim['id'] );\n\t\t\tif ( $created_appointment_id ) { clean_post_cache( $created_appointment_id ); }\n\t\t\treturn $result;\n\t\t}\n\t\tWCA_Observability::metric( 'appointment_requested_total', 1, array( 'mode' => $service['consultation_type'] ?? 'unknown' ) );\n"""
          new = """\t\tif ( is_wp_error( $result ) ) {\n\t\t\t$error_data = $result->get_error_data();\n\t\t\t$state_uncertain = is_array( $error_data ) && ! empty( $error_data['state_uncertain'] );\n\t\t\tif ( ! $state_uncertain ) {\n\t\t\t\tWCA_Repository::release_idempotency( $claim['id'] );\n\t\t\t} else {\n\t\t\t\tWCA_Observability::metric( 'appointment_request_uncertain_idempotency_retained_total', 1 );\n\t\t\t\tWCA_Observability::log( 'error', 'appointment_request_transaction_state_uncertain', array( 'idempotency_reservation_id' => absint( $claim['id'] ) ) );\n\t\t\t}\n\t\t\tif ( $created_appointment_id ) { clean_post_cache( $created_appointment_id ); }\n\t\t\treturn $result;\n\t\t}\n\t\tWCA_Observability::metric( 'appointment_requested_total', 1, array( 'mode' => $service['consultation_type'] ?? 'unknown' ) );\n"""
          if old not in text:
              raise SystemExit('R3 appointment error target not found')
          p.write_text(text.replace(old,new,1))

          t = Path('tests/t21-r3-uncertain-idempotency-regressions.php')
          t.write_text(r'''<?php
          $root = dirname(__DIR__);
          $service = file_get_contents($root . '/includes/class-wca-service.php');
          $fail = static function($m){ fwrite(STDERR, "T21 R3 regression failed: {$m}\n"); exit(1); };
          if (strpos($service, 'state_uncertain') === false) $fail('uncertain transaction state is not detected');
          if (strpos($service, 'if ( ! $state_uncertain ) {') === false) $fail('idempotency release is not conditioned on verified rollback state');
          if (strpos($service, 'appointment_request_uncertain_idempotency_retained_total') === false) $fail('uncertain-state retention observability is missing');
          if (strpos($service, 'appointment_request_transaction_state_uncertain') === false) $fail('uncertain-state diagnostic log is missing');
          if (!preg_match('~if\s*\(\s*!\s*\$state_uncertain\s*\)\s*\{\s*WCA_Repository::release_idempotency\s*\(\s*\$claim\[\'id\'\]\s*\)~s', $service)) $fail('release is not guarded by state certainty');
          echo "T21 R3 uncertain-idempotency regressions passed.\n";
          ''')

          r = Path('tests/run-all.php')
          text = r.read_text()
          needle = "'t21-r2-complaint-authorization-regressions.php' );"
          repl = "'t21-r2-complaint-authorization-regressions.php', 't21-r3-uncertain-idempotency-regressions.php' );"
          if needle not in text:
              raise SystemExit('run-all R3 target missing')
          r.write_text(text.replace(needle,repl,1))
      - name: Targeted regression
        run: php tests/t21-r3-uncertain-idempotency-regressions.php
      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add includes/class-wca-service.php tests/t21-r3-uncertain-idempotency-regressions.php tests/run-all.php
          git commit -m "fix(file08): retain idempotency evidence on uncertain appointment rollback"
          git push origin HEAD:review/file08-t21-ten-round-2026-09-09
