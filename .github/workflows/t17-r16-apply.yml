name: File 08 T17 R16 Apply Frozen Finance Schema Ledger
on:
  push:
    branches:
      - tmp-file08-r16-safeapply-20260830b
    paths:
      - .github/workflows/t17-r16-apply.yml
permissions:
  contents: write
jobs:
  apply-correct-retest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Freeze reviewed head
        run: git rev-parse HEAD
      - name: Apply complete frozen R16 defect ledger
        run: python3 .github/scripts/t17-r16-finance-schema-correct.py
      - name: Update current-schema regression assertions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old = "SCHEMA_VERSION                  = '3.3.0'"
          new = "SCHEMA_VERSION                  = '3.4.0'"
          changed = 0
          for p in Path('tests').glob('*.php'):
              s = p.read_text()
              if old in s:
                  p.write_text(s.replace(old, new))
                  changed += 1
          print(f'updated schema assertions in {changed} test files')
          PY
      - name: Exact R16 regression gate
        run: php -d display_errors=1 -d error_reporting=E_ALL tests/seventeenth-r16-finance-schema-reconciliation-regressions.php
      - name: Full source regression gate
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/r16-php-lint.txt
          php -d display_errors=1 -d error_reporting=E_ALL tests/run-all.php | tee /tmp/r16-tests.txt
          ! grep -Eq 'PHP (Warning|Notice|Deprecated|Fatal|Parse)|Warning:|Notice:|Deprecated:' /tmp/r16-tests.txt
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
      - name: Commit only after full retest passes
        run: |
          set -euo pipefail
          git config user.name 'Sabri File 08 Review Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add includes/class-wca-contracts.php includes/class-wca-schema.php includes/class-wca-repository.php includes/class-wca-service.php tests/
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No R16 correction diff found.' >&2
            exit 1
          fi
          git commit -m 'fix(file08): make slot schema exact and order CF03 payment projections'
          git push origin HEAD:tmp-file08-r16-safeapply-20260830b
          git rev-parse HEAD
