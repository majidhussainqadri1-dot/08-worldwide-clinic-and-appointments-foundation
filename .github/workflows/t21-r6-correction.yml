name: T21 R6 temporary correction

on:
  push:
    branches:
      - review/file08-t21-ten-round-2026-09-09

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/file08-t21-ten-round-2026-09-09
          fetch-depth: 0
      - name: Apply frozen R6 correction
        run: python3 tools/t21-r6-correct.py
      - name: Preserve unsigned type modifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('includes/class-wca-schema.php')
          s = p.read_text(encoding='utf-8')
          old = "\t\t\t\t'type'        => self::normalize_schema_type( $col[2] ),"
          new = "\t\t\t\t'type'        => self::normalize_schema_type( $col[2] . ( preg_match( '/^\\s*unsigned\\b/i', $tail ) ? ' unsigned' : '' ) ),"
          if old not in s:
              if new not in s:
                  raise SystemExit('unsigned type patch anchor missing')
          else:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Run permanent R6 regression
        run: php tests/t21-r6-schema-definition-regressions.php
      - name: Commit correction when needed
        run: |
          if git diff --quiet; then
            echo "No correction diff remains."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add includes/class-wca-schema.php
          git commit -m "T21 R6: verify full schema structure before version advance"
          git push origin HEAD:review/file08-t21-ten-round-2026-09-09
