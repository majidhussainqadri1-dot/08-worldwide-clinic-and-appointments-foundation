name: F08 Third Review R5 Fix

on:
  push:
    branches: [codex/file08-new-governing-plans-completion-2026]
    paths: [.github/workflows/f08-fixer-probe.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0
      - name: No-store every protected mutation response
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('includes/class-wca-rest.php')
          s=p.read_text()
          old="""\tpublic static function security_headers( $response, $server, $request ) {
\t\t$route = $request instanceof WP_REST_Request ? $request->get_route() : '';
\t\tif ( 0 === strpos( $route, '/' . self::NAMESPACE ) ) {
\t\t\t$response->header( 'X-Content-Type-Options', 'nosniff' );
\t\t\t$response->header( 'Referrer-Policy', 'strict-origin-when-cross-origin' );
\t\t\t$response->header( 'Permissions-Policy', 'camera=(), microphone=(), geolocation=()' );
\t\t\tif ( false !== strpos( $route, '/appointments' ) || false !== strpos( $route, '/slot-holds' ) || false !== strpos( $route, '/complaints' ) || false !== strpos( $route, '/health' ) ) {
\t\t\t\t$response->header( 'Cache-Control', 'private, no-store, max-age=0' );
\t\t\t\t$response->header( 'X-Robots-Tag', 'noindex, nofollow, noarchive' );
\t\t\t}
\t\t}
\t\treturn $response;
\t}
"""
          new="""\tpublic static function security_headers( $response, $server, $request ) {
\t\t$route  = $request instanceof WP_REST_Request ? $request->get_route() : '';
\t\t$method = $request instanceof WP_REST_Request ? strtoupper( (string) $request->get_method() ) : '';
\t\tif ( 0 === strpos( $route, '/' . self::NAMESPACE ) ) {
\t\t\t$response->header( 'X-Content-Type-Options', 'nosniff' );
\t\t\t$response->header( 'Referrer-Policy', 'strict-origin-when-cross-origin' );
\t\t\t$response->header( 'Permissions-Policy', 'camera=(), microphone=(), geolocation=()' );
\t\t\t$protected_mutation = ! in_array( $method, array( 'GET', 'HEAD', 'OPTIONS' ), true );
\t\t\t$sensitive_read = false !== strpos( $route, '/appointments' ) || false !== strpos( $route, '/slot-holds' ) || false !== strpos( $route, '/complaints' ) || false !== strpos( $route, '/health' );
\t\t\tif ( $protected_mutation || $sensitive_read ) {
\t\t\t\t$response->header( 'Cache-Control', 'private, no-store, max-age=0' );
\t\t\t\t$response->header( 'Pragma', 'no-cache' );
\t\t\t\t$response->header( 'X-Robots-Tag', 'noindex, nofollow, noarchive' );
\t\t\t}
\t\t}
\t\treturn $response;
\t}
"""
          if old not in s:
              raise SystemExit('R5 security_headers target not found')
          p.write_text(s.replace(old,new,1))
          PY
          php -l includes/class-wca-rest.php
          python3 - <<'PY'
          from pathlib import Path
          s=Path('includes/class-wca-rest.php').read_text()
          b=s[s.index('public static function security_headers('):]
          assert '$protected_mutation' in b and '$sensitive_read' in b
          assert "array( 'GET', 'HEAD', 'OPTIONS' )" in b
          assert "Pragma', 'no-cache'" in b
          PY
          git config user.name "Sabri File 08 QA"
          git config user.email "actions@users.noreply.github.com"
          git add includes/class-wca-rest.php
          git diff --cached --quiet && exit 1 || true
          git commit -m "File 08 third review R5: no-store protected mutation responses"
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
