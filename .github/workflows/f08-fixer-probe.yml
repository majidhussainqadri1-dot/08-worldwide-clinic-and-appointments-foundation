name: F08 Third Review R4 Fix

on:
  push:
    branches: [codex/file08-new-governing-plans-completion-2026]
    paths: [.github/workflows/f08-fixer-probe.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0
      - name: Require optimistic concurrency at canonical transition root
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('includes/class-wca-service.php')
          s=p.read_text()
          old=(
          "\t\t$expected_status  = WCA_Contracts::normalize_appointment_status( $data['expected_status'] ?? SWC_Helpers::status( $appointment_id ) );\n"
          "\t\t$expected_version = absint( $data['expected_version'] ?? SWC_Helpers::record_version( $appointment_id ) );\n"
          )
          new=(
          "\t\tif ( empty( $data['expected_status'] ) || ! isset( $data['expected_version'] ) || absint( $data['expected_version'] ) < 1 ) {\n"
          "\t\t\treturn new WP_Error( 'wca_transition_precondition_required', __( 'Current appointment status and positive record version are required.', 'worldwide-clinic-appointments' ), array( 'status' => 409 ) );\n"
          "\t\t}\n"
          "\t\t$expected_status  = WCA_Contracts::normalize_appointment_status( $data['expected_status'] );\n"
          "\t\t$expected_version = absint( $data['expected_version'] );\n"
          )
          start=s.index('public static function transition_appointment(')
          region=s[start:s.index('private static function event_for_transition(',start)]
          if old not in region:
              raise SystemExit('R4 exact transition precondition target not found')
          p.write_text(s[:start]+region.replace(old,new,1)+s[start+len(region):])
          PY
          php -l includes/class-wca-service.php
          python3 - <<'PY'
          from pathlib import Path
          s=Path('includes/class-wca-service.php').read_text()
          b=s[s.index('public static function transition_appointment('):s.index('private static function event_for_transition(')]
          assert 'wca_transition_precondition_required' in b
          assert "expected_status'] ?? SWC_Helpers::status" not in b
          assert "expected_version'] ?? SWC_Helpers::record_version" not in b
          PY
          git config user.name "Sabri File 08 QA"
          git config user.email "actions@users.noreply.github.com"
          git add includes/class-wca-service.php
          git diff --cached --quiet && exit 1 || true
          git commit -m "File 08 third review R4: require transition preconditions at service root"
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
