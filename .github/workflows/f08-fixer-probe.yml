name: F08 Third Review R9 Fix

on:
  push:
    branches: [codex/file08-new-governing-plans-completion-2026]
    paths: [.github/workflows/f08-fixer-probe.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0
      - run: python3 tools/f08-r9-patch.py
      - name: Syntax and identity checks
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          grep -q 'Version: 1.2.3' worldwide-clinic.php
          grep -q "WCA_VERSION', '1.2.3" worldwide-clinic.php
          grep -q "RUNTIME_VERSION                 = '1.2.3'" includes/class-wca-contracts.php
          grep -q 'Stable tag: 1.2.3' readme.txt
          grep -q 'Runtime candidate: \*\*1.2.3\*\*' README.md
          grep -q 'Runtime candidate: \*\*1.2.3\*\*' STATUS.md
          grep -q '## 1.2.3 — 2026-08-11' CHANGELOG.md
          echo 'Remaining historical 1.2.2 references:'
          grep -RIn --exclude-dir=.git --exclude='f08-r9-patch.py' '1\.2\.2' . || true
      - name: Commit corrected release identity
        run: |
          set -e
          git config user.name "Sabri File 08 QA"
          git config user.email "actions@users.noreply.github.com"
          git add worldwide-clinic.php includes/class-wca-contracts.php tests README.md STATUS.md readme.txt CHANGELOG.md
          git diff --cached --quiet && exit 1 || true
          git commit -m "File 08 third review R9: align v1.2.3 release and regression identity"
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
