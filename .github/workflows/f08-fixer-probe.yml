name: F08 Third Review R8 Fix

on:
  push:
    branches: [codex/file08-new-governing-plans-completion-2026]
    paths: [.github/workflows/f08-fixer-probe.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0
      - run: python3 tools/f08-r8-patch.py
      - run: php -l includes/class-wca-service.php
      - name: Commit corrected source
        run: |
          set -e
          grep -q "wca_service_doctor_scope" includes/class-wca-service.php
          grep -q "wca_availability_doctor_scope" includes/class-wca-service.php
          grep -q "private static function doctor_may_serve_clinic" includes/class-wca-service.php
          git config user.name "Sabri File 08 QA"
          git config user.email "actions@users.noreply.github.com"
          git add includes/class-wca-service.php
          git diff --cached --quiet && exit 1 || true
          git commit -m "File 08 third review R8: enforce doctor-clinic scope at service roots"
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
