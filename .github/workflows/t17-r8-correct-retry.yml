name: File 08 T17 R8 Frozen Privacy Correction Retry
on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
    paths:
      - .github/workflows/t17-r8-correct-retry.yml
permissions:
  contents: write
jobs:
  correct-and-retest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Freeze exact pre-correction head
        run: |
          set -euo pipefail
          git rev-parse HEAD
      - name: Apply complete frozen R8 correction set and repair test harness only
        run: |
          set -euo pipefail
          python3 tools/t17-r8-correct.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/seventeenth-r8-privacy-legal-hold-regressions.php')
          s = p.read_text()
          replacements = {
              '"WCA_Privacy::legal_hold( $appointment_id )"': '"WCA_Privacy::legal_hold( \\$appointment_id )"',
              '"$base . \'_guardian\'"': '"\\$base . \'_guardian\'"',
              '"self::legal_hold( \'intake\', $guardian_row )"': '"self::legal_hold( \'intake\', \\$guardian_row )"',
              '"array( \'id\' => $row_id, \'guardian_user_id\' => $user_id )"': '"array( \'id\' => \\$row_id, \'guardian_user_id\' => \\$user_id )"',
              '"array( \'guardian_user_id\' => $user_id ), array( \'%d\' ), array( \'%d\' )"': '"array( \'guardian_user_id\' => \\$user_id ), array( \'%d\' ), array( \'%d\' )"',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected R8 test-harness needle: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: R8 full correction retest
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/r8-correction-lint.txt
          php -d display_errors=1 -d error_reporting=E_ALL tests/run-all.php | tee /tmp/r8-correction-tests.txt
          ! grep -Eq 'PHP (Warning|Notice|Deprecated|Fatal|Parse)|Warning:|Notice:|Deprecated:' /tmp/r8-correction-tests.txt
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
      - name: Commit correction only after full retest passes
        run: |
          set -euo pipefail
          git config user.name 'Sabri File 08 Review Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add includes/class-wca-privacy.php includes/class-wca-continuity-secure.php includes/class-swc-privacy.php tests/run-all.php tests/seventeenth-r8-privacy-legal-hold-regressions.php
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No R8 source correction diff found.' >&2
            exit 1
          fi
          git commit -m 'fix(file08): preserve privacy legal holds across legacy and continuity erasure'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
          git rev-parse HEAD
