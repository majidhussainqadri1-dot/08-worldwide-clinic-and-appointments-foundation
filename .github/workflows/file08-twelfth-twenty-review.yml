name: File 08 Twelfth Fresh Sequential 20-Round Review

on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
    paths:
      - '.github/workflows/file08-twelfth-twenty-review.yml'

permissions:
  contents: write

jobs:
  sequential-review:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout review branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip
      - name: Configure committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Run twenty sequential review fix retest rounds
        shell: bash
        run: |
          set -euo pipefail
          BASELINE=744886c52e4d5e6cf7a7f24c6c5610efda03e12c
          git cat-file -e "$BASELINE^{commit}"
          git diff --quiet "$BASELINE" -- worldwide-clinic.php includes assets templates uninstall.php tests README.md STATUS.md CHANGELOG.md readme.txt
          qa() {
            find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/file08-php-lint.log
            php tests/run-all.php 2>&1 | tee /tmp/file08-tests.log
            ! grep -E 'PHP (Warning|Notice|Deprecated|Fatal|Parse)' /tmp/file08-tests.log
            node --check assets/js/clinic.js
            node --check assets/js/continuity.js
            node --check assets/js/future24.js
            test -z "$(find . -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '*.p12' -o -name '*.b64' \) -print -quit)"
            test -z "$(find . -type l -print -quit)"
            test ! -e .gitmodules
            ! grep -RInE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' --exclude-dir=.git .
          }
          for n in $(seq 1 20); do
            printf -v rr '%02d' "$n"
            echo "===== T12-R${rr} review -> correction -> full corrected-state QA ====="
            python3 tools/twelfth-twenty-review-patcher.py "$n"
            qa
            git add -A
            git commit -m "File 08 T12-R${rr}: correct sequential review finding"
            git push origin HEAD:codex/file08-new-governing-plans-completion-2026
            echo "T12-R${rr} ACCEPTED commit=$(git rev-parse HEAD)"
          done
          echo '===== Post-round release/test/document closure ====='
          python3 tools/twelfth-twenty-review-patcher.py release
          qa
          git add -A
          git commit -m 'File 08: close twelfth 20-round source at v1.2.12'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
          echo "T12_RELEASE_HEAD=$(git rev-parse HEAD)"
          echo '===== Remove transient twelfth-review orchestration ====='
          git rm tools/twelfth-twenty-review-patcher.py .github/workflows/file08-twelfth-twenty-review.yml
          qa
          git add -A
          git commit -m 'File 08: remove transient twelfth-review tooling'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
          echo "FINAL_SOURCE_HEAD=$(git rev-parse HEAD)"
