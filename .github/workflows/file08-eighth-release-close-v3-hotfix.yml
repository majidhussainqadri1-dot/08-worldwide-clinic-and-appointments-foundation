name: File 08 Eighth Release Gate Assertion Hotfix

on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
    paths:
      - '.github/workflows/file08-eighth-release-close-v3-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix-release-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout review branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0
      - name: Make release gate assertions architecture-safe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/file08-eighth-release-close-v2.yml')
          s=p.read_text()
          replacements={
            "t810has('doctor suspension bounded terminal page',$service,'while ( count( $appointments ) === $batch )');":"t810has('doctor suspension bounded terminal page',$service,'while ( 200 === count( $appointments ) )');",
            "t810has('continuity due reminder CAS',$continuity,'row_version=row_version+1');":"t810has('continuity due reminder CAS',$continuity,'version=version+1');",
            "t810has('practitioner ref advisory lock',$guard,'SELECT GET_LOCK(%s, 3)');":"t810has('practitioner ref advisory lock',$guard,'SELECT GET_LOCK(%s,3)');",
          }
          for old,new in replacements.items():
              if old not in s: raise SystemExit('missing gate assertion: '+old)
              s=s.replace(old,new,1)
          cleanup="            .github/workflows/file08-eighth-release-close-v2.yml \\\n"
          add=cleanup+"            .github/workflows/file08-eighth-release-close-v3-hotfix.yml \\\n"
          if '.github/workflows/file08-eighth-release-close-v3-hotfix.yml \\' not in s:
              if cleanup not in s: raise SystemExit('cleanup anchor missing')
              s=s.replace(cleanup,add,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/file08-eighth-release-close-v2.yml
          git commit -m 'File 08: harden eighth release regression gate assertions'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
