name: File 08 T15 R1 Post-Review Correction
on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
    paths:
      - .github/workflows/t15-r1-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
          fetch-depth: 0
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip
      - name: Apply all R1 findings after completed review
        run: |
          set -euo pipefail
          python3 tools/t15-r1-fix.py
          # The first R1 retest exposed only a test-harness PHP interpolation error.
          # Escape dollar signs in the four literal source needles before rerunning QA;
          # this changes no product finding or product code.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/fifteenth-twenty-review-regressions.php')
          s = p.read_text()
          replacements = {
              '"null === $rows || \'\' !== (string) $wpdb->last_error"': '"null === \\$rows || \'\' !== (string) \\$wpdb->last_error"',
              '"null === $hits_raw || \'\' !== (string) $wpdb->last_error"': '"null === \\$hits_raw || \'\' !== (string) \\$wpdb->last_error"',
              '"return (bool) $hold_id;"': '"return (bool) \\$hold_id;"',
              '"return (bool) $busy;"': '"return (bool) \\$busy;"',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit('T15 test-harness literal not found: ' + old)
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Full corrected-state retest
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          php tests/run-all.php
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
      - name: Commit corrected R1 state
        run: |
          set -euo pipefail
          rm -f tools/t15-r1-fix.py .github/workflows/t15-r1-apply.yml
          git config user.name 'File 08 Corrective Auditor'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'File 08 T15 R1: fix all completed-review findings'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
