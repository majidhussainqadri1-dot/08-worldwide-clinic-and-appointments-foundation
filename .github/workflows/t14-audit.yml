name: File 08 T14 Deep Static Audit Inventory
on:
  push:
    branches:
      - codex/file08-new-governing-plans-completion-2026
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-new-governing-plans-completion-2026
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip
      - name: Freeze identity
        run: |
          echo HEAD=$(git rev-parse HEAD)
          grep -nE 'Version:|WCA_VERSION' worldwide-clinic.php | head -10
      - name: Suspicious persistence and fail-open patterns
        shell: bash
        run: |
          set +e
          echo '=== direct post/meta/user/option mutations ==='
          grep -RInE '\b(update|add|delete)_(post_meta|user_meta|option)\s*\(' includes --include='*.php' | head -400
          echo '=== wpdb writes ==='
          grep -RInE '\$wpdb->(insert|update|delete|query)\s*\(' includes --include='*.php' | head -500
          echo '=== silent clamp/default patterns ==='
          grep -RInE 'min\s*\(|max\s*\(|absint\s*\(|\?\?\s*[0-9]+|:\s*[0-9]+;' includes --include='*.php' | head -500
          echo '=== broad catches / ignored errors ==='
          grep -RInE 'catch\s*\(|is_wp_error|WP_Error' includes --include='*.php' | head -500
          echo '=== pagination ceilings ==='
          grep -RInE '(LIMIT\s+[0-9]+|posts_per_page.*[0-9]+|page\s*[<]=?\s*[0-9]+|array_slice\s*\()' includes --include='*.php' | head -500
          echo '=== randomness / hashes / tokens ==='
          grep -RInE '(mt_rand|rand\(|uniqid\(|md5\(|sha1\(|wp_rand\(|random_bytes|wp_generate_uuid4)' includes --include='*.php' | head -300
          echo '=== time parsing / timezone defaults ==='
          grep -RInE '(strtotime|DateTime|DateTimeImmutable|DateTimeZone|UTC|timezone)' includes --include='*.php' | head -500
      - name: Run full current source QA
        run: php tests/run-all.php
