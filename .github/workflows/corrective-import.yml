name: Controlled Corrective Import

on:
  push:
    branches:
      - fix/file-08-corrective-completion

permissions:
  contents: write

concurrency:
  group: file-08-corrective-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: fix/file-08-corrective-completion

      - name: Detect ready marker
        id: marker
        shell: bash
        run: |
          if [[ -f .source-import/READY ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up PHP
        if: steps.marker.outputs.run == 'true'
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.3'
          coverage: none

      - name: Decode and verify corrective tree
        if: steps.marker.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .source-import/part-* | base64 --decode > /tmp/file08-corrective.zip
          echo '167e8bd5f260865f4f8f0daf6f7ce0d038e6714eac1b800c0c5a3b50de0c9f1f  /tmp/file08-corrective.zip' | sha256sum --check -
          unzip -t /tmp/file08-corrective.zip
          rm -rf /tmp/file08-corrective
          mkdir -p /tmp/file08-corrective
          unzip -q /tmp/file08-corrective.zip -d /tmp/file08-corrective
          test -f /tmp/file08-corrective/corrective/worldwide-clinic.php
          cp -a /tmp/file08-corrective/corrective/. ./

      - name: Validate corrective source
        if: steps.marker.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' -not -path './vendor/*' -print0)
          php tests/run.php
          php tests/check-contrast.php
          sha256sum --check CORRECTIVE-CHECKSUMS.sha256

      - name: Commit corrective completion
        if: steps.marker.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .source-import .github/workflows/corrective-import.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete File 08 corrective implementation'
          git push origin HEAD:fix/file-08-corrective-completion
