name: File 08 T16 R8 Post-Review Correction v2
on:
  push:
    branches: [codex/file08-new-governing-plans-completion-2026]
    paths: [.github/workflows/t16-r8-correction-v2.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: codex/file08-new-governing-plans-completion-2026, fetch-depth: 0}
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with: {php-version: '8.3', coverage: none}
      - name: Apply closed R8 defect ledger
        run: python3 tools/t16-r8-correct.py
      - name: Repair regression needles to be literal PHP strings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/sixteenth-twenty-review-regressions.php')
          s=p.read_text()
          s=s.replace("t16h('R8 slot hold TTL persists validated value','includes/class-wca-repository.php',\"time() + $ttl\");", "t16h('R8 slot hold TTL persists validated value','includes/class-wca-repository.php','time() + $ttl');")
          s=s.replace("t16h('R8 payment amount uses strict integer range','includes/class-wca-repository.php',\"WCA_Service::strict_int( $amount_raw, 0, PHP_INT_MAX )\");", "t16h('R8 payment amount uses strict integer range','includes/class-wca-repository.php','WCA_Service::strict_int( $amount_raw, 0, PHP_INT_MAX )');")
          p.write_text(s)
          PY
      - name: Full corrected-state QA
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          php tests/run-all.php
          node --check assets/js/clinic.js
          node --check assets/js/continuity.js
          node --check assets/js/future24.js
      - name: Commit corrected green state
        run: |
          set -euo pipefail
          git config user.name majidhussainqadri1-dot
          git config user.email majidhussainqadri1@gmail.com
          git add includes/class-wca-repository.php tests/sixteenth-twenty-review-regressions.php
          git diff --cached --check
          git commit -m 'T16 R8: enforce strict persistence input ranges'
          git push origin HEAD:codex/file08-new-governing-plans-completion-2026
          echo CORRECTED_HEAD=$(git rev-parse HEAD)
