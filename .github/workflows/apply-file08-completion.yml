name: Apply File 08 Completion Payload

on:
  push:
    branches:
      - codex/file08-complete-master-plan-1.0.0

permissions:
  contents: write

concurrency:
  group: file08-completion-apply
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out completion branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/file08-complete-master-plan-1.0.0
          fetch-depth: 0

      - name: Reconstruct and apply source
        shell: bash
        run: |
          set -euo pipefail
          cat .codex/file08-payload-part-* > /tmp/file08.b64
          base64 -d /tmp/file08.b64 > /tmp/file08.tar.gz
          tar -xzf /tmp/file08.tar.gz -C .
          rm -rf .codex
          rm -f .github/workflows/apply-file08-completion.yml

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none

      - name: Verify exact applied source
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          node --check assets/js/clinic.js
          php tests/run-all.php

      - name: Commit completed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(file-08): complete 2026 master plan implementation"
          git push origin HEAD:codex/file08-complete-master-plan-1.0.0
