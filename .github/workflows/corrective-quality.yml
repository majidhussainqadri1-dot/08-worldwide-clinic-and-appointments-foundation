name: Corrective Quality

on:
  push:
    branches:
      - fix/file-08-corrective-completion
  pull_request:
    branches:
      - audit/file-08-source-review

permissions:
  contents: read

concurrency:
  group: file-08-corrective-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP, JavaScript, privacy, lifecycle, and accessibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' -not -path './vendor/*' -print0)

      - name: Run corrective regression checks
        run: php tests/run.php

      - name: Verify accessible primary contrast
        run: php tests/check-contrast.php

      - name: Verify corrective checksums
        run: sha256sum --check CORRECTIVE-CHECKSUMS.sha256

      - name: Reject temporary or secret files
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find . -type f \( -name '*.zip' -o -name '*.b64' -o -name '*.pem' -o -name '*.key' -o -name '.env' \) -print -quit)"
          test ! -e .source-import
