name: Corrective Quality

on:
  push:
    branches:
      - fix/file-08-corrective-completion
  pull_request:
    branches:
      - audit/file-08-source-review

permissions:
  contents: read

concurrency:
  group: file-08-corrective-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP, JavaScript, authority, privacy, lifecycle, projection, and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.js' -not -path './vendor/*' -print0)

      - name: Run corrective regression checks
        run: php tests/run.php

      - name: Verify authoritative File 00 and File 09 practitioner agreement
        run: php tests/doctor-authority.php

      - name: Verify File 08 public clinic projection contract
        run: php tests/public-clinic-projection.php

      - name: Verify accessible primary contrast
        run: php tests/check-contrast.php

      - name: Verify corrective checksums
        run: sha256sum --check CORRECTIVE-CHECKSUMS.sha256

      - name: Reject temporary or secret files
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find . -type f \( -name '*.zip' -o -name '*.b64' -o -name '*.pem' -o -name '*.key' -o -name '.env' \) -print -quit)"
          test ! -e .source-import

  candidate-package:
    name: Deterministic File 08 candidate
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up PHP with ZIP support
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip

      - name: Resolve immutable source inputs
        id: source
        shell: bash
        run: |
          set -euo pipefail
          version=$(php -r '$source=file_get_contents("worldwide-clinic.php"); if(!is_string($source)||preg_match("/^\\s*\\* Version:\\s*([^\\s]+)/m",$source,$m)!==1){exit(1);} echo $m[1];')
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build candidate twice
        shell: bash
        run: |
          set -euo pipefail
          php tools/build-development-candidate.php --output-dir=build/a --commit='${{ steps.source.outputs.commit_sha }}' --source-date-epoch='${{ steps.source.outputs.source_date_epoch }}'
          php tools/build-development-candidate.php --output-dir=build/b --commit='${{ steps.source.outputs.commit_sha }}' --source-date-epoch='${{ steps.source.outputs.source_date_epoch }}'

      - name: Verify reproducible output
        shell: bash
        run: |
          set -euo pipefail
          BASE="08-worldwide-clinic-and-appointments-foundation-${{ steps.source.outputs.version }}-candidate"
          cmp "build/a/${BASE}.zip" "build/b/${BASE}.zip"
          cmp "build/a/${BASE}.sha256" "build/b/${BASE}.sha256"
          cmp "build/a/${BASE}-manifest.json" "build/b/${BASE}-manifest.json"
          cd build/a
          sha256sum --check "${BASE}.sha256"

      - name: Assemble governed artifact
        shell: bash
        run: |
          set -euo pipefail
          BASE="08-worldwide-clinic-and-appointments-foundation-${{ steps.source.outputs.version }}-candidate"
          mkdir -p build/artifact
          cp "build/a/${BASE}.zip" build/artifact/
          cp "build/a/${BASE}.sha256" build/artifact/
          cp "build/a/${BASE}-manifest.json" build/artifact/

      - name: Independently verify assembled artifact
        run: php tools/verify-development-candidate.php --artifact=build/artifact

      - name: Upload candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: file-08-0.2.1-candidate-${{ steps.source.outputs.commit_sha }}
          path: build/artifact/
          if-no-files-found: error
          retention-days: 14
